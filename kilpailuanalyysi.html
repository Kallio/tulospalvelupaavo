    const m = map.sMin + ((px - map.padL) / map.pw) * map.spanX;
    if (m > map.xMax) { tip.hidden = true; redraw(); return; }
    redraw(px, py);
    tip.innerHTML = tipHtmlFor(view, m);
    tip.hidden = false;
    const wrap = c.parentElement;
    const wr = wrap.getBoundingClientRect();
    const ww = wrap.clientWidth || rect.width;
    tip.style.left = Math.max(0, Math.min(e.clientX - wr.left + 14, ww - 220)) + 'px';
    let ty = e.clientY - wr.top - (tip.offsetHeight || 0) - 10;
    if (ty < 2) ty = e.clientY - wr.top + 16;
    tip.style.top = ty + 'px';
  };
  let lastTouchEnd = 0;
  c.addEventListener('mousemove', (e) => {
    if (Date.now() - lastTouchEnd < 350) return;
    show(e);
  });
  c.addEventListener('mouseleave', () => { tip.hidden = true; redraw(); });
  // Touch: tap to inspect, release to hide. Suppresses the synthesized
  // mousemove that immediately follows a tap so the tooltip does not stick.
  let tapX = 0, tapY = 0;
  let lastTapStartMs = 0, lastTapStartX = 0, lastTapStartY = 0;
  c.addEventListener('touchstart', (e) => {
    const t = e.touches && e.touches[0];
    if (t) { tapX = t.clientX; tapY = t.clientY; show({ clientX: t.clientX, clientY: t.clientY }); }
    // Kill the browser's double-tap-to-zoom on the chart: cancel the second
    // tap of a double-tap at touchstart, before the browser can arm the zoom.
    // preventDefault() on touchend alone is too late in several browsers.
    // Timing/position is tracked from touchSTART to touchSTART rather than
    // through touchend: when the browser's gesture recognizer claims a tap as
    // the first half of a double-tap, it fires touchcancel instead of
    // touchend, and anything keyed off touchend would stop seeing that tap.
    // A drag is never caught here (a second finger cannot go down mid-drag),
    // so scrolling over the chart keeps working and the tooltip was already shown.
    if (t && isDoubleTapSecond(e.touches, lastTapStartMs, lastTapStartX, lastTapStartY)) {
      e.preventDefault();
    }
    if (t) { lastTapStartMs = Date.now(); lastTapStartX = t.clientX; lastTapStartY = t.clientY; }
  }, { passive: false });
  const endTap = (e) => {
    lastTouchEnd = Date.now();
    const t = e.changedTouches && e.changedTouches[0];
    if (t && Math.abs(t.clientX - tapX) < 10 && Math.abs(t.clientY - tapY) < 10) {
      if (e.cancelable) e.preventDefault();
    }
    tip.hidden = true;
    redraw();
  };
  c.addEventListener('touchend', endTap, { passive: false });
  c.addEventListener('touchcancel', endTap, { passive: false });
}

function paintCharts() {
  if (typeof document === 'undefined' || typeof document.querySelectorAll !== 'function') return;
  const canvases = document.querySelectorAll('canvas[data-chart-id]');
  const dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
  for (let i = 0; i < canvases.length; i++) {
    const c = canvases[i];
    const cfg = chartStore[c.dataset.chartId];
    if (!cfg) continue;
    const parentW = c.parentElement ? c.parentElement.clientWidth : 800;
    const w = Math.max(200, parentW - 36);
    const h = cfg.type === 'pace'
      ? Math.max(120, 18 * (cfg.paces || []).length + 40)
      : cfg.type === 'schedule'
      ? scheduleChartHeight(cfg)
      : 280;
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
    c.style.width = w + 'px';
    c.style.height = h + 'px';
    if (cfg.type === 'flow') {
      cfg._el = c; cfg._w = w; cfg._h = h; cfg._dpr = dpr;
      paintFlow(c, cfg, w, h, dpr, null);
      attachChartTip(c);
    } else if (cfg.type === 'pace') {
      const ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      paintPace(ctx, w, h, cfg);
      attachPaceTip(c);
    } else if (cfg.type === 'schedule') {
      cfg._el = c; cfg._w = w; cfg._h = h; cfg._dpr = dpr;
      const ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      paintSchedule(ctx, w, h, cfg);
      attachScheduleTip(c);
    } else if (cfg.type === 'flowcmp') {
      cfg._el = c; cfg._w = w; cfg._h = h; cfg._dpr = dpr;
      const ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      paintFlowCompare(ctx, w, h, cfg);
      attachFlowCompareTip(c);
    }
  }
}

// Combined two-race flow overlay: for each race draws its cumulative start
// and finish step-curves (minutes relative to that race's own first start) on
// a shared axis, with the finishing window of the busiest 5-min bin shaded.
function paintFlowCompare(ctx, w, h, cfg) {
  ctx.clearRect(0, 0, w, h);
  const series = cfg.series || [];
  if (!series.length) return;
  const padL = 46, padR = 10, padT = 8, padB = 24;
  const pw = w - padL - padR;
  const ph = h - padT - padB;

  const allFinish = [];
  let xMax = 0;
  series.forEach(s => {
    if (s.starts.length) xMax = Math.max(xMax, s.starts[s.starts.length - 1]);
    if (s.finishes.length) xMax = Math.max(xMax, s.finishes[s.finishes.length - 1]);
    s.finishes.forEach(m => { if (isFinite(m)) allFinish.push(m); });
  });
  let yMax = 0;
  series.forEach(s => yMax = Math.max(yMax, s.starts.length, s.finishes.length));
  yMax = Math.max(yMax, 1);
  xMax = Math.max(xMax, 1);
  const spanX = xMax;
  const X = m => padL + (m / spanX) * pw;
  const Y = n => padT + ph - (n / yMax) * ph;

  // y-axis ticks
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  const yTicks = 4;
  for (let i = 0; i <= yTicks; i++) {
    const val = Math.round(yMax * i / yTicks);
    const y = Y(val);
    ctx.strokeStyle = '#e4e9f0';
    ctx.fillStyle = '#8a97a6';
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillText(String(val), padL - 5, y);
  }

  // x-axis ticks (shared relative minutes)
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const step = niceStep(spanX);
  for (let m = 0; m <= xMax + 0.01; m += step) {
    const x = X(m);
    ctx.strokeStyle = '#eef2f6';
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + ph); ctx.stroke();
    ctx.fillStyle = '#8a97a6';
    ctx.fillText(fmtMin(m), x, h - 14);
  }

  // peak shading for whichever race has the busiest window — use the union
  // is complex, so shade the busiest single-race window among the two.
  let gPeak = null;
  series.forEach(s => { if (s.peak && (!gPeak || s.peak.count > gPeak.count)) gPeak = s.peak; });
  if (gPeak && gPeak.count > 0) {
    const x0 = X(gPeak.from);
    const x1 = X(gPeak.to);
    if (x1 > x0) {
      ctx.fillStyle = 'rgba(230,126,34,0.14)';
      ctx.fillRect(x0, padT, x1 - x0, ph);
      const lbl = T('pPeak') + ' ' + fmtMin(gPeak.from) + '–' + fmtMin(gPeak.to) + ' · ' + gPeak.count;
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'left';
      const tw = ctx.measureText(lbl).width || 130;
      const lx = Math.max(padL, Math.min(x0 + 4, w - padR - tw - 8));
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.fillRect(lx, padT + 3, tw + 8, 15);
      ctx.fillStyle = '#b0560f';
      ctx.fillText(lbl, lx + 4, padT + 5);
    }
  }

  const stepCurve = (mins) => {
    const pts = [{ x: 0, y: 0 }];
    let n = 0;
    for (const v of mins) {
      pts.push({ x: v, y: n }); n++;
      pts.push({ x: v, y: n });
    }
    return pts;
  };

  series.forEach(s => {
    const draw = (mins, dash) => {
      const pts = stepCurve(mins);
      ctx.save();
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 2;
      ctx.setLineDash(dash || []);
      ctx.beginPath();
      let started = false;
      for (const p of pts) {
        if (p.x > xMax) break;
        const x = X(p.x), y = Y(p.y);
        if (!started) { ctx.moveTo(x, y); started = true; }
        else ctx.lineTo(x, y);
      }
      if (started) ctx.lineTo(X(xMax), Y(mins.length));
      ctx.stroke();
      ctx.restore();
    };
    draw(s.starts, []);
    draw(s.finishes, [5, 4]);
  });

  ctx.strokeStyle = '#c9d2dc';
  ctx.lineWidth = 1;
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(padL, padT + ph); ctx.lineTo(w - padR, padT + ph); ctx.stroke();

  cfg._cmpMap = { padL, padR, padT, padB, pw, spanX, xMax, yMax, h };
}

// Hit-tests hover position on the compare overlay and shows per-race finishing
// counts for the 5-min window under the cursor.
function attachFlowCompareTip(c) {
  if (typeof document === 'undefined' || typeof document.querySelector !== 'function') return;
  const tip = document.querySelector('[data-tip-for="' + c.dataset.chartId + '"]');
  if (!tip) return;
  const cfgOf = () => chartStore[c.dataset.chartId];
  const show = (clientX, clientY) => {
    const cfg = cfgOf();
    if (!cfg || !cfg._cmpMap) { tip.hidden = true; return; }
    const s = cfg._cmpMap;
    const rect = c.getBoundingClientRect();
    const px = clientX - rect.left, py = clientY - rect.top;
    if (px < s.padL || px > rect.width - s.padR || py < s.padT || py > rect.height - s.padB) {
      tip.hidden = true; return;
    }
    const m = ((px - s.padL) / s.pw) * s.spanX;
    const from = Math.floor(m / 5) * 5, to = from + 5;
    const parts = ['<b>' + esc(T('lWindow')) + ' ' + fmtMin(from) + '–' + fmtMin(to) + '</b>'];
    cfg.series.forEach(sr => {
      const fin = sr.finishes.filter(v => v >= from && v < to).length;
      const st = sr.starts.filter(v => v >= from && v < to).length;
      parts.push('<span class="tipcls"><span class="sw" style="background:' + sr.color + '"></span>' +
        esc(sr.name) + ' · ' + esc(T('lFinishing')) + ' ' + fin + ' · ' + esc(T('lStarting')) + ' ' + st + '</span>');
    });
    tip.innerHTML = parts.join('<br>');
    tip.hidden = false;
    const wrap = c.parentElement;
    const wr = wrap.getBoundingClientRect();
    const ww = wrap.clientWidth || rect.width;
    tip.style.left = Math.max(0, Math.min(clientX - wr.left + 14, ww - 220)) + 'px';
    let ty = clientY - wr.top - (tip.offsetHeight || 0) - 10;
    if (ty < 2) ty = clientY - wr.top + 16;
    tip.style.top = ty + 'px';
  };
  c.addEventListener('mousemove', (e) => show(e.clientX, e.clientY));
  c.addEventListener('mouseleave', () => { tip.hidden = true; });
  c.addEventListener('touchstart', (e) => {
    const t = e.touches && e.touches[0];
    if (t) show(t.clientX, t.clientY);
  }, { passive: true });
  c.addEventListener('touchend', () => { tip.hidden = true; }, { passive: true });
  c.addEventListener('touchcancel', () => { tip.hidden = true; }, { passive: true });
}


// ════════════════════════════════════════════════════════════════════
//  Rendering
// ════════════════════════════════════════════════════════════════════
function sectionHtml(title, inner) {
  return '<section class="panel"><h3 class="phead">' + title + '</h3>' + inner + '</section>';
}
function tableHtml(headers, rows) {
  if (!rows.length) return '<p class="empty">' + T('empty') + '</p>';
  return '<div class="tblwrap"><table><thead><tr>' +
    headers.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') +
    '</tbody></table></div>';
}
function cardHtml(label, value, sub) {
  return '<div class="card"><h4>' + label + '</h4><span class="num">' + value + '</span>' +
    (sub ? '<span class="sub">' + sub + '</span>' : '') + '</div>';
}
function legendInner(cfg, page) {
  const items = cfg.legendItems || [];
  const size = cfg.legendPageSize || 8;
  const total = Math.max(1, Math.ceil(items.length / size));
  const p = Math.max(0, Math.min(total - 1, page));
  const slice = items.slice(p * size, p * size + size);
  const hidden = cfg.hiddenIds || [];
  const sel = cfg.selKeys || [];
  const html = slice.map(it => {
    const off = it.key === 'started' ? !!cfg.hideStarts : hidden.indexOf(it.key) !== -1;
    const cb = it.key !== 'started'
      ? '<input type="checkbox"' + (sel.indexOf(it.key) !== -1 ? ' checked' : '') + ' aria-label="select">'
      : '';
    return '<button type="button" class="lg' + (off ? ' off' : '') + '" data-chart="' + cfg.id + '" data-idx="' + items.indexOf(it) + '">' +
      cb + '<span class="sw" style="background:' + it.color + '"></span>' + esc(it.name) + '</button>';
  }).join('');
  const controls = [];
  if (items.some(it => it.key !== 'started' && !it.combined)) {
    controls.push('<button type="button" class="lgcombine" data-chart="' + cfg.id + '" data-combine="1"' +
      (sel.length < 2 ? ' disabled' : '') + '>' + esc(T('lCombine')) + '</button>');
  }
  if (cfg.combines && cfg.combines.length) {
    controls.push('<button type="button" class="lgclear" data-chart="' + cfg.id + '" data-clear="1">' + esc(T('lClear')) + '</button>');
  }
  if (total > 1) {
    controls.push('<span class="lgpager">' +
      '<button type="button" data-chart="' + cfg.id + '" data-page="' + (p - 1) + '"' + (p === 0 ? ' disabled' : '') + '>‹</button>' +
      (p + 1) + '/' + total +
      '<button type="button" data-chart="' + cfg.id + '" data-page="' + (p + 1) + '"' + (p >= total - 1 ? ' disabled' : '') + '>›</button></span>');
  }
  const ctrl = controls.length ? '<span class="lgcontrols">' + controls.join('') + '</span>' : '';
  return html + ctrl;
}

function axisToggle(cfg) {
  return '<div class="axistoggle" data-chart="' + cfg.id + '">' +
    '<button type="button" data-chart="' + cfg.id + '" data-axis="rel"' + (cfg.xMode !== 'clock' ? ' class="on"' : '') + '>' + esc(T('aRel')) + '</button>' +
    '<button type="button" data-chart="' + cfg.id + '" data-axis="clock"' + (cfg.xMode === 'clock' ? ' class="on"' : '') + '>' + esc(T('aClock')) + '</button>' +
    '</div>';
}

function renderHeader(event) {
  const date = event.begin
    ? new Date(event.begin).toLocaleDateString(lang === 'fi' ? 'fi-FI' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' })
    : '';
  const org = event.organisation && event.organisation.name ? event.organisation.name : '';
  const place = event.address || '';
  const type = event.raceType === 'Relay' ? T('tRelay') : (isMultistageEvent(event) ? T('tMultistage') : T('tIndividual'));
  const logo = event.logoUrl ? '<img class="evlogo" src="' + escAttr(event.logoUrl) + '" alt="">' : '';
  return '<section class="evhead"><div><h2>' + esc(event.name || '') + '</h2>' +
    '<p>' + esc([date, org, place, type].filter(Boolean).join(' · ')) + '</p></div>' + logo + '</section>';
}

function durSec(a, b) {
  return (a != null && b != null) ? fmtTime(Math.round((b - a) / 1000)) : '—';
}

function flowCards(flow, onCourseCount) {
  const c = t => t != null ? fmtClock(t) : '—';
  const cards = [
    cardHtml(T('cStarters'), String(flow.starters)),
    cardHtml(T('cFinishers'), String(flow.finishers)),
    cardHtml(T('cDnf'), String(flow.dnf), onCourseCount ? esc(onCourseCount + ' ' + T('ocTitle').toLowerCase()) : null),
    cardHtml(T('cIntoForest'), durSec(flow.firstStart, flow.lastStart),
      esc(T('tFirstStart') + ' ' + c(flow.firstStart) + ' · ' + T('tLastStart') + ' ' + c(flow.lastStart))),
    cardHtml(T('cFirstResult'), durSec(flow.firstStart, flow.firstFinish),
      esc(T('tFirstFinish') + ' ' + c(flow.firstFinish))),
    cardHtml(T('cResultsWait'), durSec(flow.firstFinish, flow.lastFinish),
      esc(T('tFirstFinish') + ' ' + c(flow.firstFinish) + ' · ' + T('tLastFinish') + ' ' + c(flow.lastFinish))),
    cardHtml(T('cTotal'), durSec(flow.firstStart, flow.lastFinish),
      esc(T('tFirstStart') + ' ' + c(flow.firstStart) + ' · ' + T('tLastFinish') + ' ' + c(flow.lastFinish))),
  ];
  if (flow.firstExchange != null) {
    cards.push(cardHtml(T('cFirstExchange'), c(flow.firstExchange)));
  }
  const pk = finishPeak(flow.finishMinutes);
  if (pk && flow.finishMinutes.length) {
    const base = flow.firstStart != null ? flow.firstStart : flow.firstFinish;
    cards.push(cardHtml(T('cPeak'),
      fmtClock(base + pk.from * 60000) + '–' + fmtClock(base + pk.to * 60000) + ' · ' + pk.count));
  }
  return cards;
}

// Excluded-results / still-on-course box, returned separately from
// flowSection's HTML so callers can place it at the very end of the page
// instead of right after the summary cards.
function excludedBoxHtml(event, onCourse) {
  const excluded = droppedWarnings(event);
  const orphans = orphanWarnings(event);
  const massDev = massStartWarnings(event);
  const dataWarnings = excluded.concat(orphans).concat(massDev);
  if (dataWarnings.length) {
    return warnBoxHtml(T('warnTitle'), T('warnIntro'), dataWarnings,
      onCourse.length ? { title: T('ocTitle'), intro: T('ocIntro'), warnings: onCourse } : null);
  } else if (onCourse.length) {
    return warnBoxHtml(T('ocTitle'), T('ocIntro'), onCourse);
  }
  return '';
}

function flowSection(event) {
  const flow = eventFlow(event);
  const onCourse = onCourseWarnings(event);
  const warnBox = excludedBoxHtml(event, onCourse);
  const parts = ['<div class="cards">' + flowCards(flow, onCourse.length).join('') + '</div>'];
  if (!flow.starters && !flow.finishers) {
    parts.push('<p class="empty">' + T('noTimeline') + '</p>');
    return { html: parts.join('\n'), warnBox };
  }
  const chartId = 'ch' + (++chartSeq);
  const classes = classFlowSeries(event);
  const clockBase = flow.firstStart != null ? flow.firstStart : flow.firstFinish;
  const startByClass = flow.startByClass || {};
  const classIds = classes.map(c => c.id);
  const extraStartMins = [];
  Object.keys(startByClass).forEach(cid => {
    if (classIds.indexOf(cid) === -1) for (const m of startByClass[cid]) extraStartMins.push(m);
  });
  extraStartMins.sort((a, b) => a - b);
  const cfg = {
    type: 'flow', id: chartId,
    starts: flow.startMinutes, classes, clockBase, xMode: 'rel',
    startByClass, extraStartMins,
    markers: flow.relayMarkers || [],
  };
  rebuildLegendItems(cfg);
  parts.push(sectionHtml(T('secFlow'),
    '<div class="legend" data-chart="' + chartId + '">' + legendInner(cfg, 0) + '</div>' +
    axisToggle(cfg) +
    chartCanvas(cfg)));
  return { html: parts.join('\n'), warnBox };
}

// Body of an individual/relay analysis (header + cards + flow + pace +
// schedule + warnings), reused both for the single-race view and for each
// column of a two-race comparison. `Relay` and individual render the same
// set of panels here (header, flow, pace, schedule), so one shared body
// suffices; only the header text differs by race type via renderHeader.
function renderRaceBody(event) {
  const flow = flowSection(event);
  return renderHeader(event) + '\n' + flow.html + '\n' + paceSection(event) + '\n' + scheduleSection(event) + '\n' + flow.warnBox;
}

function renderIndividual(event) {
  return renderRaceBody(event);
}

function renderRelay(event) {
  return renderRaceBody(event);
}

function paceRefsLegend(refs) {
  return '<div class="pacerefs">' + refs.map(r =>
    '<span><span class="prswatch" style="border-top-color:' + escAttr(r.color || '#c46a2a') + '"></span>' +
    esc(r.label + ' ' + fmtTime(r.paceSec)) + '</span>'
  ).join('') + '</div>';
}

function paceSection(event) {
  const paces = classPaces(event);
  if (!paces.length) return '';
  const id = 'ch' + (++chartSeq);
  return sectionHtml(T('secClassPaces'),
    chartCanvas({ type: 'pace', id, paces, refs: PACE_REFS }) + '<p class="chartcap">' + esc(T('hPace')) + '</p>' +
    paceRefsLegend(PACE_REFS));
}

// Total canvas height for the schedule chart: class bars (rowCount rows) plus
// the per-lane track below (maxLanes rows), plus fixed padding for axes/title.
function scheduleChartHeight(cfg) {
  const rowCount = cfg.rowCount || (cfg.classes || []).length;
  const maxLanes = cfg.maxLanes || 0;
  return Math.max(120, rowCount * 24 + maxLanes * 18 + 80);
}

// Auto-detect classes that start at exactly the same time and suggest grouping.
// Returns array of arrays of classIds.
function autoDetectGroups(event) {
  const results = event.results || [];
  let startResults;
  if (event.raceType === 'Relay') {
    const teams = results.filter(r => r.resultType === 'Team');
    startResults = teams.length && teams.some(t => t.startTime)
      ? teams
      : results.filter(r => r.resultType !== 'Team' && r.leg === 1);
  } else {
    startResults = results.filter(r => r.resultType !== 'Team');
  }
  // Collect first start time per class
  const firstByClass = {};
  startResults.forEach(r => {
    const start = parseTS(r.startTime);
    if (start == null) return;
    const cid = r.classId || '';
    if (firstByClass[cid] == null || start < firstByClass[cid]) firstByClass[cid] = start;
  });
  // Group classes with same first start time
  const timeToClasses = {};
  Object.entries(firstByClass).forEach(([cid, t]) => {
    if (!timeToClasses[t]) timeToClasses[t] = [];
    timeToClasses[t].push(cid);
  });
  const cc = {};
  (event.courseClasses || []).forEach(c => { cc[c.id] = c.name; });
  return Object.values(timeToClasses)
    .filter(ids => ids.length >= 2)
    .map(ids => ids.sort((a, b) => compareClassNames(cc[a] || a, cc[b] || b)));
}

function scheduleSection(event) {
  const sd = scheduleData(event);
  if (!sd) return '';
  const id = 'ch' + (++chartSeq);
  const cfg = {
    type: 'schedule', id, classes: sd.classes, maxLanes: sd.maxLanes,
    base: sd.base, waveCount: sd.waveCount, rowCount: sd.rowCount, starts: sd.starts,
    groups: [], event,
  };
  const h = scheduleChartHeight(cfg);
  chartStore[id] = cfg;
  const summary = '<p class="schsummary">' + esc(T('schMax')) + ' ' + sd.maxLanes + ' ' + esc(T('schLanes')) + '</p>';
  const controls = '<div class="schcontrols">' +
    '<button data-sch-auto="' + id + '" class="schbtn">' + esc(T('schGroupAuto')) + '</button>' +
    '<button data-sch-clear="' + id + '" class="schbtn">' + esc(T('schGroupClear')) + '</button>' +
    '</div>';
  return sectionHtml(T('secSchedule'),
    summary + controls +
    '<div class="chartwrap"><canvas data-chart-id="' + id + '" class="chart" style="height:' + h + 'px"></canvas>' +
    '<div class="charttip" data-tip-for="' + id + '" hidden></div></div>');
}

function renderMultistage() {
  const stages = state.stageEvents;
  const out = [renderHeader(state.event)];
  if (!stages.length) {
    out.push('<p class="empty">' + T('noStages') + '</p>');
    return out.join('\n');
  }
  stages.forEach((s, i) => {
    out.push('<div class="stagehead"><h3>' + T('secStage') + ' ' + (s.stageNumber || (i + 1)) +
      (s.name ? ' — ' + esc(s.name) : '') + '</h3></div>');
    const flow = flowSection(s);
    out.push(flow.html);
    out.push(paceSection(s));
    out.push(scheduleSection(s));
    out.push(flow.warnBox);
  });
  return out.join('\n');
}

// One column of a two-race comparison: a compact header tag + the full
// single-race analysis body (cards, flow, pace, schedule, warnings).
function compareColHtml(event, tag) {
  const name = event.name || tag;
  const flowHtml = flowSection(event);
  let inner = flowHtml.html + '\n' + paceSection(event) + '\n' + scheduleSection(event) + '\n' + flowHtml.warnBox;
  return '<div class="cmpcol"><div class="cmphdr"><span class="cmptag">' + esc(tag) + '</span>' +
    '<span class="cmpname">' + esc(name) + '</span></div>' + inner + '</div>';
}

// Combined pace comparison table (shared classes, A vs B pace + delta).
function comparePaceSection(eventA, eventB) {
  const rows = comparePaceRows(eventA, eventB);
  if (!rows.length) return '';
  const rowsHtml = rows.map(r => {
    const faster = r.delta > 0 ? 'B' : 'A';
    return '<tr>' +
      '<td>' + esc(r.className) + '</td>' +
      '<td class="num">' + (r.paceA != null ? fmtTime(r.paceA) : '—') + ' <span class="pacetype">(' + r.runnersA + ')</span></td>' +
      '<td class="num">' + (r.paceB != null ? fmtTime(r.paceB) : '—') + ' <span class="pacetype">(' + r.runnersB + ')</span></td>' +
      '<td class="num delta">' + (r.delta === 0 ? '0:00' : (r.delta > 0 ? '+' : '−') + fmtTime(Math.abs(r.delta))) +
      ' <span class="cmpfast" style="color:' + (faster === 'A' ? '#2e5a8a' : '#e15759') + '">(' + faster + ')</span></td>' +
      '</tr>';
  }).join('');
  return sectionHtml(T('secComparePace'),
    '<table><thead><tr>' +
    '<th>' + esc(T('hClass')) + '</th>' +
    '<th class="num">' + esc(T('raceA')) + ' · min/km</th>' +
    '<th class="num">' + esc(T('raceB')) + ' · min/km</th>' +
    '<th class="num delta">' + esc(T('hPaceDelta')) + '</th>' +
    '</tr></thead><tbody>' + rowsHtml + '</tbody></table>');
}

// Combined flow overlay chart (both races' start/finish curves on a shared
// relative axis) plus its legend.
function compareFlowSection(series) {
  const id = 'ch' + (++chartSeq);
  chartStore[id] = { type: 'flowcmp', id, series };
  const legend = '<div class="cmplegend">' + series.map(s =>
    '<span><span class="clsw" style="background:' + s.color + '"></span>' + esc(s.name) +
    ' — ' + esc(T('lStarted')) + ' (—) · ' + esc(T('hFin')) + ' (···)</span>'
  ).join('') + '</div>';
  return sectionHtml(T('secCompareFlow') +
    '<div class="cmpbanner">' + esc(T('aRel')) + '</div>' + legend +
    chartCanvas({ type: 'flowcmp', id, series }));
}

// Full two-race comparison render: banner + pace table + overlay flow chart,
// then the two per-race columns side by side.
function renderCompare() {
  const a = state.compare.a;
  const b = state.compare.b;
  if (!a || !b) return '';
  const series = compareFlowSeries(a, b);
  const header = '<section class="evhead"><div><h2>' + esc(T('compareToggle')) + '</h2>' +
    '<p>' + esc(a.name) + ' · ' + esc(b.name) + '</p></div></section>';
  const parts = [header];
  const pace = comparePaceSection(a, b);
  if (pace) parts.push(pace);
  parts.push(compareFlowSection(series));
  parts.push('<div class="cmpwrap">' + compareColHtml(a, T('raceA')) + compareColHtml(b, T('raceB')) + '</div>');
  return parts.join('\n');
}

function render() {
  if (state.mode === 'compare' && state.compare.a && state.compare.b) {
    const out = $('output');
    if (out) { out.innerHTML = renderCompare(); paintCharts(); }
    return;
  }
  const event = state.event;
  if (!event) return;
  let html;
  if (isMultistageEvent(event)) html = renderMultistage();
  else if (event.raceType === 'Relay') html = renderRelay(event);
  else html = renderIndividual(event);
  const out = $('output');
  if (out) {
    out.innerHTML = html;
    paintCharts();
  }
}

// ════════════════════════════════════════════════════════════════════
//  Share link: the resolved slug/UUID lives directly as the URL hash (e.g.
//  "#hyvinkaan-talvirastit-2026") — no query-string key, since the slug is
//  the only piece of state worth persisting and this keeps the link short.
// ════════════════════════════════════════════════════════════════════
function slugFromHash() {
  if (typeof location === 'undefined' || !location.hash) return '';
  try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ''; }
}
function setShareHash(slug) {
  if (typeof history === 'undefined' || typeof location === 'undefined') return;
  const enc = encodeURIComponent(slug);
  if (location.hash.slice(1) !== enc) {
    history.replaceState(null, '', location.pathname + location.search + '#' + enc);
  }
}
async function shareLink() {
  if (typeof location === 'undefined') return;
  try {
    await navigator.clipboard.writeText(location.href);
    setStatus(T('shareCopied'), 'ok');
  } catch (e) {
    setStatus(location.href, 'ok');
  }
}

// ════════════════════════════════════════════════════════════════════
//  Orchestration
// ════════════════════════════════════════════════════════════════════
async function analyze(inputOverride) {
  const input = (inputOverride != null ? inputOverride : $('slugInput') ? $('slugInput').value : '').trim();
  if (!input) return;
  setStatus(T('statusLoading') + ' …', 'ok');
  state.event = null;
  state.stageEvents = [];
  try {
    const event = await fetchEvent(input);
    state.event = event;
    if (typeof document !== 'undefined') {
      // So a shared link's browser tab (and history entry) identifies the
      // event on its own, without needing to open it first.
      document.title = event.name ? event.name + ' – Kilpailuanalyysi' : 'Tulospalvelupaavon kilpailuanalyysi - Navisport tapahtumasta';
    }
    const id = extractSlug(input);
    if (id) setShareHash(id);
    const sb = $('shareBtn');
    if (sb) sb.style.display = '';
    if (isMultistageEvent(event)) {
      const stages = event.events || [];
      for (let i = 0; i < stages.length; i++) {
        try {
          setStatus(T('statusLoading') + ' — ' + (i + 1) + '/' + stages.length + ' …', 'ok');
          const se = await fetchEventByUUID(stages[i].id);
          se.stageNumber = stages[i].stageNumber != null ? stages[i].stageNumber : i + 1;
          state.stageEvents.push(se);
        } catch (e) {
          console.warn('Stage load failed:', stages[i].id, e);
        }
      }
    }
    render();
    setStatus(T('statusDone'), 'ok');
  } catch (e) {
    setStatus(T('errFetch') + ': ' + e.message, 'err');
    console.error(e);
  }
}

// Switch between single-race and compare input UI (both urlbars stay in the
// DOM; we just show/hide and repopulate placeholders/labels).
function setMode(mode) {
  const valid = mode === 'compare' ? mode : 'single';
  state.mode = valid;
  const single = $('urlbarSingle');
  const cmp = $('compareUrlbar');
  if (single) single.style.display = valid === 'compare' ? 'none' : '';
  if (cmp) cmp.style.display = valid === 'compare' ? '' : 'none';
  const tbtn = $('compareToggleBtn');
  if (tbtn) {
    tbtn.textContent = valid === 'compare' ? T('compareToggleOn') : T('compareToggle');
    tbtn.classList.toggle('btn-hdr-active', valid === 'compare');
  }
  const lblA = $('labelA');
  if (lblA) lblA.textContent = T('raceA');
  const lblB = $('labelB');
  if (lblB) lblB.textContent = T('raceB');
}

// Parse the current URL hash. Returns { mode, slug } for a single race or
// { mode:'compare', a, b } for a compare pair.
function parseHash(hashVal) {
  const h = hashVal != null ? hashVal : slugFromHash();
  if (!h) return null;
  const parts = h.split('|');
  if (parts.length >= 2) return { mode: 'compare', a: parts[0], b: parts[1] };
  return { mode: 'single', slug: parts[0] };
}

function setCompareShareHash(a, b) {
  if (typeof history === 'undefined' || typeof location === 'undefined') return;
  const enc = encodeURIComponent(a + '|' + b);
  if (location.hash.slice(1) !== enc) {
    history.replaceState(null, '', location.pathname + location.search + '#' + enc);
  }
}

// Load both compare inputs by race label (A or B), allow partial success.
async function loadCompareOne(slot, input) {
  const id = input.trim();
  if (!id) return null;
  try {
    const ev = await fetchEvent(id);
    state.compare[slot] = ev;
    return ev;
  } catch (e) {
    setStatus((slot === 'a' ? T('compareLoadingA') : T('compareLoadingB')) + ' — ' + T('errFetch') + ': ' + e.message, 'err');
    console.error(e);
    return null;
  }
}

async function analyzeCompare(inputA, inputB) {
  const a0 = (inputA != null ? inputA : $('slugInputA') ? $('slugInputA').value : '').trim();
  const b0 = (inputB != null ? inputB : $('slugInputB') ? $('slugInputB').value : '').trim();
  if (!a0 || !b0) { setStatus(T('errCompareNeedTwo'), 'err'); return; }
  setStatus(T('statusLoading') + ' …', 'ok');
  state.mode = 'compare';
  state.compare.a = null;
  state.compare.b = null;
  const [a, b] = await Promise.all([loadCompareOne('a', a0), loadCompareOne('b', b0)]);
  if (typeof document !== 'undefined') {
    document.title = (a && a.name ? a.name : T('raceA')) + ' vs ' + (b && b.name ? b.name : T('raceB')) + ' – Kilpailuanalyysi';
  }
  const sb = $('shareBtn');
  if (sb) sb.style.display = (a && b) ? '' : 'none';
  if (a && b) {
    const sa = extractSlug(a0), sbb = extractSlug(b0);
    if (sa && sbb) setCompareShareHash(sa, sbb);
  }
  render();
  setStatus(T('statusDone'), 'ok');
}

// ════════════════════════════════════════════════════════════════════
//  CSV export
// ════════════════════════════════════════════════════════════════════
function toCSV(rows) {
  return rows.map(r => r.map(cell => {
    const s = String(cell == null ? '' : cell);
    return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\r\n');
}

function addFlowRows(rows, event) {
  const flow = eventFlow(event);
  const sec = (a, b) => a != null && b != null ? Math.round((b - a) / 1000) : '';
  rows.push([T('cStarters'), flow.starters]);
  rows.push([T('cFinishers'), flow.finishers]);
  rows.push([T('cDnf'), flow.dnf]);
  rows.push([T('cIntoForest'), sec(flow.firstStart, flow.lastStart)]);
  rows.push([T('cFirstResult'), sec(flow.firstStart, flow.firstFinish)]);
  rows.push([T('cResultsWait'), sec(flow.firstFinish, flow.lastFinish)]);
  rows.push([T('cTotal'), sec(flow.firstStart, flow.lastFinish)]);
  if (flow.firstExchange != null) rows.push([T('cFirstExchange'), fmtClock(flow.firstExchange)]);
  const p = finishPeak(flow.finishMinutes);
  if (p) rows.push([T('pPeak'), fmtMin(p.from) + '–' + fmtMin(p.to), p.count]);
  const cls = classFlowSeries(event);
  if (cls.length) {
    rows.push([]);
    rows.push([T('secClassFinishes')]);
    rows.push([T('hClass'), T('hFin'), T('hFirst'), T('hLast')]);
    cls.forEach(c => rows.push([
      c.className,
      c.mins.length,
      fmtMin(c.mins[0]),
      fmtMin(c.mins[c.mins.length - 1]),
    ]));
  }
  const excluded = droppedWarnings(event);
  if (excluded.length) {
    rows.push([]);
    rows.push([T('warnTitle')]);
    excluded.forEach(w => rows.push([w.count > 1 ? w.count + ' × ' + warnLabel(w) : warnLabel(w)]));
  }
  const onCourse = onCourseWarnings(event);
  if (onCourse.length) {
    rows.push([]);
    rows.push([T('ocTitle')]);
    onCourse.forEach(w => rows.push([warnLabel(w)]));
  }
}

function buildCSV() {
  const event = state.event;
  if (!event) return '';
  const rows = [];
  if (isMultistageEvent(event)) {
    state.stageEvents.forEach((stage, i) => {
      rows.push([]);
      rows.push([T('secStage') + ' ' + (stage.stageNumber || (i + 1)) + (stage.name ? ' ' + stage.name : '')]);
      addFlowRows(rows, stage);
    });
  } else {
    addFlowRows(rows, event);
    const paces = classPaces(event);
    if (paces.length) {
      rows.push([]);
      rows.push([T('secClassPaces')]);
      rows.push([T('hClass'), T('hPace'), T('hRunners')]);
      paces.forEach(c => rows.push([c.className, c.paceSec, c.runners]));
    }
  }
  return toCSV(rows);
}

function downloadFile(name, content, mime) {
  if (typeof Blob === 'undefined') return;
  try {
    const blob = new Blob([content], { type: mime || 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = String(name).replace(/[^a-z0-9_\-\u00e4\u00f6\u00e5\u00c4\u00d6\u00c5 ]/gi, '_').trim().replace(/\s+/g, '_') + '.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) { console.error(e); }
}

function exportCSV() {
  if (!state.event) return;
  downloadFile((state.event.name || 'analysis'), buildCSV(), 'text/csv;charset=utf-8');
}

// ════════════════════════════════════════════════════════════════════
//  Init
// ════════════════════════════════════════════════════════════════════
function wireUI() {
  setLang(lang);
  const ab = $('analyzeBtn');
  if (ab) ab.addEventListener('click', () => { analyze(); });
  const slug = $('slugInput');
  if (slug) slug.addEventListener('keydown', e => { if (e.key === 'Enter') analyze(); });
  const lb = $('langBtn');
  if (lb) lb.addEventListener('click', () => setLang(lang === 'fi' ? 'en' : 'fi'));
  const pb = $('printBtn');
  if (pb) pb.addEventListener('click', () => { try { window.print(); } catch (e) {} });
  const cb = $('csvBtn');
  if (cb) cb.addEventListener('click', exportCSV);
  const sb = $('shareBtn');
  if (sb) sb.addEventListener('click', shareLink);
  const tbtn = $('compareToggleBtn');
  if (tbtn) tbtn.addEventListener('click', () => setMode(state.mode === 'compare' ? 'single' : 'compare'));
  const cbBtn = $('compareBtn');
  if (cbBtn) cbBtn.addEventListener('click', () => { analyzeCompare(); });
  const sa = $('slugInputA');
  if (sa) sa.addEventListener('keydown', e => { if (e.key === 'Enter') analyzeCompare(); });
  const sbInp = $('slugInputB');
  if (sbInp) sbInp.addEventListener('keydown', e => { if (e.key === 'Enter') analyzeCompare(); });
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', () => { if (state.event || (state.compare.a || state.compare.b)) paintCharts(); });
  }
  setupChartInteractions();
  setupScheduleInteractions();
  const fromHash = slugFromHash();
  if (fromHash) {
    const parsed = parseHash(fromHash);
    if (parsed && parsed.mode === 'compare' && parsed.a && parsed.b) {
      setMode('compare');
      if (sa) sa.value = parsed.a;
      if (sbInp) sbInp.value = parsed.b;
      analyzeCompare(parsed.a, parsed.b);
    } else if (parsed && parsed.slug) {
      if (slug) slug.value = parsed.slug;
      analyze(parsed.slug);
    }
  }
}

if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('DOMContentLoaded', wireUI);
}
</script>
