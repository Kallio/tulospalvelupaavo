<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tulospalvelupaavon kilpailuanalyysi - Navisport tapahtumasta</title>
<style>
  :root {
    --bg: #f4f6f9;
    --fg: #1b2330;
    --muted: #5b6b7c;
    --primary: #1f3a5f;
    --primary-light: #2e5a8a;
    --primary-dark: #16283f;
    --accent: #e67e22;
    --accent-hover: #d06e15;
    --card: #ffffff;
    --border: #dde3ea;
    --ok: #1e8e3e;
    --warn: #b7791f;
    --err: #c0392b;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(23, 35, 55, 0.08), 0 2px 8px rgba(23, 35, 55, 0.06);
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    line-height: 1.5;
  }
  .topbar {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .mark {
    width: 38px; height: 38px; background: var(--accent); border-radius: 9px;
    display: grid; place-items: center; font-size: 17px; font-weight: 700; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(230, 126, 34, 0.35);
  }
  .brand h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
  .brand p { font-size: 12px; color: #9db4cc; font-weight: 400; }
  .topbar .acts { margin-left: auto; display: flex; gap: 7px; }
  .btn-hdr {
    padding: 7px 13px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer;
    font-weight: 600; font-family: inherit; transition: all 0.12s; white-space: nowrap;
  }
  .btn-hdr:active { transform: scale(0.97); }
  .btn-hdr-accent { background: var(--accent); color: #fff; }
  .btn-hdr-accent:hover { background: var(--accent-hover); }
  .btn-hdr-sec { background: rgba(255, 255, 255, 0.12); color: #dfe9f3; }
  .btn-hdr-sec:hover { background: rgba(255, 255, 255, 0.22); }

  .urlbar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    gap: 8px;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: var(--shadow);
  }
  .urlbar input {
    flex: 1;
    padding: 9px 13px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-family: Consolas, Menlo, monospace;
    font-size: 12.5px;
    background: var(--bg);
    color: var(--fg);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .urlbar input:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(46, 90, 138, 0.12); }
  .urlbar input::placeholder { color: var(--muted); font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; }
  .urlbar .cfield { display: flex; align-items: center; gap: 8px; flex: 1 1 0; min-width: 0; }
  .urlbar .cfield label { font-size: 11px; font-weight: 700; color: var(--primary); white-space: nowrap; }
  .urlbar .cfield input { width: 100%; min-width: 0; }
  .urlbar:hover .cfield input { border-color: var(--border); }
  @media (max-width: 640px) {
    .urlbar#compareUrlbar { flex-direction: column; align-items: stretch; }
    .urlbar#compareUrlbar .cfield label { flex-basis: auto; }
  }
  .btn-hdr-active { background: var(--accent); color: #fff; }
  .btn-hdr-active:hover { background: var(--accent-hover); }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: var(--radius);
    font-family: inherit; font-size: 12.5px; font-weight: 600;
    border: none; cursor: pointer; transition: all 0.12s; white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-light); }
  .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { background: var(--accent-hover); }
  .btn-outline { background: transparent; color: var(--primary); border: 1.5px solid var(--border); }
  .btn-outline:hover { background: var(--bg); border-color: var(--primary-light); }

  .status { padding: 8px 24px; font-size: 13px; min-height: 34px; display: flex; align-items: center; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }

  #output { max-width: 1100px; margin: 0 auto; padding: 20px 24px 60px; }

  .evhead {
    display: flex; align-items: center; gap: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius);
    padding: 16px 20px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .evhead h2 { font-size: 19px; letter-spacing: -0.3px; }
  .evhead p { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .evlogo { max-height: 48px; max-width: 130px; object-fit: contain; margin-left: auto; }

  .cards {
    /* flex, not grid: with an uneven card count grid's auto-fit leaves the
       last row's leftover columns empty (a blank gap at the edge on mobile,
       where only 1-2 columns fit); flex-wrap stretches the last row's cards
       to fill the full width instead. */
    display: flex; flex-wrap: wrap;
    gap: 10px; margin-bottom: 18px;
  }
  .card {
    flex: 1 1 150px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; box-shadow: var(--shadow);
  }
  .card h4 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted); margin-bottom: 6px; }
  .card .num { font-size: 20px; font-weight: 700; }
  .card .sub { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; font-weight: 500; }

  .panel {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 16px; overflow-x: auto;
  }
  .phead {
    font-size: 14px; font-weight: 700; color: var(--primary);
    border-bottom: 2px solid var(--border); padding-bottom: 8px; margin-bottom: 12px;
  }
  .panel h4 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 4px 0 8px; }

  /* pan-y (not "manipulation"): "manipulation" still permits pinch-zoom, which
     is what was actually zooming in on every touch — only page panning should
     pass through, so pinch-zoom and double-tap-zoom are both disabled here. */
  canvas.chart { display: block; max-width: 100%; touch-action: pan-y; }
  .chartwrap { position: relative; }
  .chartcap { margin: 4px 0 0; font-size: 12px; color: var(--muted); text-align: right; }
  .pacerefs { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  .pacerefs .prswatch { display: inline-block; width: 14px; height: 0; margin-right: 5px; border-top: 2px dashed #c46a2a; vertical-align: middle; }
  .charttip {
    position: absolute; pointer-events: none; z-index: 30;
    background: #1c2430; color: #e8edf3; font-size: 12px; line-height: 1.55;
    padding: 7px 9px; border-radius: 7px; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
    white-space: nowrap; max-width: 320px;
  }
  .charttip .tipclock { opacity: 0.7; }
  .charttip .tipcls { display: inline-flex; align-items: center; gap: 5px; margin-right: 9px; }
  .charttip .tipcls .sw { width: 9px; height: 9px; }
  .charttip .tippeak { color: #f6a15c; font-weight: 700; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .legend .lg { display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px; font: inherit; color: inherit; cursor: pointer; }
  .legend .lg:hover { border-color: var(--border); }
  .legend .lg.off { opacity: 0.35; text-decoration: line-through; }
  .legend .lg input[type=checkbox] { margin: 0 2px 0 0; width: 13px; height: 13px; accent-color: var(--primary); cursor: pointer; }
  .legend .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .lgcontrols { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
  .lgcontrols .lgcombine { background: none; border: 1px solid var(--primary); color: var(--primary); border-radius: 7px; padding: 2px 8px; font: inherit; font-size: 12px; cursor: pointer; }
  .lgcontrols .lgcombine:disabled { opacity: 0.4; cursor: default; }
  .lgcontrols .lgclear { background: none; border: 1px solid transparent; color: var(--muted); border-radius: 7px; padding: 2px 8px; font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; }
  .lgcontrols .lgclear:hover { color: var(--danger, #c0392b); }
  .lgpager { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  .lgpager button { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font: inherit; cursor: pointer; }
  .lgpager button:disabled { opacity: 0.4; cursor: default; }
  .axistoggle { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; margin-bottom: 8px; }
  .axistoggle button { background: none; border: none; font: inherit; font-size: 11.5px; padding: 4px 10px; cursor: pointer; color: var(--muted); }
  .axistoggle button.on { background: var(--primary); color: #fff; }

  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th {
    text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--muted); padding: 7px 10px; border-bottom: 2px solid var(--border); white-space: nowrap;
  }
  td { padding: 7px 10px; border-bottom: 1px solid #edf1f5; white-space: nowrap; }
  tr:hover td { background: #f7fafc; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  .stagehead { margin: 26px 0 12px; padding-top: 14px; border-top: 2px dashed var(--border); }
  .stagehead h3 { font-size: 15px; color: var(--primary); }

  /* Two-race side-by-side compare layout */
  .cmpwrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .cmpcol { min-width: 0; }
  .cmpcol .evhead { margin-bottom: 12px; }
  @media (max-width: 900px) { .cmpwrap { grid-template-columns: 1fr; } }
  .cmphdr { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .cmphdr .cmptag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
    color: #fff; background: var(--primary); border-radius: 5px; padding: 2px 7px; }
  .cmphdr .cmpname { font-size: 14px; font-weight: 700; color: var(--primary); }
  .cmpbanner { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .cmplegend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .cmplegend .clsw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; }
  .pacetype { text-transform: uppercase; letter-spacing: 0.6px; font-size: 10px; color: var(--muted); }

  /* compare pace table deltas */
  .cmpfast { font-weight: 700; }
  td.delta, th.delta { text-align: right; }

  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .schsummary { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .schcontrols { display: flex; gap: 6px; margin-bottom: 8px; }
  .schbtn { font-size: 11px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card); color: var(--text); cursor: pointer; }
  .schbtn:hover { background: var(--hover); }

  .warnbox {
    background: #fdf3e7;
    border: 1px solid #f0d9b8;
    border-left: 4px solid var(--warn);
    color: #7a5410;
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 12.5px;
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .warnbox .wtitle { font-weight: 700; margin-bottom: 2px; }
  .warnbox .wtitle.sub { margin-top: 10px; }
  .warnrow { display: block; }

  @media print {
    .topbar, .urlbar, .status { display: none; }
    body { background: #fff; }
    .panel, .evhead { box-shadow: none; }
    #output { max-width: none; padding: 0; }
  }

  /* Four header buttons (share/print/csv/lang) no longer fit on one line next
     to the brand on narrow phones — wrap them onto their own row instead of
     letting the bar overflow the screen width. */
  @media (max-width: 480px) {
    .topbar { flex-wrap: wrap; row-gap: 8px; padding: 12px 14px; }
    .topbar .acts { margin-left: 0; width: 100%; justify-content: flex-end; flex-wrap: wrap; }
    .brand p { display: none; }
    .urlbar, .status, #output { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="mark">Σ</div>
  <div class="brand">
    <h1>Kilpailuanalyysi</h1>
    <p>Navisport-event flow · Tulospalvelupaavo</p>
  </div>
  <div class="acts">
    <button id="shareBtn" class="btn-hdr btn-hdr-sec" type="button" style="display:none;"></button>
    <button id="printBtn" class="btn-hdr btn-hdr-sec" type="button"></button>
    <button id="csvBtn" class="btn-hdr btn-hdr-sec" type="button" style="display:none;"></button>
    <button id="compareToggleBtn" class="btn-hdr btn-hdr-sec" type="button" title=""></button>
    <button id="langBtn" class="btn-hdr btn-hdr-accent" type="button">EN</button>
  </div>
</header>

<div class="urlbar" id="urlbarSingle">
  <input id="slugInput" type="text" spellcheck="false" autocomplete="off" placeholder="">
  <button id="analyzeBtn" class="btn btn-primary" type="button"></button>
</div>

<div class="urlbar" id="compareUrlbar" style="display:none;">
  <div class="cfield">
    <label id="labelA" for="slugInputA"></label>
    <input id="slugInputA" type="text" spellcheck="false" autocomplete="off" placeholder="">
  </div>
  <div class="cfield">
    <label id="labelB" for="slugInputB"></label>
    <input id="slugInputB" type="text" spellcheck="false" autocomplete="off" placeholder="">
  </div>
  <button id="compareBtn" class="btn btn-primary" type="button"></button>
</div>

<div id="status" class="status"></div>
<div id="output"></div>

let lang = 'fi';
(function guessLang() {
  let want = null;
  try { want = localStorage.getItem('ka_lang'); } catch (e) {}
  if (want === 'fi' || want === 'en') { lang = want; return; }
  try {

  } catch (e) {}
})();

const state = {
  event: null, stageEvents: [],
  mode: 'single',
  compare: { a: null, b: null },
};

// ════════════════════════════════════════════════════════════════════
//  Tiny helpers
// ════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);

function T(key) {
  const s = (LANGS[lang] || LANGS.fi)[key];
  return s != null ? s : key;
}
function setLang(l) {
  if (l !== 'fi' && l !== 'en') l = 'fi';
  lang = l;
  try { localStorage.setItem('ka_lang', l); } catch (e) {}
  const els = [
    ['langBtn', lang === 'fi' ? 'EN' : 'FI'],
    ['analyzeBtn', T('btnAnalyze')],
    ['csvBtn', T('btnCsv')],
    ['printBtn', T('btnPrint')],
    ['shareBtn', T('btnShare')],
    ['compareToggleBtn', T('compareToggle')],
    ['compareBtn', T('btnCompare')],
  ];
  for (const [id, txt] of els) {
    const el = $(id);
    if (el) el.textContent = txt;
  }
  const inp = $('slugInput');
  if (inp) inp.placeholder = T('inputPlaceholder');
  const ra = $('slugInputA');
  if (ra) ra.placeholder = T('inputPlaceholder');
  const rb = $('slugInputB');
  if (rb) rb.placeholder = T('inputPlaceholder');
  setMode(state.mode);
  if (state.compare.a) render();
  else if (state.event) render();
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function escAttr(s) { return esc(s); }

function fmtTime(sec) {
  if (sec == null || !isFinite(sec)) return '—';
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const mm = String(m).padStart(2, '0');
  const ss = String(s).padStart(2, '0');
  return h ? h + ':' + mm + ':' + ss : m + ':' + ss;
}
function fmtClock(ts) {
  if (ts == null || !isFinite(ts)) return '—';
  const d = new Date(ts);
  const p2 = x => String(x).padStart(2, '0');
  return p2(d.getHours()) + ':' + p2(d.getMinutes());
}
function fmtMin(m) {
  const total = Math.max(0, Math.round(m * 60));
  const h = Math.floor(total / 3600);
  const mm = Math.floor((total % 3600) / 60);
  const ss = total % 60;
  const p2 = x => String(x).padStart(2, '0');
  return h ? h + ':' + p2(mm) + ':' + p2(ss) : mm + ':' + p2(ss);
}
function setStatus(msg, type) {
  const el = $('status');
  if (!el) return;
  el.textContent = msg;
  el.className = 'status ' + (type === 'err' ? 'err' : type === 'ok' ? 'ok' : '');
}

// ════════════════════════════════════════════════════════════════════
//  Status classification
// ════════════════════════════════════════════════════════════════════
const STATUS_OK = 'OK';
function classifyStatus(status) {
  const s = String(status == null ? '' : status).trim().toLowerCase();
  if (!s) return '';
  if (s === 'ok' || s === 'fin') return 'OK';
  if (s === 'mp' || s === 'mis') return 'MP';
  if (s === 'dnf') return 'DNF';
  if (s === 'dns') return 'DNS';
  if (s === 'dsq' || s === 'dis' || s === 'disq') return 'DSQ';
  if (s === 'otl' || s === 'over') return 'OTL';
  return 'OTHER';
}

// ════════════════════════════════════════════════════════════════════
//  Event-flow analysis (anonymized, organizer-oriented)
// ════════════════════════════════════════════════════════════════════
function runnerRows(event) {
  return (event.results || []).filter(r => r.resultType !== 'Team');
}
function isMultistageEvent(event) {
  return event.eventKind === 'Multistage event' || (event.events || []).length > 1;
}
function parseTS(iso) {
  if (iso == null || iso === '') return null;
  const t = new Date(iso).getTime();
  return isFinite(t) ? t : null;
}

// Tolerance used when validating timestamps against the event window (3 h).
const TS_TOL = 3 * 3600 * 1000;

// True when a timestamp is inside the event's [begin, ending] window (with a
// tolerance for early starts and late finishers). Null/unknown → allowed.
function tsInWindow(event, ts) {
  if (ts == null) return true;
  const begin = parseTS(event.begin);
  const ending = parseTS(event.ending);
  if (begin != null && ts < begin - TS_TOL) return false;
  if (ending != null && ts > ending + TS_TOL) return false;
  return true;
}

// Initials of a person's name parts (e.g. "Sikström Jack" → "JS"), used to
// identify a runner in warnings without printing the full name.
function initials(name) {
  return String(name == null ? '' : name).trim().split(/\s+/).filter(Boolean)
    .map(w => w.charAt(0).toUpperCase()).join('');
}

// True when a result status means the runner is still on course (started but
// not finished). Navisport uses "Competing"; other systems may differ.
function isOnCourseStatus(status) {
  const st = String(status == null ? '' : status).trim().toLowerCase();
  return st === 'competing' || st === 'on course' || st === 'in progress' || st === 'running';
}

// Timestamp sanity check for a single result. Returns a warning with the
// runner's initials when the start/finish cannot be inside the event window
// (e.g. a finish recorded hours before the event begins — "Sikström-style"
// corrupt data that would otherwise skew the flow chart and the summary
// cards), else null.
function makeRowCheck(event) {
  const begin = parseTS(event.begin);
  const ending = parseTS(event.ending);
  const cc = {};
  (event.courseClasses || []).forEach(c => { cc[c.id] = c.name; });
  return (r, start, finish) => {
    let reason = null, ts = null, delta = null;
    if (finish != null && !tsInWindow(event, finish)) {
      if (begin != null && finish < begin - TS_TOL) {
        reason = 'finishBeforeBegin'; ts = finish; delta = begin - finish;
      } else if (ending != null) {
        reason = 'finishAfterEnd'; ts = finish; delta = finish - ending;
      }
    } else if (start != null && ending != null && start > ending + TS_TOL) {
      reason = 'startAfterEnd'; ts = start; delta = start - ending;
    }
    if (!reason) return null;
    return {
      reason,
      name: initials(r.name),
      className: cc[r.classId] || '',
      status: String(r.status == null ? '' : r.status),
      clock: fmtClock(ts),
      deltaSec: Math.round(delta / 1000),
    };
  };
}

// Rows plus anonymized warnings for results dropped by the timestamp check.
function buildFlowRows(event) {
  const results = event.results || [];
  const warnings = [];
  const check = makeRowCheck(event);
  const mk = (r, start, finish, dur, extra) => {
    const w = check(r, start, finish);
    if (w) { warnings.push(w); return null; }
    const row = { start, finish, duration: dur, status: classifyStatus(r.status), classId: r.classId };
    if (extra) Object.assign(row, extra);
    return row;
  };
  let rows;
  if (event.raceType === 'Relay') {
    const teams = results.filter(r => r.resultType === 'Team');
    const legs = results.filter(r => r.resultType !== 'Team');
    if (legs.length) {
      // Relay flow is built from every leg punch: each leg runner's start and
      // finish times (start of later legs = accumulated leg times of the team).
      const teamById = {};
      teams.forEach(t => { teamById[t.id] = t; });
      const matesByParent = {};
      legs.forEach(l => {
        const pid = l.parentId != null ? l.parentId : l.bibNumber;
        (matesByParent[pid] = matesByParent[pid] || []).push(l);
      });
      rows = legs.map(l => {
        const pid = l.parentId != null ? l.parentId : l.bibNumber;
        const team = l.parentId != null ? teamById[l.parentId] : null;
        let start = null;
        const base = team && team.startTime != null ? parseTS(team.startTime) : null;
        if (base != null) {
          const mates = (matesByParent[pid] || []).slice().sort((a, b) => (a.leg || 0) - (b.leg || 0));
          let acc = base;
          for (const m of mates) {
            if (m === l) break;
            if (m.time != null && m.time > 0) acc += m.time * 1000;
          }
          start = acc;
        }
        const s = parseTS(l.startTime);
        if (s != null) start = s;
        const dur = l.time != null && l.time > 0 ? l.time : null;
        let finish = start != null && dur != null ? start + dur * 1000 : null;
        const f = parseTS(l.finishTime);
        if (f != null) finish = f;
        return mk(l, start, finish, dur, { leg: l.leg });
      }).filter(r => r != null && (r.start != null || r.finish != null));
    } else {
      rows = teams.map(t => mk(t, parseTS(t.startTime), parseTS(t.finishTime),
        t.time != null && t.time > 0 ? t.time : null))
        .filter(r => r != null && (r.start != null || r.finish != null));
    }
  } else {
    rows = results.filter(r => r.resultType !== 'Team').map(r => {
      let start = parseTS(r.startTime);
      let finish = parseTS(r.finishTime);
      const dur = r.time != null && r.time > 0 ? r.time : null;
      if (start == null && finish != null && dur != null) start = finish - dur * 1000;
      if (finish == null && start != null && dur != null) finish = start + dur * 1000;
      return mk(r, start, finish, dur);
    }).filter(r => r != null);
  }
  return { rows, warnings };
}

function flowRows(event) {
  return buildFlowRows(event).rows;
}

// Warnings for results dropped by the timestamp check, grouped by
// reason + initials + class + status so repeated corrupt entries collapse.
function droppedWarnings(event) {
  const groups = {};
  buildFlowRows(event).warnings.forEach(w => {
    const key = w.reason + '|' + w.name + '|' + w.className + '|' + w.status;
    if (groups[key]) groups[key].count++;
    else groups[key] = Object.assign({}, w, { count: 1 });
  });
  return Object.keys(groups).map(k => groups[k]);
}

// Warnings for runners still on course after the event has ended. Only fires
// once the event ending is in the past (a live feed analyzed mid-event must
// not flag runners who are legitimately still out). Each runner gets its own
// line so the initials can be used to look the runner up.
function onCourseWarnings(event) {
  const ending = parseTS(event.ending);
  if (ending == null || Date.now() <= ending) return [];
  const cc = {};
  (event.courseClasses || []).forEach(c => { cc[c.id] = c.name; });
  const out = [];
  (event.results || []).forEach(r => {
    if (r.resultType === 'Team' || !isOnCourseStatus(r.status)) return;
    out.push({
      reason: 'stillOnCourse',
      name: initials(r.name),
      className: cc[r.classId] || '',
      status: String(r.status == null ? '' : r.status),
      clock: null,
      deltaSec: null,
      count: 1,
    });
  });
  return out;
}

// Warnings for orphaned Individual results that have no parentId in a
// parent/child relay. These are draft/incomplete entries that were never
// linked to a Team row (e.g. bib 8 orphans from Navisport).
function orphanWarnings(event) {
  if (event.raceType !== 'Relay') return [];
  const results = event.results || [];
  const teams = results.filter(r => r.resultType === 'Team');
  if (!teams.length) return [];
  const teamById = {};
  teams.forEach(t => { teamById[t.id] = t; });
  const cc = {};
  (event.courseClasses || []).forEach(c => { cc[c.id] = c.name; });
  const out = [];
  results.filter(r => r.resultType !== 'Team').forEach(r => {
    if (r.parentId && teamById[r.parentId]) return;
    out.push({
      reason: 'orphan',
      name: initials(r.name),
      className: cc[r.classId] || '',
      status: '',
      clock: null,
      deltaSec: null,
      count: 1,
    });
  });
  return out;
}

// Per-class mass start consistency check for relay events. Detects first-leg
// runners whose start time doesn't belong to any recognized mass start group
// (≥3 runners sharing the same start minute) within their class. Flags data
// quality issues where runners missed the mass start or were manually re-timed.
function massStartWarnings(event) {
  if (event.raceType !== 'Relay') return [];
  const results = event.results || [];
  const legs = results.filter(r => r.resultType !== 'Team');
  const cc = {};
  (event.courseClasses || []).forEach(c => { cc[c.id] = c.name; });

  // Group leg-1 starts by class
  const classStarts = {};
  legs.filter(r => (r.leg || 0) === 1).forEach(r => {
    const start = parseTS(r.startTime);
    if (start == null || !tsInWindow(event, start)) return;
    const cid = r.classId || '';
    (classStarts[cid] = classStarts[cid] || []).push({ start, r });
  });

  const MIN_GROUP = 3;
  const GAP_MIN = 2;
  const out = [];
  Object.entries(classStarts).forEach(([cid, entries]) => {
    if (entries.length < MIN_GROUP) return;
    // Find all mass start groups: buckets with ≥ MIN_GROUP runners
    const buckets = {};
    entries.forEach(e => {
      const b = Math.floor(e.start / 60000) * 60000;
      (buckets[b] = buckets[b] || []).push(e);
    });
    const groupMinutes = new Set();
    Object.values(buckets).forEach(arr => {
      if (arr.length >= MIN_GROUP) groupMinutes.add(Number(arr[0].start / 60000) * 60000);
    });
    if (!groupMinutes.size) return;
    // Flag runners not in any mass start group, deviating ≥2 min
    entries.forEach(e => {
      const minute = Math.floor(e.start / 60000) * 60000;
      if (groupMinutes.has(minute)) return;
      // Find nearest group to compute delta
      let nearest = null;
      let nearestMin = null;
      groupMinutes.forEach(gm => {
        const d = Math.abs(e.start - gm);
        if (nearest == null || d < nearest) { nearest = d; nearestMin = gm; }
      });
      if (nearest == null || nearest / 60000 < GAP_MIN) return;
      out.push({
        reason: 'massStartDeviation',
        name: initials(e.r.name),
        className: cc[cid] || '',
        status: '',
        clock: fmtClock(e.start),
        deltaSec: Math.round((e.start - nearestMin) / 1000),
        count: 1,
      });
    });
  });
  return out;
}

// All warnings (dropped rows + still-on-course + orphans + mass start), kept
// for the CSV export.
function flowWarnings(event) {
  return droppedWarnings(event).concat(onCourseWarnings(event))
    .concat(orphanWarnings(event)).concat(massStartWarnings(event));
}

// One-line, name-free description of a result warning (for UI and CSV).
function warnLabel(w) {
  const parts = [w.name, w.className, w.status];
  if (w.reason === 'stillOnCourse') {
    parts.push(T('ocStatus'));
  } else if (w.reason === 'orphan') {
    parts.push(T('wOrphan'));
  } else if (w.reason === 'massStartDeviation') {
    parts.push(T('wMassDev') + ' ' + w.clock + ' (' + fmtTime(w.deltaSec) + ')');
  } else {
    const what = w.reason === 'startAfterEnd' ? T('wStart') : T('wFinish');
    const when = w.reason === 'finishBeforeBegin' ? T('wBeforeStart') : T('wAfterEnd');
    parts.push(what + ' ' + w.clock + ' (' + fmtTime(w.deltaSec) + ' ' + when + ')');
  }
  return parts.filter(Boolean).join(' · ');
}

function warnRowsHtml(warnings) {
  return warnings.map(w => '<span class="warnrow">' + (w.count > 1 ? esc(w.count + ' × ') : '') + esc(warnLabel(w)) + '</span>').join('');
}

// `extra` appends a second title/intro/warnings section at the end of the
// same box (used to tack the still-on-course list onto the excluded-results
// box instead of showing it as a separate box).
function warnBoxHtml(title, intro, warnings, extra) {
  let html = '<div class="warnbox"><div class="wtitle">' + esc(title) + '</div>' +
    '<div>' + esc(intro) + '</div>' +
    warnRowsHtml(warnings);
  if (extra && extra.warnings.length) {
    html += '<div class="wtitle sub">' + esc(extra.title) + '</div>' +
      '<div>' + esc(extra.intro) + '</div>' +
      warnRowsHtml(extra.warnings);
  }
  return html + '</div>';
}

// A mass re-start (relay "jälkilähtö"): a group of leg-N runners sent out
// together although their own team's leg-(N-1) runner has not handed over yet
// (still in the forest). Detected when ≥5 such runners share the same start
// minute. Returns the start minute (relative to base) or null.
function findMassRestart(event, base) {
  const rows = (event.results || []).filter(r => r.resultType !== 'Team');
  const legs = rows.filter(r => (r.leg || 0) >= 2);
  if (legs.length < 5) return null;
  const prevFinish = {};
  rows.filter(r => (r.leg || 0) >= 1).forEach(l => {
    const f = parseTS(l.finishTime);
    if (f == null || !tsInWindow(event, f)) return;
    const key = l.parentId + '|' + l.leg;
    if (prevFinish[key] == null || f < prevFinish[key]) prevFinish[key] = f;
  });
  const clusters = {};
  const seen = {};
  const MIN_GAP = 60000;
  legs.forEach(l => {
    const start = parseTS(l.startTime);
    if (start == null || !tsInWindow(event, start)) return;
    const legKey = l.parentId + '|' + (l.leg || 0);
    if (seen[legKey]) return;
    seen[legKey] = true;
    const pf = prevFinish[l.parentId + '|' + ((l.leg || 0) - 1)];
    const natural = pf != null && start >= pf && start - pf < MIN_GAP;
    if (natural) return;
    const bucket = Math.floor(start / 60000) * 60000;
    (clusters[bucket] = clusters[bucket] || []).push(l);
  });
  const found = Object.entries(clusters)
    .filter(([, arr]) => arr.length >= 5)
    .map(([bucket]) => (Number(bucket) - base) / 60000)
    .filter(at => at > 0.05)
    .sort((a, b) => a - b);
  return found.length ? found[0] : null;
}

// Known mass starts for the first relay leg: teams (or leg-1 rows when teams
// lack start times) that start within the same minute, counted as a group
// when it holds ≥ max(3, 15%) of the starters. Returns relative minutes.
function firstLegMassStarts(event, base) {
  const results = event.results || [];
  const teamStarts = results.filter(r => r.resultType === 'Team' && parseTS(r.startTime) != null)
    .map(r => parseTS(r.startTime)).filter(t => tsInWindow(event, t));
  const leg1Starts = results.filter(r => r.resultType !== 'Team' && (r.leg || 0) === 1 && parseTS(r.startTime) != null)
    .map(r => parseTS(r.startTime)).filter(t => tsInWindow(event, t));
  const times = teamStarts.length ? teamStarts : leg1Starts;
  if (!times.length) return [];
  const thr = Math.max(3, Math.ceil(times.length * 0.15));
  const groups = {};
  times.forEach(t => {
    const bucket = Math.floor(t / 60000) * 60000;
    (groups[bucket] = groups[bucket] || []).push(t);
  });
  return Object.entries(groups)
    .filter(([, arr]) => arr.length >= thr)
    .map(([bucket]) => (Number(bucket) - base) / 60000)
    .sort((a, b) => a - b);
}

function relayMarkers(event) {
  if (event.raceType !== 'Relay') return [];
  const rows = flowRows(event);
  const starts = rows.map(r => r.start).filter(t => t != null).sort((a, b) => a - b);
  const finishes = rows.map(r => r.finish).filter(t => t != null).sort((a, b) => a - b);
  if (!starts.length && !finishes.length) return [];
  const base = starts.length ? starts[0] : (finishes.length ? finishes[0] : 0);
  const markers = [];
  firstLegMassStarts(event, base).forEach(at => markers.push({ kind: 'mass', at, key: 'mMass' }));
  if (finishes.length) {
    markers.push({ kind: 'exch', at: (finishes[0] - base) / 60000, key: 'mExch' });
  }
  const restart = findMassRestart(event, base);
  if (restart != null) markers.push({ kind: 'restart', at: restart, key: 'mRestart' });
  markers.sort((a, b) => a.at - b.at);
  return markers;
}

function eventFlow(event) {
  const rows = flowRows(event);
  const starts = rows.map(r => r.start).filter(t => t != null).sort((a, b) => a - b);
  const finishes = rows.map(r => r.finish).filter(t => t != null).sort((a, b) => a - b);
  const base = starts.length ? starts[0] : (finishes.length ? finishes[0] : 0);
  const startByClass = {};
  rows.forEach(r => {
    if (r.start == null) return;
    const cid = r.classId || '';
    (startByClass[cid] = startByClass[cid] || []).push((r.start - base) / 60000);
  });
  Object.keys(startByClass).forEach(k => startByClass[k].sort((a, b) => a - b));
  let firstExchange = null;
  if (event.raceType === 'Relay') {
    const ex = rows.filter(r => r.leg === 1 && r.finish != null).map(r => r.finish).sort((a, b) => a - b);
    firstExchange = ex.length ? ex[0] : null;
  }
  return {
    starters: starts.length,
    finishers: rows.filter(r => r.status === STATUS_OK).length,
    dnf: rows.filter(r => r.status === 'DNF').length,
    dns: rows.filter(r => r.status === 'DNS').length,
    firstStart: starts.length ? starts[0] : null,
    lastStart: starts.length ? starts[starts.length - 1] : null,
    firstFinish: finishes.length ? finishes[0] : null,
    lastFinish: finishes.length ? finishes[finishes.length - 1] : null,
    startMinutes: starts.map(t => (t - base) / 60000),
    finishMinutes: finishes.map(t => (t - base) / 60000),
    startByClass,
    firstExchange,
    relayMarkers: relayMarkers(event),
  };
}

// Categorical class palette (Tableau 10 — industry-standard, colorblind-aware,
// distinct hues). Cycles via index % length for events with many classes.
const CLASS_PALETTE = ['#4e79a7', '#f28e2c', '#e15759', '#76b7b2', '#59a14f', '#edc949', '#af7aa1', '#ff9da7', '#9c755f', '#bab0ab'];

// Parse orienteering class name into components for sorting.
// Returns { gender: 'M'|'N'|null, num: number|null, suffix: string, raw: string }
// Examples: "H10" → { gender:'M', num:10, suffix:'', raw:'H10' }
//           "D85" → { gender:'N', num:85, suffix:'', raw:'D85' }
//           "H16E" → { gender:'M', num:16, suffix:'E', raw:'H16E' }
//           "Kilpasarja" → { gender:null, num:null, suffix:'', raw:'Kilpasarja' }
function parseClassName(name) {
  const s = String(name || '').trim();
  const m = /^([HD])\s*-?\s*(\d+)(.*)$/i.exec(s);
  if (!m) return { gender: null, num: null, suffix: s, raw: s };
  return {
    gender: m[1].toUpperCase() === 'H' ? 'M' : 'N',
    num: parseInt(m[2], 10),
    suffix: m[3],
    raw: s,
  };
}

// Sort key for interleaving H/D classes by age number.
// H10→0, D10→1, H12→2, D12→3, ... non-H/D classes get high values.
function classSortKey(name) {
  const p = parseClassName(name);
  if (p.gender == null || p.num == null) return { group: 1, age: 999, gender: 2 };
  return { group: 0, age: p.num, gender: p.gender === 'M' ? 0 : 1 };
}

// Compare function for sorting class names intuitively: interleaved H/D by age,
// non-H/D classes after.
function compareClassNames(a, b) {
  const ka = classSortKey(a);
  const kb = classSortKey(b);
  if (ka.group !== kb.group) return ka.group - kb.group;
  if (ka.age !== kb.age) return ka.age - kb.age;
  if (ka.gender !== kb.gender) return ka.gender - kb.gender;
  return a.localeCompare(b, 'fi');
}

// Fixed elite-pace benchmarks shown as reference lines on the class-pace
// chart, so a class's average pace can be eyeballed against known results.
const PACE_REFS = [
  { label: 'Jukola 2026', paceSec: 5 * 60 + 47, color: '#c46a2a' },
  { label: 'Alisa Vainio, EM-maraton 2026', paceSec: 3 * 60 + 23, color: '#4e79a7' },
];

// Per-class finish curves (minutes since first start), largest classes first.
// Every class gets its own curve.
function classFlowSeries(event) {
  const cc = {};
  (event.courseClasses || []).forEach(c => { cc[c.id] = c.name; });
  const rows = flowRows(event);
  const starts = rows.map(r => r.start).filter(t => t != null).sort((a, b) => a - b);
  const finishes = rows.map(r => r.finish).filter(t => t != null).sort((a, b) => a - b);
  const base = starts.length ? starts[0] : (finishes.length ? finishes[0] : 0);
  const byClass = {};
  rows.forEach(r => {
    if (r.finish == null) return;
    const cid = r.classId || '';
    (byClass[cid] = byClass[cid] || []).push((r.finish - base) / 60000);
  });
  const classes = Object.entries(byClass).map(([id, mins]) => ({
    id,
    className: cc[id] || id,
    mins: mins.sort((a, b) => a - b),
  })).sort((a, b) => b.mins.length - a.mins.length);
  return classes.map((c, i) => ({ ...c, color: CLASS_PALETTE[i % CLASS_PALETTE.length] }));
}

// Window with the most finishers (the steepest climb on the finish line).
function finishPeak(finishMinutes, binW = 5) {
  if (!finishMinutes || !finishMinutes.length) return null;
  const counts = new Map();
  finishMinutes.forEach(m => {
    const k = Math.floor(m / binW) * binW;
    counts.set(k, (counts.get(k) || 0) + 1);
  });
  let from = null, count = 0;
  counts.forEach((c, k) => { if (c > count) { count = c; from = k; } });
  return from == null ? null : { from, to: from + binW, count };
}

// Average pace (min/km) per class, computed from every OK result (relay: each
// leg finish), anonymized (no runner name). Distance comes from each runner's
// own course, so it works for individual and relay races alike.
function classPaces(event) {
  const dist = {};
  (event.courses || []).forEach(c => { if (c.distance > 0) dist[c.id] = c.distance; });
  const cc = {};
  (event.courseClasses || []).forEach(c => { cc[c.id] = c.name; });
  const byClass = {};
  runnerRows(event).forEach(r => {
    if (classifyStatus(r.status) !== STATUS_OK || r.time == null || r.time <= 0) return;
    const d = r.courseId != null ? dist[r.courseId] : null;
    if (!d) return;
    const cid = r.classId || '';
    (byClass[cid] = byClass[cid] || []).push(r.time / (d / 1000));
  });
  return Object.entries(byClass).map(([cid, paces]) => ({
    className: cc[cid] || cid,
    paceSec: Math.round(paces.reduce((a, b) => a + b, 0) / paces.length),
    fastestSec: Math.round(Math.min(...paces)),
    runners: paces.length,
  })).sort((a, b) => a.paceSec - b.paceSec);
}

// ── Two-race comparison helpers ──────────────────────────────────────────
// Cumulative started/finished series per race, expressed in minutes relative
// to each race's own first start (so two races are comparable on a shared
// relative axis regardless of their different wall-clock schedules/durations).
// Returns one descriptor per race for the overlay flow chart.
function compareFlowSeries(eventA, eventB) {
  const mk = (event, color, i) => {
    const flow = eventFlow(event);
    const series = {
      key: i === 0 ? 'a' : 'b',
      name: event.name || (i === 0 ? T('raceA') : T('raceB')),
      color,
      starts: flow.startMinutes.slice().sort((x, y) => x - y),
      finishes: flow.finishMinutes.slice().sort((x, y) => x - y),
      firstStart: flow.firstStart,
      clockBase: flow.firstStart != null ? flow.firstStart : flow.firstFinish,
      peak: null,
    };
    const pk = finishPeak(series.finishes);
    series.peak = pk && series.finishes.length ? pk : null;
    return series;
  };
  return [mk(eventA, '#2e5a8a', 0), mk(eventB, '#e15759', 1)];
}

// Shared-class pace comparison between two races. Returns rows for classes
// present in BOTH races, each with paceA/paceB in seconds-per-km and the
// signed delta (B − A), sorted by largest |delta| first so the most striking
// middle-vs-long differences surface at the top.
function comparePaceRows(eventA, eventB) {
  const pa = classPaces(eventA);
  const pb = classPaces(eventB);
  const b = {};
  pb.forEach(x => { b[x.className] = x; });
  const rows = [];
  pa.forEach(a => {
    if (a.className in b) {
      const bv = b[a.className];
      rows.push({
        className: a.className,
        paceA: a.paceSec,
        paceB: bv.paceSec,
        delta: bv.paceSec - a.paceSec,
        runnersA: a.runners,
        runnersB: bv.runners,
      });
    }
  });
  rows.sort((x, y) => Math.abs(y.delta) - Math.abs(x.delta));
  return rows;
}

// Per-class start windows derived from actual start timestamps. Detects
// multiple start waves, packs classes into a small number of display rows
// (lanes) per wave, and counts concurrent-start lanes per timepoint.
// Optional groups parameter: array of arrays of classIds that should be
// merged into a single display row (e.g. [['ca','cb']] groups H10+D10).
function scheduleData(event, groups) {
  const results = event.results || [];
  const cc = {};
  (event.courseClasses || []).forEach(c => { cc[c.id] = c.name; });
  let startResults;
  if (event.raceType === 'Relay') {
    const teams = results.filter(r => r.resultType === 'Team');
    startResults = teams.length && teams.some(t => t.startTime)
      ? teams
      : results.filter(r => r.resultType !== 'Team' && r.leg === 1);
  } else {
    startResults = results.filter(r => r.resultType !== 'Team');
  }
  const entries = [];
  startResults.forEach(r => {
    const start = parseTS(r.startTime);
    if (start == null) return;
    entries.push({ start, classId: r.classId || '', courseId: r.courseId, time: r.time });
  });
  if (!entries.length) return null;
  entries.sort((a, b) => a.start - b.start);

  const WAVE_GAP = 20 * 60000;
  const waveBounds = [0];
  for (let i = 1; i < entries.length; i++) {
    if (entries[i].start - entries[i - 1].start > WAVE_GAP) waveBounds.push(i);
  }
  waveBounds.push(entries.length);
  const waveCount = waveBounds.length - 1;

  const classes = [];
  const allStarts = [];
  const LANE_OCCUPY = 60000;

  for (let wi = 0; wi < waveCount; wi++) {
    const slice = entries.slice(waveBounds[wi], waveBounds[wi + 1]);
    const byClass = {};
    slice.forEach(r => {
      if (!byClass[r.classId]) byClass[r.classId] = { starts: [], courseIds: new Set(), durations: [] };
      byClass[r.classId].starts.push(r.start);
      if (r.courseId != null) byClass[r.classId].courseIds.add(r.courseId);
      if (r.time != null && r.time > 0) byClass[r.classId].durations.push(r.time * 1000);
    });

    // Apply grouping: merge classIds that belong to the same group
    const groupMap = {};
    const classToGroup = {};
    (groups || []).forEach((g, gi) => {
      const key = '_grp' + wi + '_' + gi;
      g.forEach(cid => { classToGroup[cid] = key; });
      groupMap[key] = g;
    });

    // Build merged class entries
    const merged = {};
    Object.entries(byClass).forEach(([cid, d]) => {
      const grp = classToGroup[cid];
      if (grp) {
        if (!merged[grp]) merged[grp] = { ids: [], starts: [], courseIds: new Set(), durations: [] };
        merged[grp].ids.push(cid);
        d.starts.forEach(t => merged[grp].starts.push(t));
        d.courseIds.forEach(id => merged[grp].courseIds.add(id));
        d.durations.forEach(t => merged[grp].durations.push(t));
      } else {
        merged[cid] = { ids: [cid], starts: d.starts, courseIds: d.courseIds, durations: d.durations };
      }
    });

    Object.entries(merged).forEach(([key, d]) => {
      d.starts.sort((a, b) => a - b);
      const courseId = d.courseIds.size === 1 ? [...d.courseIds][0] : null;
      let interval = null;
      if (d.starts.length >= 2) {
        const gaps = [];
        for (let i = 1; i < d.starts.length; i++) gaps.push(d.starts[i] - d.starts[i - 1]);
        gaps.sort((a, b) => a - b);
        interval = gaps[Math.floor(gaps.length / 2)];
      }
      const avgDuration = d.durations.length
        ? d.durations.reduce((a, b) => a + b, 0) / d.durations.length
        : null;
      // Build display name from grouped class names
      const names = d.ids.map(id => cc[id] || id);
      let label;
      if (d.ids.length > 1) {
        label = names.sort((a, b) => compareClassNames(a, b)).join('/');
      } else {
        label = names[0];
      }
      if (waveCount > 1) label += ' (' + (wi + 1) + ')';
      const classId = d.ids.length === 1 ? d.ids[0] : key;
      classes.push({
        classId, className: label, rawName: d.ids.length > 1 ? names.join('/') : (cc[d.ids[0]] || d.ids[0]),
        wave: wi, firstStart: d.starts[0], lastStart: d.starts[d.starts.length - 1],
        count: d.starts.length, courseId, interval, avgDuration,
        memberIds: d.ids.length > 1 ? d.ids : null,
      });
      d.starts.forEach(t => {
        allStarts.push({ t, end: t + LANE_OCCUPY, wave: wi, classId, className: label, courseId });
      });
    });
  }
  // Sort by wave first, then intuitive class name order within each wave
  classes.sort((a, b) => a.wave - b.wave || compareClassNames(a.rawName, b.rawName));
  if (!classes.length) return null;

  // Pack overlapping classes into a small number of rows (lanes) per wave,
  // greedily reusing a lane as soon as its previous class has finished.
  let rowCount = 0;
  for (let wi = 0; wi < waveCount; wi++) {
    const waveClasses = classes.filter(c => c.wave === wi);
    const laneEnds = [];
    const waveRowStart = rowCount;
    waveClasses.forEach(c => {
      let lane = laneEnds.findIndex(end => end <= c.firstStart);
      if (lane === -1) { lane = laneEnds.length; laneEnds.push(0); }
      laneEnds[lane] = c.lastStart;
      c.lane = lane;
      c.row = rowCount + lane;
      c.waveRowStart = waveRowStart;
    });
    rowCount += laneEnds.length;
  }

  const tMin = Math.min(...allStarts.map(s => s.t));
  const tMax = Math.max(...allStarts.map(s => s.t));
  const laneTimeline = [];
  for (let t = tMin; t <= tMax; t += 60000) {
    let lanes = 0;
    for (let i = 0; i < allStarts.length; i++) {
      if (allStarts[i].t <= t && allStarts[i].end > t) lanes++;
    }
    laneTimeline.push({ t, lanes });
  }
  const maxLanes = laneTimeline.length ? Math.max(...laneTimeline.map(l => l.lanes)) : 0;

  // Assign each individual start to a concrete physical lane (earliest lane
  // whose previous occupant has already cleared), so the lane chart can show
  // which classes actually share each lane instead of just a count over time.
  const sortedStarts = allStarts.slice().sort((a, b) => a.t - b.t);
  const laneFree = [];
  sortedStarts.forEach(s => {
    let lane = laneFree.findIndex(end => end <= s.t);
    if (lane === -1) { lane = laneFree.length; laneFree.push(0); }
    laneFree[lane] = s.end;
    s.lane = lane;
  });

  return { classes, maxLanes, base: tMin, waveCount, rowCount, starts: sortedStarts };
}

// ════════════════════════════════════════════════════════════════════
//  Navisport fetch
// ════════════════════════════════════════════════════════════════════
function extractSlug(input) {
  const s = String(input == null ? '' : input).trim();
  if (!s) return '';
  if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s)) return s;
  let m = s.match(/navisport\.com\/(?:events|tapahtumat)\/([^\/?#\s]+)/i);
  if (m) return m[1];
  if (/^[a-z0-9][a-z0-9._-]*$/i.test(s)) return s;
  return '';
}

async function fetchEventByUUID(uuid) {
  const res = await fetch('https://navisport.com/api/events/' + uuid);
  if (!res.ok) throw new Error('HTTP ' + res.status + ' for event ' + uuid);
  return res.json();
}

async function fetchEvent(input) {
  const id = extractSlug(input);
  if (!id) throw new Error(T('errSlug'));
  if (/^[0-9a-f]{8}-/i.test(id)) return fetchEventByUUID(id);
  const enc = encodeURIComponent(JSON.stringify({ '0': id }));
  const url = 'https://navisport.com/trpc/eventsTrpcRouter.getEvent,adsTrpcRouter.getAds?batch=1&input=' + enc;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status + ' for "' + id + '"');
  const batch = await res.json();
  const data = batch && batch[0] && batch[0].result && batch[0].result.data;
  if (!data || !data.id) throw new Error(T('errEvent'));
  return fetchEventByUUID(data.id);
}

// ════════════════════════════════════════════════════════════════════
//  Canvas charts
// ════════════════════════════════════════════════════════════════════
let chartSeq = 0;
let combSeq = 0;
const chartStore = {};

function chartCanvas(cfg) {
  const id = cfg.id || ('ch' + (++chartSeq));
  chartStore[id] = cfg;
  return '<div class="chartwrap"><canvas data-chart-id="' + id + '" class="chart"></canvas>' +
    '<div class="charttip" data-tip-for="' + id + '" hidden></div></div>';
}

function stepPoints(sortedMin) {
  const pts = [{ x: 0, y: 0 }];
  let n = 0;
  for (const v of sortedMin) {
    pts.push({ x: v, y: n });
    n++;
    pts.push({ x: v, y: n });
  }
  return pts;
}

function stepEvents(sortedMin) {
  const ev = [{ x: 0, y: 0 }];
  let n = 0;
  for (const v of sortedMin) {
    ev.push({ x: v, y: n });
    n++;
    ev.push({ x: v, y: n });
  }
  ev.push({ x: Infinity, y: n });
  return ev;
}

function niceStep(span) {
  const raw = span / 6;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
  return step * mag;
}

function drawStepArea(ctx, sortedMin, color, fill, X, Y, sMin, xMax) {
  ctx.beginPath();
  ctx.moveTo(X(sMin), Y(0));
  for (const p of stepPoints(sortedMin)) {
    if (p.x < sMin) continue;
    ctx.lineTo(X(Math.min(p.x, xMax)), Y(p.y));
  }
  ctx.lineTo(X(xMax), Y(sortedMin.length));
  ctx.lineTo(X(xMax), Y(0));
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  let started = false;
  for (const p of stepPoints(sortedMin)) {
    if (p.x < sMin) continue;
    const x = X(Math.min(p.x, xMax));
    const y = Y(p.y);
    if (!started) { ctx.moveTo(x, y); started = true; }
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function drawFlowChart(ctx, w, h, opts, cross) {
  const starts = opts.starts || [];
  const classes = opts.classes || [];
  const peak = opts.peak || null;
  const padL = 42, padR = 8, padT = 8, padB = 24;
  const pw = w - padL - padR;
  const ph = h - padT - padB;
  const sMin = starts.length ? starts[0] : 0;
  let lastFinish = 0;
  for (const c of classes) if (c.mins.length) lastFinish = Math.max(lastFinish, c.mins[c.mins.length - 1]);
  const xMax = Math.max(starts.length ? starts[starts.length - 1] : 0, lastFinish, 1);
  let yMax = starts.length;
  for (const c of classes) yMax += c.mins.length;
  yMax = Math.max(yMax, 1);
  const spanX = (xMax - sMin) || 1;
  const X = m => padL + ((m - sMin) / spanX) * pw;
  const Y = n => padT + ph - (n / yMax) * ph;
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  const yTicks = 4;
  for (let i = 0; i <= yTicks; i++) {
    const val = Math.round(yMax * i / yTicks);
    const y = Y(val);
    ctx.strokeStyle = '#e4e9f0';
    ctx.fillStyle = '#8a97a6';
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(w - padR, y);
    ctx.stroke();
    ctx.fillText(String(val), padL - 5, y);
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#8a97a6';
  const xLab = opts.xMode === 'clock' && opts.clockBase != null
    ? (m) => fmtClock(opts.clockBase + m * 60000)
    : fmtMin;
  const step = niceStep(spanX);
  for (let m = Math.ceil(sMin / step) * step; m <= xMax + 0.01; m += step) {
    const x = X(Math.max(m, sMin));
    ctx.strokeStyle = '#eef2f6';
    ctx.beginPath();
    ctx.moveTo(x, padT);
    ctx.lineTo(x, padT + ph);
    ctx.stroke();
    ctx.fillText(xLab(m), x, h - 14);
  }
  if (peak && peak.count > 0) {
    const x0 = X(Math.max(peak.from, sMin));
    const x1 = X(Math.min(peak.to, xMax));
    if (x1 > x0) {
      ctx.fillStyle = 'rgba(230,126,34,0.14)';
      ctx.fillRect(x0, padT, x1 - x0, ph);
      const lbl = T('pPeak') + ' ' + xLab(peak.from) + '–' + xLab(peak.to) + ' · ' + peak.count;
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'left';
      const tw = ctx.measureText(lbl).width || 120;
      const lx = Math.max(padL, Math.min(x0 + 4, w - padR - tw - 8));
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.fillRect(lx, padT + 3, tw + 8, 15);
      ctx.fillStyle = '#b0560f';
      ctx.fillText(lbl, lx + 4, padT + 5);
    }
  }
  const markers = opts.markers || [];
  const markerLabel = { mMass: T('mMass'), mExch: T('mExch'), mRestart: T('mRestart') };
  for (const mk of markers) {
    const x = X(mk.at);
    if (x < padL || x > w - padR) continue;
    ctx.strokeStyle = 'rgba(196,106,42,0.9)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(x, padT);
    ctx.lineTo(x, padT + ph);
    ctx.stroke();
    ctx.setLineDash([]);
    const lbl = markerLabel[mk.key] || mk.key;
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'left';
    const tw = ctx.measureText(lbl).width || 70;
    const lx = Math.max(padL, Math.min(x - tw - 8, w - padR - tw - 8));
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fillRect(lx, padT + 22, tw + 8, 15);
    ctx.fillStyle = '#8a5a1c';
    ctx.fillText(lbl, lx + 4, padT + 24);
  }
  drawStepArea(ctx, starts, '#2e5a8a', 'rgba(46,90,138,0.10)', X, Y, sMin, xMax);
  let acc = [];
  ctx.lineWidth = 1.5;
  for (const c of classes) {
    const bot = stepEvents(acc);
    const merged = acc.concat(c.mins).sort((a, b) => a - b);
    const top = stepEvents(merged);
    acc = merged;
    ctx.beginPath();
    let started = false;
    for (const e of top) {
      const x = X(Math.min(Math.max(e.x, sMin), xMax));
      const y = Y(e.y);
      if (!started) { ctx.moveTo(x, y); started = true; }
      else ctx.lineTo(x, y);
    }
    ctx.lineTo(X(xMax), Y(top[top.length - 1].y));
    for (let i = bot.length - 1; i >= 0; i--) {
      ctx.lineTo(X(Math.min(Math.max(bot[i].x, sMin), xMax)), Y(bot[i].y));
    }
    ctx.closePath();
    ctx.fillStyle = c.color + 'cc';
    ctx.fill();
    ctx.strokeStyle = c.color;
    ctx.beginPath();
    started = false;
    for (const e of top) {
      const x = X(Math.min(Math.max(e.x, sMin), xMax));
      const y = Y(e.y);
      if (!started) { ctx.moveTo(x, y); started = true; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.strokeStyle = '#c9d2dc';
  ctx.beginPath();
  ctx.moveTo(padL, padT + ph);
  ctx.lineTo(w - padR, padT + ph);
  ctx.stroke();
  if (cross) drawCrosshair(ctx, w, h, padL, padR, padT, ph, cross);
}

function drawCrosshair(ctx, w, h, padL, padR, padT, ph, cross) {
  const cx = cross.x, cy = cross.y;
  if (cx < padL || cx > w - padR || cy < padT || cy > padT + ph) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(108,122,140,0.85)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.beginPath();
  ctx.moveTo(cx, padT);
  ctx.lineTo(cx, padT + ph);
  ctx.moveTo(padL, cy);
  ctx.lineTo(w - padR, cy);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(30,40,55,0.5)';
  ctx.beginPath();
  ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

// Horizontal bar chart of average pace (min/km) per relay class. No runner
// counts or names — just class + pace, sorted fastest first.
function paintPace(ctx, w, h, cfg) {
  ctx.clearRect(0, 0, w, h);
  const paces = cfg.paces || [];
  const n = paces.length;
  if (!n) return;
  const refs = cfg.refs || [];
  const padT = 6, padB = 22;
  const rowH = Math.max(18, Math.floor((h - padT - padB) / n));
  ctx.font = '12px sans-serif';
  ctx.textBaseline = 'middle';
  let nameW = 72;
  for (const p of paces) {
    const mw = ctx.measureText ? (ctx.measureText(p.className).width || 0) : 0;
    if (mw + 12 > nameW) nameW = mw + 12;
  }
  const padL = nameW;
  const padR = 52;
  const pw = w - padL - padR;
  const maxV = Math.max(1, Math.ceil(Math.max(
    ...paces.map(p => p.paceSec / 60),
    ...refs.map(r => r.paceSec / 60)
  )));
  const X = v => padL + (v / maxV) * pw;
  const step = niceStep(maxV);
  ctx.textAlign = 'center';
  for (let v = 0; v <= maxV + 0.001; v += step) {
    const x = X(v);
    ctx.strokeStyle = '#eef2f6';
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, h - padB); ctx.stroke();
    ctx.fillStyle = '#8a97a6';
    ctx.fillText(String(v), x, h - padB + 10);
  }
  for (let i = 0; i < n; i++) {
    const p = paces[i];
    const v = p.paceSec / 60;
    const y = padT + i * rowH;
    const bw = Math.max(2, X(v) - padL);
    ctx.fillStyle = CLASS_PALETTE[i % CLASS_PALETTE.length];
    ctx.beginPath();
    if (typeof ctx.roundRect === 'function') ctx.roundRect(padL, y + 3, bw, rowH - 8, 4);
    else { ctx.rect(padL, y + 3, bw, rowH - 8); }
    ctx.fill();
    // Fastest individual pace in the class, overprinted on the same bar as a
    // plain tick — no static label, the value only shows up in the tooltip
    // (see attachPaceTip) so the chart doesn't get cluttered with a second number.
    if (p.fastestSec != null) {
      const fx = X(p.fastestSec / 60);
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(fx, y + 3);
      ctx.lineTo(fx, y + rowH - 5);
      ctx.stroke();
    }
    ctx.fillStyle = '#33475b';
    ctx.textAlign = 'right';
    ctx.fillText(p.className, padL - 8, y + rowH / 2);
    ctx.textAlign = 'left';
    ctx.fillText(fmtTime(p.paceSec), X(v) + 6, y + rowH / 2);
  }
  if (refs.length) drawPaceRefs(ctx, w, padL, padR, padT, h - padB, refs, X);
  cfg._paceMap = { padL, padR, padT, rowH, paces, X };
}

// Hit-tests hover/tap position against each row's fastest-pace tick and shows
// its value in the shared tooltip element — the only place that number appears.
function attachPaceTip(c) {
  if (typeof document === 'undefined' || typeof document.querySelector !== 'function') return;
  const tip = document.querySelector('[data-tip-for="' + c.dataset.chartId + '"]');
  if (!tip) return;
  const cfgOf = () => chartStore[c.dataset.chartId];
  const show = (clientX, clientY) => {
    const cfg = cfgOf();
    const map = cfg && cfg._paceMap;
    if (!map) { tip.hidden = true; return; }
    const rect = c.getBoundingClientRect();
    const px = clientX - rect.left, py = clientY - rect.top;
    const i = Math.floor((py - map.padT) / map.rowH);
    const p = i >= 0 && i < map.paces.length ? map.paces[i] : null;
    if (!p || p.fastestSec == null) { tip.hidden = true; return; }
    const fx = map.X(p.fastestSec / 60);
    if (Math.abs(px - fx) > 8) { tip.hidden = true; return; }
    tip.innerHTML = '<b>' + esc(p.className) + '</b><br>' + esc(T('lFastest')) + ': ' + esc(fmtTime(p.fastestSec));
    tip.hidden = false;
    const wrap = c.parentElement;
    const wr = wrap.getBoundingClientRect();
    const ww = wrap.clientWidth || rect.width;
    tip.style.left = Math.max(0, Math.min(clientX - wr.left + 14, ww - 220)) + 'px';
    let ty = clientY - wr.top - (tip.offsetHeight || 0) - 10;
    if (ty < 2) ty = clientY - wr.top + 16;
    tip.style.top = ty + 'px';
  };
  c.addEventListener('mousemove', (e) => show(e.clientX, e.clientY));
  c.addEventListener('mouseleave', () => { tip.hidden = true; });
  c.addEventListener('touchstart', (e) => {
    const t = e.touches && e.touches[0];
    if (t) show(t.clientX, t.clientY);
  }, { passive: true });
  c.addEventListener('touchend', () => { tip.hidden = true; }, { passive: true });
  c.addEventListener('touchcancel', () => { tip.hidden = true; }, { passive: true });
}

// Dashed vertical lines + labels marking fixed pace benchmarks (e.g. elite
// race winners) against the class bars, so classes can be sized up visually.
// Draws just the dashed reference lines — no in-chart labels, since two refs
// close in pace would overlap. Names/values are listed in paceRefsLegend()
// instead, placed below the chart.
function drawPaceRefs(ctx, w, padL, padR, padT, bottomY, refs, X) {
  ctx.save();
  refs.forEach((r) => {
    const x = X(r.paceSec / 60);
    if (x < padL || x > w - padR) return;
    ctx.strokeStyle = r.color || '#c46a2a';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(x, padT);
    ctx.lineTo(x, bottomY);
    ctx.stroke();
  });
  ctx.restore();
}

// Schedule Gantt chart: horizontal bars per class on a clock-time axis,
// packed into as few lanes as overlap allows (classes with disjoint start
// windows share a row), with a lane-count area chart below.
function paintSchedule(ctx, w, h, cfg) {
  ctx.clearRect(0, 0, w, h);
  const classes = cfg.classes || [];
  const maxLanes = cfg.maxLanes || 0;
  const waveCount = cfg.waveCount || 1;
  const rowCount = cfg.rowCount || classes.length;

  const starts = cfg.starts || [];
  const padL = 42, padR = 12, padT = 6, padB = 24;
  const barH = 20, barGap = 4;
  const laneRowH = 15, laneRowGap = 3;
  const laneChartH = maxLanes > 0 ? maxLanes * (laneRowH + laneRowGap) : 0;
  const gap = 22;
  const barsTop = padT;
  const laneTop = barsTop + rowCount * (barH + barGap) + gap;

  const tMin = Math.min(...classes.map(c => c.firstStart));
  const tMax = Math.max(...classes.map(c => c.lastStart));
  const spanMs = (tMax - tMin) || 1;
  const pw = w - padL - padR;
  const X = t => padL + ((t - tMin) / spanMs) * pw;

  const courseIds = [...new Set(classes.map(c => c.courseId).filter(id => id != null))];
  const courseColor = {};
  courseIds.forEach((id, i) => { courseColor[id] = CLASS_PALETTE[i % CLASS_PALETTE.length]; });

  if (waveCount > 1) {
    let prevWave = -1;
    classes.forEach(c => {
      if (prevWave >= 0 && c.wave !== prevWave) {
        const y = barsTop + c.waveRowStart * (barH + barGap) - barGap / 2;
        ctx.strokeStyle = '#c0cad8';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(w - padR, y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      prevWave = c.wave;
    });
  }

  classes.forEach(c => {
    const y = barsTop + c.row * (barH + barGap);
    const x0 = X(c.firstStart);
    const x1 = X(c.lastStart);
    const color = c.courseId != null ? (courseColor[c.courseId] || '#999') : '#bbb';

    ctx.fillStyle = color;
    ctx.globalAlpha = 0.82;
    const bw = Math.max(x1 - x0, 3);
    if (bw > 6) {
      const r = Math.min(3, bw / 4);
      ctx.beginPath();
      ctx.moveTo(x0 + r, y);
      ctx.lineTo(x0 + bw - r, y);
      ctx.arcTo(x0 + bw, y, x0 + bw, y + r, r);
      ctx.lineTo(x0 + bw, y + barH - r);
      ctx.arcTo(x0 + bw, y + barH, x0 + bw - r, y + barH, r);
      ctx.lineTo(x0 + r, y + barH);
      ctx.arcTo(x0, y + barH, x0, y + barH - r, r);
      ctx.lineTo(x0, y + r);
      ctx.arcTo(x0, y, x0 + r, y, r);
      ctx.fill();
    } else {
      ctx.fillRect(x0, y, bw, barH);
    }
    ctx.globalAlpha = 1;

    const label = c.className + ' (' + c.count + ')';
    ctx.font = '10px sans-serif';
    ctx.textBaseline = 'middle';
    const labelW = ctx.measureText(label).width;
    if (bw > labelW + 8) {
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.fillText(label, (x0 + x0 + bw) / 2, y + barH / 2);
    } else {
      ctx.fillStyle = '#1b2330';
      ctx.textAlign = 'left';
      ctx.fillText(label, x0 + bw + 4, y + barH / 2);
    }
  });

  const hitMap = [];
  if (maxLanes > 0) {
    ctx.fillStyle = '#8a97a6';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(T('schLaneTrack'), padL, laneTop - 8);

    for (let n = 0; n < maxLanes; n++) {
      const y = laneTop + n * (laneRowH + laneRowGap);
      ctx.fillStyle = n % 2 === 0 ? 'rgba(31,58,95,0.045)' : 'rgba(31,58,95,0.0)';
      ctx.fillRect(padL, y, w - padL - padR, laneRowH);
      ctx.strokeStyle = '#e4e9f0';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(padL, y + 0.5, w - padL - padR, laneRowH);
      ctx.fillStyle = '#8a97a6';
      ctx.font = '9px sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(n + 1), padL - 6, y + laneRowH / 2);
    }

    starts.forEach(s => {
      const x = X(s.t);
      const y = laneTop + s.lane * (laneRowH + laneRowGap) + laneRowH / 2;
      const color = s.courseId != null ? (courseColor[s.courseId] || '#999') : '#999';
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, 2.6, 0, Math.PI * 2);
      ctx.fill();
      hitMap.push({ x, y, className: s.className, t: s.t, lane: s.lane + 1 });
    });
  }
  cfg._laneMap = { hitMap, padL, padR };

  const spanMin = spanMs / 60000;
  const step = niceStep(spanMin);
  ctx.fillStyle = '#5b6b7c';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const axisY = laneTop + laneChartH + 6;
  for (let m = 0; m <= spanMin + 0.01; m += step) {
    const t = tMin + m * 60000;
    const x = X(t);
    if (x < padL - 1 || x > w - padR + 1) continue;
    ctx.strokeStyle = '#eef2f6';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(x, padT);
    ctx.lineTo(x, laneTop + laneChartH);
    ctx.stroke();
    ctx.fillText(fmtClock(t), x, axisY);
  }

  ctx.strokeStyle = '#dde3ea';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padL, laneTop + laneChartH);
  ctx.lineTo(w - padR, laneTop + laneChartH);
  ctx.stroke();
}

// Hit-tests hover/tap position against each start's dot in the lane track
// and shows which class/time occupies that lane in the shared tooltip.
function attachScheduleTip(c) {
  if (typeof document === 'undefined' || typeof document.querySelector !== 'function') return;
  const tip = document.querySelector('[data-tip-for="' + c.dataset.chartId + '"]');
  if (!tip) return;
  const cfgOf = () => chartStore[c.dataset.chartId];
  const show = (clientX, clientY) => {
    const cfg = cfgOf();
    const map = cfg && cfg._laneMap;
    if (!map || !map.hitMap.length) { tip.hidden = true; return; }
    const rect = c.getBoundingClientRect();
    const px = clientX - rect.left, py = clientY - rect.top;
    let best = null, bestD = 36;
    map.hitMap.forEach(p => {
      const d = (p.x - px) * (p.x - px) + (p.y - py) * (p.y - py);
      if (d < bestD) { bestD = d; best = p; }
    });
    if (!best) { tip.hidden = true; return; }
    tip.innerHTML = '<b>' + esc(best.className) + '</b><br>' +
      esc(fmtClock(best.t)) + ' · ' + esc(T('schLane')) + ' ' + best.lane;
    tip.hidden = false;
    const wrap = c.parentElement;
    const wr = wrap.getBoundingClientRect();
    const ww = wrap.clientWidth || rect.width;
    tip.style.left = Math.max(0, Math.min(clientX - wr.left + 14, ww - 220)) + 'px';
    let ty = clientY - wr.top - (tip.offsetHeight || 0) - 10;
    if (ty < 2) ty = clientY - wr.top + 16;
    tip.style.top = ty + 'px';
  };
  c.addEventListener('mousemove', (e) => show(e.clientX, e.clientY));
  c.addEventListener('mouseleave', () => { tip.hidden = true; });
  c.addEventListener('touchstart', (e) => {
    const t = e.touches && e.touches[0];
    if (t) show(t.clientX, t.clientY);
  }, { passive: true });
  c.addEventListener('touchend', () => { tip.hidden = true; }, { passive: true });
  c.addEventListener('touchcancel', () => { tip.hidden = true; }, { passive: true });
}

function tipHtmlFor(cfg, m) {
  const binW = 5;
  const from = Math.floor(m / binW) * binW;
  const to = from + binW;
  const finCounts = [];
  let finishing = 0;
  cfg.classes.forEach(c => {
    const n = c.mins.filter(v => v >= from && v < to).length;
    finishing += n;
    finCounts.push({ name: c.className, n, color: c.color });
  });
  const starting = cfg.starts ? cfg.starts.filter(v => v >= from && v < to).length : 0;
  const parts = [];
  parts.push('<b>' + esc(T('lWindow')) + ' ' + fmtMin(from) + '–' + fmtMin(to) + '</b>');
  if (cfg.clockBase != null) {
    parts.push('<span class="tipclock">' + esc(fmtClock(cfg.clockBase + from * 60000)) + '–' +
      esc(fmtClock(cfg.clockBase + to * 60000)) + '</span>');
  }
  parts.push(esc(T('lFinishing')) + ': ' + finishing);
  if (cfg.starts && cfg.starts.length) parts.push(esc(T('lStarting')) + ': ' + starting);
  const hit = finCounts.filter(p => p.n > 0).sort((a, b) => b.n - a.n).slice(0, 6);
  if (hit.length) {
    parts.push(hit.map(p =>
      '<span class="tipcls"><span class="sw" style="background:' + p.color + '"></span>' +
      esc(p.name) + ' ' + p.n + '</span>'
    ).join(''));
  }
  if (cfg.peak && cfg.peak.from === from) parts.push('<span class="tippeak">' + esc(T('pPeak')) + '</span>');
  return parts.join('<br>');
}

function flowMap(cfg, w) {
  const padL = 42, padR = 8, padT = 8, padB = 24;
  const pw = Math.max(1, w - padL - padR);
  const starts = cfg.starts || [];
  const sMin = starts.length ? starts[0] : 0;
  let lastFinish = 0;
  for (const cl of cfg.classes || []) if (cl.mins.length) lastFinish = Math.max(lastFinish, cl.mins[cl.mins.length - 1]);
  const xMax = Math.max(starts.length ? starts[starts.length - 1] : 0, lastFinish, 1);
  return { padL, padR, padT, padB, pw, sMin, spanX: (xMax - sMin) || 1, xMax };
}

function paintFlow(c, cfg, w, h, dpr, cross) {
  const ctx = c.getContext('2d');
  if (!ctx) return;
  const hidden = cfg.hiddenIds || [];
  const hiddenAny = !!hidden.length || !!cfg.hideStarts;
  const eff = effectiveClasses(cfg);
  // Sanitize: ignore any non-finite minute so a corrupt value can never
  // produce a NaN extent or a blank canvas.
  const classes = eff.filter(cl => hidden.indexOf(cl.id) === -1).map(cl => ({
    id: cl.id, className: cl.className, color: cl.color,
    mins: (cl.mins || []).filter(m => isFinite(m)).sort((a, b) => a - b),
    starts: (cl.starts || []).filter(m => isFinite(m)).sort((a, b) => a - b),
  }));
  let starts;
  if (cfg.hideStarts) starts = [];
  else if (!hiddenAny) starts = (cfg.starts || []).filter(m => isFinite(m)).slice();
  else {
    starts = [];
    for (const cl of classes) for (const m of cl.starts) starts.push(m);
    for (const m of (cfg.extraStartMins || [])) starts.push(m);
    starts.sort((a, b) => a - b);
  }
  const allFinish = [];
  for (const cl of classes) for (const m of cl.mins) allFinish.push(m);
  allFinish.sort((a, b) => a - b);
  const view = { starts, classes, peak: finishPeak(allFinish), clockBase: cfg.clockBase, xMode: cfg.xMode };
  cfg._view = view;
  cfg.mapX = flowMap(view, w);
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  drawFlowChart(ctx, w, h, view, cross);
  ctx.restore();
}

// Effective per-class draw series honoring user combine groups. Each returned
// class also carries its own start minutes so hidden classes drop out of the
// started curve too.
function effectiveClasses(cfg) {
  const sbc = cfg.startByClass || {};
  const startsFor = ids => {
    const a = [];
    for (const id of ids) for (const m of (sbc[id] || [])) a.push(m);
    return a.sort((x, y) => x - y);
  };
  const out = [];
  const used = {};
  for (const g of (cfg.combines || [])) {
    const mins = [];
    for (const id of g.ids) for (const c of (cfg.classes || [])) if (c.id === id) for (const m of c.mins) mins.push(m);
    mins.sort((x, y) => x - y);
    out.push({ id: g.id, className: g.name, color: g.color, mins, starts: startsFor(g.ids) });
    for (const id of g.ids) used[id] = true;
  }
  for (const c of (cfg.classes || [])) {
    if (used[c.id]) continue;
    out.push({ id: c.id, className: c.className, color: c.color, mins: c.mins, starts: startsFor([c.id]) });
  }
  return out;
}

function rebuildLegendItems(cfg) {
  const used = {};
  (cfg.combines || []).forEach(g => g.ids.forEach(id => { used[id] = true; }));
  const items = [{ key: 'started', name: T('lStarted'), color: '#2e5a8a' }];
  (cfg.combines || []).forEach(g => items.push({ key: g.id, name: g.name, color: g.color, combined: true }));
  (cfg.classes || []).forEach(c => { if (!used[c.id]) items.push({ key: c.id, name: c.className, color: c.color }); });
  cfg.legendItems = items;
  cfg.hiddenIds = (cfg.hiddenIds || []).filter(k => items.some(it => it.key === k));
}

function combineSelected(cfg) {
  const keys = cfg.selKeys || [];
  if (keys.length < 2) return;
  const chosen = (cfg.legendItems || []).filter(it => it.key !== 'started' && !it.combined && keys.indexOf(it.key) !== -1);
  if (chosen.length < 2) return;
  cfg.combines = cfg.combines || [];
  cfg.combines.push({ id: '_comb' + (++combSeq), name: chosen.map(it => it.name).join('/'), ids: chosen.map(it => it.key), color: CLASS_PALETTE[cfg.combines.length % CLASS_PALETTE.length] });
  rebuildLegendItems(cfg);
  cfg.selKeys = [];
}

function clearCombines(cfg) {
  cfg.combines = [];
  cfg.selKeys = [];
  rebuildLegendItems(cfg);
}

function rerenderLegend(cfg, legendEl) {
  legendEl.innerHTML = legendInner(cfg, cfg.legendPage || 0);
}

function rerenderAxis(cfg) {
  const host = document.querySelector('.axistoggle[data-chart="' + cfg.id + '"]');
  if (!host) return;
  host.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.axis === cfg.xMode));
}

function repaintChart(cfg) {
  if (!cfg || !cfg._el || !cfg._w) return;
  paintFlow(cfg._el, cfg, cfg._w, cfg._h, cfg._dpr, null);
}

function setupChartInteractions() {
  if (typeof document === 'undefined' || typeof document.addEventListener !== 'function') return;
  document.addEventListener('click', (e) => {
    const t = e.target;
    const btn = t && t.closest ? t.closest('button[data-chart]') : null;
    if (!btn) return;
    const cfg = chartStore[btn.dataset.chart];
    if (!cfg) return;
    const legend = btn.closest('.legend');
    if (btn.dataset.idx !== undefined) {
      const item = cfg.legendItems && cfg.legendItems[+btn.dataset.idx];
      if (!item) return;
      if (t && t.tagName === 'INPUT') {
        cfg.selKeys = cfg.selKeys || [];
        const at = cfg.selKeys.indexOf(item.key);
        if (at === -1) cfg.selKeys.push(item.key);
        else cfg.selKeys.splice(at, 1);
        if (legend) rerenderLegend(cfg, legend);
        return;
      }
      if (item.key === 'started') cfg.hideStarts = !cfg.hideStarts;
      else {
        cfg.hiddenIds = cfg.hiddenIds || [];
        const at = cfg.hiddenIds.indexOf(item.key);
        if (at === -1) cfg.hiddenIds.push(item.key);
        else cfg.hiddenIds.splice(at, 1);
      }
      if (legend) rerenderLegend(cfg, legend);
      repaintChart(cfg);
    } else if (btn.dataset.page !== undefined) {
      cfg.legendPage = Math.max(0, +btn.dataset.page);
      if (legend) rerenderLegend(cfg, legend);
    } else if (btn.dataset.axis !== undefined) {
      cfg.xMode = btn.dataset.axis;
      rerenderAxis(cfg);
      repaintChart(cfg);
    } else if (btn.dataset.combine !== undefined) {
      combineSelected(cfg);
      if (legend) rerenderLegend(cfg, legend);
      repaintChart(cfg);
    } else if (btn.dataset.clear !== undefined) {
      clearCombines(cfg);
      if (legend) rerenderLegend(cfg, legend);
      repaintChart(cfg);
    }
  });
}

function setupScheduleInteractions() {
  if (typeof document === 'undefined' || typeof document.addEventListener !== 'function') return;
  document.addEventListener('click', (e) => {
    const t = e.target;
    const autoBtn = t && t.closest ? t.closest('button[data-sch-auto]') : null;
    const clearBtn = t && t.closest ? t.closest('button[data-sch-clear]') : null;
    const btn = autoBtn || clearBtn;
    if (!btn) return;
    const id = autoBtn ? btn.dataset.schAuto : btn.dataset.schClear;
    const cfg = chartStore[id];
    if (!cfg || cfg.type !== 'schedule') return;
    if (autoBtn) {
      cfg.groups = autoDetectGroups(cfg.event);
    } else {
      cfg.groups = [];
    }
    // Recompute schedule data with new groups
    const sd = scheduleData(cfg.event, cfg.groups.length ? cfg.groups : null);
    if (!sd) return;
    cfg.classes = sd.classes;
    cfg.maxLanes = sd.maxLanes;
    cfg.base = sd.base;
    cfg.waveCount = sd.waveCount;
    cfg.rowCount = sd.rowCount;
    cfg.starts = sd.starts;
    // Resize canvas and repaint
    const canvas = document.querySelector('[data-chart-id="' + id + '"]');
    if (canvas) {
      const h = scheduleChartHeight(cfg);
      canvas.style.height = h + 'px';
      const wrap = canvas.parentElement;
      if (wrap) {
        const dpr = typeof window !== 'undefined' && window.devicePixelRatio || 1;
        const w = wrap.clientWidth || canvas.clientWidth;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        const ctx = canvas.getContext && canvas.getContext('2d');
        if (ctx) {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          paintSchedule(ctx, w, h, cfg);
        }
      }
    }
  });
}

// Double-tap-to-zoom guard: a second tap landing within this many
// milliseconds of the previous tap is part of a double-tap. The chart cancels
// such a tap so a mobile browser can never zoom the page while the organizer
// is just inspecting the flow graph.
const DBL_TAP_MS = 500;

// True when a touch should be cancelled to stop double-tap-to-zoom — i.e. a
// new single-finger touch starting within DBL_TAP_MS of, and close to, the
// previous tap's start. `now` is injectable for tests. Deliberately keyed off
// the previous touchSTART (not touchend): when the browser's own gesture
// recognizer claims a tap as the first half of a double-tap, it fires
// touchcancel instead of touchend, so any state that only updates on touchend
// silently stops tracking taps on real devices.
function isDoubleTapSecond(touches, lastTapStartMs, lastTapStartX, lastTapStartY, now) {
  if (!touches || touches.length !== 1) return false;
  const t = touches[0];
  const n = now != null ? now : Date.now();
  return n - lastTapStartMs < DBL_TAP_MS &&
    Math.abs(t.clientX - lastTapStartX) < 25 &&
    Math.abs(t.clientY - lastTapStartY) < 25;
}

function attachChartTip(c) {
  if (typeof document === 'undefined' || typeof document.querySelector !== 'function') return;
  const tip = document.querySelector('[data-tip-for="' + c.dataset.chartId + '"]');
  if (!tip) return;
  const cfgOf = () => chartStore[c.dataset.chartId];
  const redraw = (cx, cy) => {
    const cfg = cfgOf();
    if (!cfg || !cfg._w) return;
    paintFlow(c, cfg, cfg._w, cfg._h, cfg._dpr, (cx != null && cy != null) ? { x: cx, y: cy } : null);
  };
  const show = (e) => {
    const cfg = cfgOf();
    if (!cfg || !cfg.mapX) { tip.hidden = true; return; }
    const view = cfg._view || cfg;
    const rect = c.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const map = cfg.mapX;
    const inside = px >= map.padL && px <= rect.width - map.padR &&
      py >= map.padT && py <= rect.height - map.padB;
    if (!inside) { tip.hidden = true; redraw(); return; }
