<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>25-manna joukkuesuunnittelija</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #e8e8e8; color: #222; }

#top {
  position: fixed; top: 0; left: 0; bottom: 0; width: 370px;
  background: #1a1a2e; color: #eee; padding: 12px;
  display: flex; flex-direction: column; gap: 12px;
  overflow-y: auto; z-index: 100; box-shadow: 2px 0 12px rgba(0,0,0,0.5);
}
.ps { background: #16213e; border-radius: 8px; padding: 10px 12px; flex: none; min-width: 0; }
.ps:last-child { margin-top: auto; }
.ps h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #7ec8e3; margin-bottom: 8px; }
.step-hdr { cursor: pointer; user-select: none; }
.step-hdr:hover { opacity: .85; }
.step-toggle { display: inline-block; width: 16px; color: #7ec8e3; }
.ps label { display: block; font-size: 11px; color: #9aa; margin-bottom: 3px; margin-top: 6px; }
textarea, input[type="text"], input[type="number"], select {
  width: 100%; padding: 5px 7px; background: #0f3460; border: 1px solid #334;
  border-radius: 4px; color: #eee; font-size: 12px;
}
textarea { font-family: ui-monospace, Menlo, Consolas, monospace; resize: vertical; }
button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
button:disabled { opacity: .45; cursor: not-allowed; }
.bp { background: #e94560; color: #fff; }
.bs { background: #27ae60; color: #fff; }
.bg { background: #0f3460; color: #7ec8e3; border: 1px solid #334; }
.btn-sm { padding: 3px 8px; font-size: 11px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
.chk { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9aa; }
.chk input { width: auto; }

#main { padding: 16px; margin-left: 386px; }

#statusBar { background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
#statusBar .ok  { color: #27ae60; font-weight: bold; }
#statusBar .err { color: #e94560; font-weight: bold; }
#statusBar .warn { color: #e67e22; font-weight: bold; }
#statusBar .line { margin-top: 4px; }

.card { background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
.card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #1a2a4a; margin-bottom: 8px; }

table.scores { width: 100%; border-collapse: collapse; font-size: 12px; }
.scores th { background: #16213e; color: #7ec8e3; padding: 5px 8px; text-align: left; font-size: 11px; text-transform: uppercase; }
.scores td { padding: 3px 8px; border-bottom: 1px solid #e5e5e5; }
.scores input[type="number"] { width: 52px; padding: 2px 4px; }
.scores select { width: auto; padding: 2px 4px; }
.scores tr.sick td { background: #fdeaea; color: #b05050; }
.scores tr.varamies td { background: rgba(39,174,96,.12); }
.scores td.til { font-size: 11px; color: #667; }
.stepper { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.stp { width: 22px; height: 22px; padding: 0; border: 1px solid #334; border-radius: 4px; background: #0f3460; color: #7ec8e3; font-size: 13px; line-height: 1; cursor: pointer; }
.stp-val { display: inline-block; min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }

#teamsWrap { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding-bottom: 8px; }
.team-col {
  flex: 1 1 0; min-width: 250px; background: #fff; border: 1px solid #ccc;
  border-radius: 8px; overflow: hidden; font-size: 12px;
}
.team-hdr { color: #fff; padding: 8px 10px; }
.team-hdr .tname { font-weight: bold; color: #fff; font-size: 13px; }
.team-hdr .tmeta { font-size: 11px; color: rgba(255,255,255,.85); margin-top: 2px; }
.team-hdr .status { font-size: 10px; font-weight: bold; padding: 1px 7px; border-radius: 9px; margin-left: 6px; }
.team-hdr .status.ok { background: #27ae60; color: #fff; }
.team-hdr .status.err { background: #e94560; color: #fff; }
.team-hdr .problems { font-size: 10.5px; color: #ffe1e1; margin-top: 4px; line-height: 1.4; }
.slot-row { display: flex; align-items: center; gap: 6px; padding: 3px 8px; border-bottom: 1px solid #f0f0f0; }
.slot-row.grp0 { background: #f4f9ff; }
.slot-row.grp1 { background: #fff8f0; }
.slot-row.grp2 { background: #f2fcf4; }
.slot-row.grp3 { background: #faf5ff; }
.slot-row.invalid { background: #fdeaea; }
.slot-row.drop-over { outline: 2px solid #27ae60; outline-offset: -1px; background: #e4f7ea; }
.slot-idx { width: 20px; flex: none; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; color: #99a; text-align: right; }
.slot-lab { font-family: ui-monospace, Menlo, Consolas, monospace; color: #445; width: 38px; flex: none; font-weight: bold; }
.slot-eh { font-size: 9.5px; color: #99a; flex: none; max-width: 110px; }
#teamsCard.no-rules .slot-eh { display: none; }
.runner {
  flex: 1; background: #0f3460; color: #eee; border-radius: 4px; padding: 2px 7px;
  cursor: grab; user-select: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.runner:hover { background: #14467c; }
.runner.sick { background: #8b3a3a; text-decoration: line-through; cursor: not-allowed; }
.runner .str { color: #7ec8e3; font-size: 10px; margin-left: 4px; }
.slot-empty { flex: 1; background: #f0f2f5; color: #bbb; border-radius: 4px; padding: 2px 7px; border: 1px dashed #ccc; font-style: italic; text-align: center; }
.rm-btn { flex: none; background: transparent; border: none; color: #c66; cursor: pointer; font-size: 12px; padding: 0 2px; }
.sick-btn { flex: none; background: transparent; border: none; cursor: pointer; font-size: 12px; padding: 0 2px; line-height: 1; }
.sick-btn:hover { transform: scale(1.2); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  background: #1f6f4a; color: #eee; border-radius: 4px; padding: 2px 8px; font-size: 11px;
  cursor: grab; user-select: none;
}
.chip.sick { background: #8b3a3a; text-decoration: line-through; cursor: not-allowed; }

#saveWrap { margin-top: 14px; display: flex; gap: 10px; align-items: center; }
#saveStatus { font-size: 12px; color: #667; }

@media (max-width: 960px) {
  #top { position: static; width: 100%; height: auto; box-shadow: 0 2px 12px rgba(0,0,0,0.5); }
  #main { margin-left: 0; }
}

@media print {
  #top, #statusBar .no-print, .no-print { display: none !important; }
  #main { margin: 0; padding: 0; }
  body { background: #fff; color: #000; }
  .card { border: none; padding: 4px 0; }
  #teamsWrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .team-col { border: 1px solid #999; page-break-inside: avoid; break-inside: avoid; }
  .slot-row { background: #fff !important; }
  .slot-row.invalid { background: #fdeaea !important; }
  .scores, .chips { display: none; }
}
@page { size: A4 portrait; margin: 10mm; }
</style>
</head>
<body>

<div id="top">
  <div class="ps">
    <h3 class="step-hdr" onclick="toggleStep('pool')"><span class="step-toggle" id="stepTogglePool">▾</span> 1. Juoksijapooli</h3>
    <div class="ps-body" id="psBodyPool">
    <label>Sarja:Nimi, rivikohtaisesti (toive joukkuelle voi olla kolmantena: <code>D16:Virtanen Aino:1</code>)</label>
    <textarea id="poolText" rows="9" placeholder="H21:Kauppi Vesa&#10;D16:Ojapalo Venla:1&#10;H50:Nurmi Mikko&#10;tai syntymävuosi:&#10;Virtanen Matti:1999:M"></textarea>
    <div class="row">
      <button class="bg btn-sm" onclick="loadExamplePool(55)">Esimerkkipooli (55)</button>
      <button class="bg btn-sm" onclick="loadExamplePool(80)">(80)</button>
      <button class="bg btn-sm" onclick="loadExamplePool(105)">(105)</button>
      <label class="chk"><input type="file" id="poolFile" accept=".csv,.txt" style="width:auto;"> Tiedosto</label>
    </div>
    <label>Seura</label>
    <input id="klubi" type="text" value="Espoon Suunta">
    </div>
  </div>
  <div class="ps">
    <h3 class="step-hdr" onclick="toggleStep('gen')"><span class="step-toggle" id="stepToggleGen">▾</span> 2. Generointi</h3>
    <div class="ps-body" id="psBodyGen">
    <div class="row">
      <button class="bs" onclick="generateAll()">Generoi joukkuuet</button>
      <button class="bg" onclick="optimize()">Optimoi</button>
      <button class="bg" onclick="fillGaps()">Täytä aukot</button>
    </div>
    <label class="chk"><input type="checkbox" id="toiveFirst" style="width:auto;" checked> Toiveet ensin (muuten vahvuus ensin)</label>
    <label>Vahvuuskerroin nopeudelle: <input id="wSpeed" type="number" min="0" max="1" step="0.1" value="0.7"></label>
    </div>
  </div>
  <div class="ps" id="statusPanel"></div>
  <div class="ps">
    <h3 class="step-hdr" onclick="toggleStep('save')"><span class="step-toggle" id="stepToggleSave">▾</span> 3. Tulosta / tallenna</h3>
    <div class="ps-body" id="psBodySave">
    <div class="row">
      <button class="bs" onclick="exportCSV()">Vie Navisport-CSV</button>
      <button class="bg" onclick="window.print()">Tulosta</button>
    </div>
    <div class="row">
      <button class="bg btn-sm" onclick="saveState()">Tallenna (JSON)</button>
      <label class="chk"><input type="file" id="loadFile" accept=".json" style="width:auto;"> Lataa (JSON)</label>
    </div>
    <button class="bp btn-sm" onclick="resetAll()" style="margin-top:6px;">Tyhjennä kaikki</button>
    </div>
  </div>
</div>

<div id="main">
  <div id="statusBar"></div>
  <div class="card no-print" id="poolWrap"></div>
  <div class="card no-print" id="chipsWrap"></div>
  <div class="card" id="teamsCard">
    <h3 style="margin-bottom:2px;">Joukkuelistat (25 osuutta, rinnakkaiset alaosuuksina)
      <label class="chk" style="float:right;font-weight:normal;font-size:11px;"><input type="checkbox" id="showRules" style="width:auto;" checked onchange="toggleRules()"> Näytä osuussäännöt</label>
    </h3>
    <div id="teamsWrap"></div>
  </div>
  <div class="card no-print" id="csvWrap" style="display:none;">
    <h3>Navisport-CSV (esikatselu)</h3>
    <textarea id="csvOut" rows="6" style="width:100%;"></textarea>
  </div>
</div>

<script>
const PROFILE = [[1,1],[2,1],[3,4],[7,4],[11,4],[15,4],[19,4],[23,1],[24,1],[25,1]];
const RATA = {
  1:'Sininen', 2:'Sininen 7,2 km', 3:'Oranssi 4,7 km', 7:'Valkoinen 2,5 km',
  11:'Sininen 6,3 km', 15:'Violetti 4,4 km', 19:'Violetti 5,6 km',
  23:'Oranssi 4,2 km', 24:'Sininen 6,1 km (uusintalähtö 4,5 km)', 25:'Sininen 8,1 km (uusintalähtö 6,3 km)'
};
const LEG_INFO = {
  1:'Nainen', 2:'Kaikki', 3:'Mies H≤16/H≥50 tai nainen', 7:'Mies H≤14/H≥60 tai nainen D≤18/D≥45',
  11:'Kaikki', 15:'Nainen', 19:'Kaikki', 23:'Mies H≤16/H≥55 tai nainen D≤20/D≥40',
  24:'Nainen', 25:'Kaikki'
};
const DISP_OSUUS = { 1:1, 2:2, 3:3, 7:4, 11:5, 15:6, 19:7, 23:8, 24:9, 25:10 };
const TEAM_COLORS = ['#0f3460', '#7a1f1f', '#1f6f4a', '#5b3a8b'];
function dispLeg(s) {
  const o = DISP_OSUUS[SLOTS[s].osuus] || SLOTS[s].osuus;
  return SLOTS[s].alaosuus ? `${o}.${SLOTS[s].alaosuus}` : String(o);
}
function grpTint(s) {
  const grp = [1,2,3,7,11,15,19,23,24,25].indexOf(SLOTS[s].osuus);
  return 'grp' + (grp % 4);
}

function buildSlots() {
  const slots = [];
  for (const [osuus, lkm] of PROFILE) {
    for (let j = 0; j < lkm; j++) slots.push({ osuus, alaosuus: lkm > 1 ? String(j + 1) : '', rata: RATA[osuus], info: LEG_INFO[osuus] });
  }
  return slots;
}
const SLOTS = buildSlots();

function parseSarja(sarja) {
  const m = /^([HD])\s*-?\s*(\d+)/i.exec(String(sarja).trim());
  if (!m) return { gender: null, num: null };
  return { gender: m[1].toUpperCase() === 'H' ? 'M' : 'N', num: parseInt(m[2], 10) };
}

function parseGender(tok) {
  const t = String(tok || '').trim().toLowerCase();
  if (t === 'm' || t === 'h' || t === 'mies') return 'M';
  if (t === 'n' || t === 'd' || t === 'nainen') return 'N';
  return null;
}

// Johtaa sarjaluokan syntymävuodesta (esim. 1999 → H21). Ikä lasketaan
// järjestelmän nykyisestä vuodesta, joten sarja noudattaa vuoden vaihtuessa
// vakiomuotoista ikäluokkataulukkoa.
function sarjaFromBirthYear(gender, year) {
  const age = new Date().getFullYear() - year;
  let num;
  if (age <= 12) num = 12;
  else if (age <= 14) num = 14;
  else if (age <= 16) num = 16;
  else if (age <= 18) num = 18;
  else if (age <= 20) num = 20;
  else if (age <= 34) num = 21;
  else if (age <= 39) num = 35;
  else if (age <= 44) num = 40;
  else if (age <= 49) num = 45;
  else if (age <= 54) num = 50;
  else if (age <= 59) num = 55;
  else if (age <= 64) num = 60;
  else if (age <= 69) num = 65;
  else if (age <= 74) num = 70;
  else num = 75;
  return (gender === 'N' ? 'D' : 'H') + num;
}

function parsePool(text) {
  const out = [];
  const seen = new Set();
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    const parts = line.split(':').map(s => s.trim());
    let sarja, nimi, gender, num, toive;
    // Muoto "Suku- ja etunimi:Vuosi:Sukupuoli[:Toive]" → johda sarja iästä.
    if (parts.length >= 3 && /^\d{4}$/.test(parts[1]) && parseGender(parts[2])) {
      nimi = parts[0];
      gender = parseGender(parts[2]);
      sarja = sarjaFromBirthYear(gender, parseInt(parts[1], 10));
      const g = parseSarja(sarja);
      gender = g.gender; num = g.num;
      toive = parts[3] ? parseInt(parts[3], 10) : null;
    } else {
      sarja = parts[0]; nimi = parts[1];
      if (!sarja || !nimi) continue;
      const g = parseSarja(sarja);
      gender = g.gender; num = g.num;
      toive = parts[2] ? parseInt(parts[2], 10) : null;
    }
    if (!nimi || !sarja) continue;
    const key = sarja + ':' + nimi;
    if (seen.has(key)) continue;
    seen.add(key);
    if (!Number.isInteger(toive) || toive < 1) toive = null;
    out.push({ nimi, sarja, gender, num, toive, nopeus: 0, luotettavuus: 0, kipea: false, locked: false });
  }
  return out;
}

function legEligible(r, osuus) {
  const g = r.gender, n = r.num;
  if (osuus === 1 || osuus === 15 || osuus === 16 || osuus === 17 || osuus === 18 || osuus === 24) return g === 'N';
  if (osuus === 2 || osuus === 11 || osuus === 12 || osuus === 13 || osuus === 14 ||
      osuus === 19 || osuus === 20 || osuus === 21 || osuus === 22 || osuus === 25) return true;
  if (osuus === 3 || osuus === 4 || osuus === 5 || osuus === 6) return g === 'N' || (g === 'M' && (n <= 16 || n >= 50));
  if (osuus === 7 || osuus === 8 || osuus === 9 || osuus === 10) return g === 'N' ? (n <= 18 || n >= 45) : (g === 'M' && (n <= 14 || n >= 60));
  if (osuus === 23) return g === 'N' ? (n <= 20 || n >= 40) : (g === 'M' && (n <= 16 || n >= 55));
  return false;
}

function isYoungM(r) { return r.gender === 'M' && r.num !== null && r.num <= 16; }
function isYoungW(r) { return r.gender === 'N' && r.num !== null && r.num <= 16; }
function isH21(r) { return r.gender === 'M' && r.num === 21; }

function teamRequirements(assigned) {
  const problems = [];
  const men = assigned.filter(r => r.gender === 'M');
  const women = assigned.filter(r => r.gender === 'N');
  if (men.length < 9) problems.push(`miehiä ${men.length}/9`);
  else if (!men.some(isYoungM)) problems.push('ei H16 tai nuorempaa miestä');
  if (women.length < 9) problems.push(`naisia ${women.length}/9`);
  else if (!women.some(isYoungW)) problems.push('ei D16 tai nuorempaa naista');
  const h21 = assigned.filter(isH21).length;
  if (h21 > 8) problems.push(`H21-sarjalaisia ${h21}/8`);
  return problems;
}

function validateTeam(team, slots) {
  const assigned = team.filter(Boolean);
  if (assigned.length !== 25) return [`keskeneräinen (${assigned.length}/25)`];
  const problems = [];
  for (let i = 0; i < slots.length; i++) {
    const r = team[i];
    if (r && !legEligible(r, slots[i].osuus)) problems.push(`osuus ${slots[i].osuus}${slots[i].alaosuus ? '.' + slots[i].alaosuus : ''}: ${r.nimi} (${r.sarja}) ei kelpaa`);
  }
  return problems.concat(teamRequirements(assigned));
}

function strengthOf(r) {
  if (!r) return 0;
  return (S.wSpeed || 0.7) * (r.nopeus || 0) + (1 - (S.wSpeed || 0.7)) * (r.luotettavuus || 0);
}

// Solves all N teams jointly: slot types are processed in ascending candidate
// order across every team, so scarce restricted-class runners (e.g. legs 7–10)
// are shared fairly instead of being squandered by the first team.
function solveAllTeams(pool, N) {
  const cands = SLOTS.map(s => pool.filter(r => !r.kipea && legEligible(r, s.osuus)));
  const order = SLOTS.map((s, i) => i).sort((a, b) => cands[a].length - cands[b].length);
  const teams = Array.from({ length: N }, () => new Array(25).fill(null));
  const cnt = Array.from({ length: N }, () => ({ men: 0, women: 0, youngM: 0, youngW: 0, h21: 0 }));
  const plan = [];
  for (const s of order) for (let t = 0; t < N; t++) plan.push([t, s]);
  const used = new Set();
  let nodes = 0;

  function feasible(k) {
    const sets = [];
    for (let t = 0; t < N; t++) sets.push({ w: new Set(), m: new Set(), ym: new Set(), yw: new Set() });
    for (let x = k; x < plan.length; x++) {
      const [t, s] = plan[x];
      const arr = cands[s];
      for (let i = 0; i < arr.length; i++) {
        const r = arr[i];
        if (used.has(r)) continue;
        const st = sets[t];
        if (r.gender === 'N') st.w.add(r); else st.m.add(r);
        if (isYoungM(r)) st.ym.add(r);
        if (isYoungW(r)) st.yw.add(r);
      }
    }
    for (let t = 0; t < N; t++) {
      if (cnt[t].h21 > 8) return false;
      const st = sets[t];
      if (cnt[t].women + st.w.size < 9) return false;
      if (cnt[t].men + st.m.size < 9) return false;
      if (cnt[t].youngM + st.ym.size < 1) return false;
      if (cnt[t].youngW + st.yw.size < 1) return false;
    }
    return true;
  }

  function backtrack(k) {
    if (k === plan.length) return true;
    if (++nodes > 300000) return false;
    const [t, s] = plan[k];
    const list = cands[s].filter(r => !used.has(r))
      .sort((a, b) => (b.toive === t + 1) - (a.toive === t + 1) || strengthOf(b) - strengthOf(a));
    for (const r of list) {
      teams[t][s] = r;
      used.add(r);
      const c = cnt[t];
      if (r.gender === 'N') c.women++; else c.men++;
      if (isYoungM(r)) c.youngM++;
      if (isYoungW(r)) c.youngW++;
      if (isH21(r)) c.h21++;
      if (feasible(k + 1) && backtrack(k + 1)) return true;
      teams[t][s] = null;
      used.delete(r);
      if (r.gender === 'N') c.women--; else c.men--;
      if (isYoungM(r)) c.youngM--;
      if (isYoungW(r)) c.youngW--;
      if (isH21(r)) c.h21--;
    }
    return false;
  }

  return backtrack(0) ? teams : null;
}

// Cheap necessary conditions to reject an impossible team count before search.
function quickFeasible(pool, n) {
  if (pool.length < n * 25) return false;
  let women = 0, men = 0, youngM = 0, youngW = 0, h21 = 0, leg710 = 0, leg23 = 0;
  for (const r of pool) {
    if (r.gender === 'N') women++; else men++;
    if (isYoungM(r)) youngM++;
    if (isYoungW(r)) youngW++;
    if (isH21(r)) h21++;
    if (legEligible(r, 7)) leg710++;
    if (legEligible(r, 23)) leg23++;
  }
  if (women < n * 6) return false; // 6 women-only slots per team
  if (women < n * 9 || men < n * 9) return false;
  if (youngM < n || youngW < n) return false;
  if (pool.length - h21 < n * (25 - 8)) return false; // ≤8 H21 per team → ≥17 non-H21 per team
  if (leg710 < n * 4) return false; // 4 slots of osuus 7–10 per team
  if (leg23 < n) return false;      // 1 slot of osuus 23 per team
  return true;
}

function generateTeams(runners, N) {
  for (let n = N; n >= 1; n--) {
    const remaining = runners.filter(r => !r.kipea);
    if (!quickFeasible(remaining, n)) continue;
    const teams = solveAllTeams(remaining, n);
    if (!teams) continue;
    const usedSet = new Set(teams.flat().filter(Boolean));
    return { teams, leftovers: remaining.filter(r => !usedSet.has(r)), count: n };
  }
  return { error: 'Joukkuetta ei voitu muodostaa. Tarkista pooli: jokaisessa joukkuussa on oltava vähintään 9 miestä (väh. yksi H≤16), vähintään 9 naista (väh. yksi D≤16), enintään 8 H21-sarjalaista ja osuus 1 nainen. Aikuismiehet (H17–H49) mahtuvat vain kaikki-osuuksille (10 paikkaa).' };
}

function scoreState() {
  let pref = 0;
  const sums = S.teams.map(t => t.reduce((s, r) => s + strengthOf(r), 0));
  for (let i = 0; i < S.teams.length; i++) for (const r of S.teams[i]) if (r && r.toive === i + 1) pref++;
  let balance = 0;
  for (let i = 0; i < sums.length - 1; i++) for (let j = i + 1; j < sums.length; j++) balance += (sums[i] - sums[j]);
  const prefW = S.toiveFirst ? 5000 : 1;
  return pref * prefW + balance;
}

function swapSlots(aT, aS, bT, bS) {
  const A = S.teams[aT], B = S.teams[bT];
  const ra = A[aS], rb = B[bS];
  if (ra === rb) return true;
  if ((ra && ra.kipea) || (rb && rb.kipea)) return false;
  A[aS] = rb; B[bS] = ra;
  const ok = aT === bT
    ? validateTeam(A, SLOTS).length === 0
    : validateTeam(A, SLOTS).length === 0 && validateTeam(B, SLOTS).length === 0;
  if (!ok) { A[aS] = ra; B[bS] = rb; }
  return ok;
}

function optimizePasses() {
  if (!S.teams.length) return;
  for (let pass = 0; pass < 80; pass++) {
    let improved = false;
    const before = scoreState();

    // 1) fill empty slots from pool, keeping the team valid
    for (let t = 0; t < S.teams.length; t++) {
      for (let s = 0; s < 25; s++) {
        if (S.teams[t][s]) continue;
        const cands = unassignedRunners().filter(r => !r.kipea && legEligible(r, SLOTS[s].osuus));
        if (!cands.length) continue;
        cands.sort((a, b) => (b.toive === t + 1) - (a.toive === t + 1) || strengthOf(b) - strengthOf(a));
        S.teams[t][s] = cands[0];
        if (validateTeam(S.teams[t], SLOTS).length === 0) improved = true;
        else S.teams[t][s] = null;
      }
    }

    // 2) pair swaps between teams that improve the score and stay valid
    for (let i = 0; i < S.teams.length; i++) {
      for (let j = i + 1; j < S.teams.length; j++) {
        for (let a = 0; a < 25; a++) {
          for (let b = 0; b < 25; b++) {
            const A = S.teams[i][a], B = S.teams[j][b];
            if (!A || !B || A === B) continue;
            if (swapSlots(i, a, j, b)) {
              if (scoreState() > before) improved = true;
              else swapSlots(j, b, i, a);
            }
          }
        }
      }
    }

    // 3) pool <-> team swaps (only when the runner is not already assigned)
    const poolNow = unassignedRunners();
    for (let i = 0; i < S.teams.length; i++) {
      for (let s = 0; s < 25; s++) {
        const r = S.teams[i][s];
        if (!r) continue;
        for (let p = 0; p < poolNow.length; p++) {
          const pr = poolNow[p];
          if (pr.kipea || pr === r || findLocation(pr).kind === 'team') continue;
          S.teams[i][s] = pr;
          if (validateTeam(S.teams[i], SLOTS).length === 0 && scoreState() > before) {
            updatePoolFromTeams();
            improved = true;
            continue;
          }
          S.teams[i][s] = r;
        }
      }
    }

    if (!improved) break;
  }
}

function optimize() {
  if (!S.teams.length) { showWarn('Generoi ensin joukkuelistat.'); return; }
  if (S.teams.some(t => validateTeam(t, SLOTS).length !== 0)) repairTeamGaps();
  optimizePasses();
  renderAll();
  autosave();
  const sums = S.teams.map(t => t.reduce((s, r) => s + strengthOf(r), 0));
  showInfo('Optimoitu. Joukkueiden vahvuudet: ' + sums.map((v, i) => '#' + (i + 1) + ' ' + v.toFixed(1)).join(', '));
}

function readInputs() {
  S.klubi = getEl('klubi').value.trim() || 'Espoon Suunta';
  S.wSpeed = parseFloat(getEl('wSpeed').value);
  if (!(S.wSpeed >= 0 && S.wSpeed <= 1)) S.wSpeed = 0.7;
  S.toiveFirst = getEl('toiveFirst').checked;
  S.poolText = getEl('poolText').value;
}

// Carry over per-runner settings (kipea, nopeus, luotettavuus, toive, locked)
// onto freshly parsed runners, keyed by sarja:nimi.
function mergePoolState(parsed) {
  const prev = new Map();
  for (const r of S.runners) prev.set(r.sarja + ':' + r.nimi, r);
  for (const r of parsed) {
    const old = prev.get(r.sarja + ':' + r.nimi);
    if (old) {
      r.kipea = old.kipea;
      r.nopeus = old.nopeus;
      r.luotettavuus = old.luotettavuus;
      r.toive = old.toive;
      r.locked = old.locked;
    }
  }
}

function poolSignature(r) { return r.sarja + ':' + r.nimi + ':' + (r.toive || ''); }

// Synkronoi poolin tekstilaatikosta. Muutosten tunnistus sarja:nimi:toive
// -allekirjoituksilla: jos sisältö on sama (esim. tyhjä rivi), joukkeita ei
// tyhjennetä turhaan.
function syncPool() {
  readInputs();
  const runners = parsePool(S.poolText);
  const same = S.runners.length === runners.length &&
    S.runners.every((r, i) => poolSignature(r) === poolSignature(runners[i]));
  if (same) return;
  mergePoolState(runners);
  S.runners = runners;
  S.teams = [];
  renderAll();
  autosave();
  if (!runners.length) showWarn('Pooli tyhjä — liitä juoksijoita (Sarja:Nimi) tai lataa tiedosto.');
}

function readPool() { syncPool(); }

function generateAll() {
  readInputs();
  const parsed = parsePool(S.poolText);
  if (!parsed.length) { showError('Poolissa ei ollut yhtään juoksijaa.'); return; }
  mergePoolState(parsed);
  S.runners = parsed;
  const N = Math.floor(S.runners.length / 25);
  if (N < 1) { showError('Tarvitaan vähintään 25 juoksijaa.'); return; }
  const res = generateTeams(S.runners, N);
  if (res.error) { showError(res.error); S.teams = []; renderAll(); return; }
  S.teams = res.teams;
  S.showPool = false;
  updatePoolFromTeams();
  optimizePasses();
  renderAll();
  autosave();
}

function unassignedRunners() {
  if (!S.teams.length) return S.runners.slice();
  return S.runners.filter(r => !S.teams.some(t => t.includes(r)));
}

function updatePoolFromTeams() {
  for (let t = 0; t < S.teams.length; t++) {
    const seen = new Set();
    for (let s = 0; s < 25; s++) {
      if (S.teams[t][s] && seen.has(S.teams[t][s])) S.teams[t][s] = null;
      if (S.teams[t][s]) seen.add(S.teams[t][s]);
    }
  }
}

function findLocation(r) {
  for (let t = 0; t < S.teams.length; t++) {
    const s = S.teams[t].indexOf(r);
    if (s !== -1) return { kind: 'team', t, s };
  }
  return { kind: 'pool' };
}

function fillSlot(teamIdx, slotIdx) {
  const t = S.teams[teamIdx];
  if (t[slotIdx]) return true;
  const osuus = SLOTS[slotIdx].osuus;
  const poolNow = unassignedRunners();
  const cands = poolNow.filter(r => !r.kipea && legEligible(r, osuus));
  if (cands.length) {
    cands.sort((a, b) => (b.toive === teamIdx + 1) - (a.toive === teamIdx + 1) || strengthOf(b) - strengthOf(a));
    t[slotIdx] = cands[0];
    return validateTeam(t, SLOTS).length === 0;
  }
  const backup = cloneTeams();
  for (let j = teamIdx + 1; j < S.teams.length; j++) {
    const tj = S.teams[j];
    for (let s = 0; s < 25; s++) {
      const r = tj[s];
      if (!r || r.kipea || !legEligible(r, osuus)) continue;
      tj[s] = null;
      t[slotIdx] = r;
      if (validateTeam(t, SLOTS).length === 0) {
        const pNow = unassignedRunners();
        const pc = pNow.filter(p => !p.kipea && legEligible(p, SLOTS[s].osuus));
        if (pc.length) {
          pc.sort((a, b) => strengthOf(b) - strengthOf(a));
          tj[s] = pc[0];
          if (validateTeam(tj, SLOTS).length === 0) return true;
        }
      }
      tj[s] = r;
      t[slotIdx] = null;
    }
  }
  restoreTeams(backup);
  return false;
}

function cloneTeams() { return S.teams.map(t => t.slice()); }
function restoreTeams(backup) { S.teams = backup; }

function performMove(runnerIdx, teamIdx, slotIdx) {
  const r = S.runners[runnerIdx];
  if (!r || r.kipea) return;
  const loc = findLocation(r);
  if (loc.kind === 'team' && loc.t === teamIdx && loc.s === slotIdx) return;
  if (!legEligible(r, SLOTS[slotIdx].osuus)) { showWarn('Siirto estetty: ei kelvollinen tälle osuudelle.'); return; }
  const backup = cloneTeams();
  if (loc.kind === 'team') S.teams[loc.t][loc.s] = null;
  S.teams[teamIdx][slotIdx] = r;
  let ok = true;
  const affected = new Set([teamIdx]);
  if (loc.kind === 'team') affected.add(loc.t);
  for (const t of affected) {
    if (S.teams[t].filter(Boolean).length < 25) continue;
    if (validateTeam(S.teams[t], SLOTS).length) { ok = false; break; }
  }
  if (!ok) {
    restoreTeams(backup);
    showWarn('Siirto estetty: rikkoo osuus- tai joukkuuvaatimuksia.');
    return;
  }
  updatePoolFromTeams();
  renderAll();
  autosave();
}

function removeFromTeam(teamIdx, slotIdx) {
  const r = S.teams[teamIdx][slotIdx];
  if (!r || r.kipea) return;
  S.teams[teamIdx][slotIdx] = null;
  updatePoolFromTeams();
  renderAll();
  autosave();
}

// Fills empty slots in all teams, earlier teams first. Prefers varamiehet
// (pool); when the pool has no eligible runner, cascade-steals from later
// teams so the earliest team is completed (its holes shift towards later
// teams, whose holes in turn may be filled from their own later teams).
// Finally incomplete teams are repacked first-legs-first.
function repairTeamGaps() {
  const N = S.teams.length;
  if (!N) return 0;
  let filled = 0;
  for (let t = 0; t < N; t++) {
    for (let s = 0; s < 25; s++) {
      if (S.teams[t][s]) continue;
      const cands = unassignedRunners().filter(r => !r.kipea && legEligible(r, SLOTS[s].osuus));
      if (!cands.length) continue;
      cands.sort((a, b) => (b.toive === t + 1) - (a.toive === t + 1) || strengthOf(b) - strengthOf(a));
      S.teams[t][s] = cands[0];
      filled++;
    }
  }
  updatePoolFromTeams();
  for (let t = 0; t < N; t++) filled += cascadeFillTeam(t);
  updatePoolFromTeams();
  packIncompleteTeams();
  return filled;
}

// Fills every empty slot of team t, stealing eligible runners from later
// teams when the pool has none, preferring a steal whose source slot can be
// refilled from the pool (so the source stays complete). Team t is validated
// only after all its slots are addressed; on failure every change made for t
// is rolled back so the other teams are left untouched.
function cascadeFillTeam(t) {
  const team = S.teams[t];
  if (!team.some(x => !x)) return 0;
  const N = S.teams.length;
  let filled = 0;
  const journal = [];
  for (let s = 0; s < 25; s++) {
    if (team[s]) continue;
    const osuus = SLOTS[s].osuus;
    const pool = unassignedRunners().filter(r => !r.kipea && legEligible(r, osuus));
    if (pool.length) {
      pool.sort((a, b) => (b.toive === t + 1) - (a.toive === t + 1) || strengthOf(b) - strengthOf(a));
      team[s] = pool[0];
      journal.push([t, s, null, pool[0]]);
      filled++;
      continue;
    }
    let best = null, bestRefill = false;
    for (let j = t + 1; j < N; j++) {
      const tj = S.teams[j];
      for (let sj = 0; sj < 25; sj++) {
        const r = tj[sj];
        if (!r || r.kipea || !legEligible(r, osuus)) continue;
        const refillable = unassignedRunners().some(p => !p.kipea && legEligible(p, SLOTS[sj].osuus));
        if (!best || (refillable && !bestRefill)) { best = { j, sj, r, refillable }; bestRefill = refillable; }
      }
    }
    if (!best) break;
    team[s] = best.r;
    journal.push([t, s, null, best.r]);
    S.teams[best.j][best.sj] = null;
    journal.push([best.j, best.sj, best.r, null]);
    if (best.refillable) {
      const pc = unassignedRunners().filter(p => !p.kipea && legEligible(p, SLOTS[best.sj].osuus));
      pc.sort((a, b) => (b.toive === best.j + 1) - (a.toive === best.j + 1) || strengthOf(b) - strengthOf(a));
      S.teams[best.j][best.sj] = pc[0];
      journal.push([best.j, best.sj, null, pc[0]]);
    }
    filled++;
  }
  if (validateTeam(team, SLOTS).length !== 0) {
    for (let k = journal.length - 1; k >= 0; k--) {
      const [ti, si, before] = journal[k];
      S.teams[ti][si] = before;
    }
    return 0;
  }
  return filled;
}

function fillGaps() {
  if (!S.teams.length) { showWarn('Generoi ensin joukkuelistat.'); return; }
  const filled = repairTeamGaps();
  renderAll();
  autosave();
  const gaps = S.teams.reduce((n, tm) => n + tm.filter(x => !x).length, 0);
  showInfo(gaps
    ? `Täytettiin ${filled} aukkoa; ${gaps} aukkoa jäi (ei kelvollisia varamiehiä).`
    : `Kaikki aukot täytetty (${filled} juoksijaa).`);
}

function eligibleCount(r) {
  let n = 0;
  for (let s = 0; s < 25; s++) if (legEligible(r, SLOTS[s].osuus)) n++;
  return n;
}

// Repacks an incomplete team so its runners sit on the earliest legal legs
// (holes end up only at the tail). Most-constrained runners first; if a runner
// cannot be placed the team is left unchanged.
function packTeam(t) {
  const team = S.teams[t];
  const runners = team.filter(Boolean);
  if (runners.length === 25) return;
  const rest = runners.slice().sort((a, b) => eligibleCount(a) - eligibleCount(b));
  const placed = new Array(25).fill(null);
  for (const r of rest) {
    let at = -1;
    for (let s = 0; s < 25; s++) {
      if (!placed[s] && legEligible(r, SLOTS[s].osuus)) { at = s; break; }
    }
    if (at === -1) return;
    placed[at] = r;
  }
  S.teams[t] = placed;
}

function packIncompleteTeams() {
  for (let t = 0; t < S.teams.length; t++) packTeam(t);
}

function setSick(idx, checked) {
  const r = S.runners[idx];
  r.kipea = checked;
  if (checked) {
    r.luotettavuus = 0;
    const loc = findLocation(r);
    if (loc.kind === 'team') {
      S.teams[loc.t][loc.s] = null;
      fillSlot(loc.t, loc.s);
      packTeam(loc.t);
    }
  }
  updatePoolFromTeams();
  renderAll();
  autosave();
}

function bumpScore(idx, field, delta) {
  const v = (S.runners[idx][field] || 0) + delta;
  S.runners[idx][field] = Math.max(0, Math.min(10, v));
  renderAll();
  autosave();
}

function setToive(idx, value) {
  const v = parseInt(value, 10);
  S.runners[idx].toive = Number.isInteger(v) && v >= 1 ? v : null;
  renderAll();
  autosave();
}

const S = { runners: [], teams: [], klubi: 'Espoon Suunta', firstNum: 1, wSpeed: 0.7, toiveFirst: true, poolText: '', showPool: true, poolSort: 'order', poolDir: 1, showRules: true };

function q(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }

function toCSV() {
  if (!S.teams.length) return '';
  const base = ['Kilpailunumero','Sarja','Joukkueen nimi','Kansalaisuus','Seura'];
  const header = base.map(q);
  for (let b = 1; b <= 25; b++) {
    header.push(q(' '.repeat(b)));
    header.push(q(`Nimi-${b}`), q(`Kilpailukortti-${b}`), q(`Lainakortti-${b}`),
      q(`Osuus-${b}`), q(`Alaosuus-${b}`), q(`Rata-${b}`), q(`Lähtöaika-${b}`));
  }
  const lines = [header.join(',')];
  S.teams.forEach((team, ti) => {
    const cells = [q(String(S.firstNum + ti)), q('25-manna'), q(`${S.klubi} ${ti + 1}`), q('FIN'), q(S.klubi)];
    for (let s = 0; s < 25; s++) {
      const r = team[s];
      cells.push(q(' '.repeat(s + 1)));
      cells.push(q(r ? r.nimi : ''), q(''), q(''), q(String(SLOTS[s].osuus)), q(SLOTS[s].alaosuus), q(SLOTS[s].rata), q(''));
    }
    lines.push(cells.join(','));
  });
  return '\ufeff' + lines.join('\r\n') + '\r\n';
}

function exportCSV() {
  const csv = toCSV();
  if (!csv) { showWarn('Ei joukkuelistoja — generoi ensin.'); return; }
  download('25manna_navisport.csv', csv);
  getEl('csvOut').value = csv;
  getEl('csvWrap').style.display = 'block';
}

function download(name, text) {
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

function serializeState() {
  readInputs();
  return {
    v: 1,
    klubi: S.klubi, firstNum: S.firstNum, wSpeed: S.wSpeed, toiveFirst: S.toiveFirst, poolText: S.poolText,
    showPool: S.showPool, poolSort: S.poolSort, poolDir: S.poolDir, showRules: S.showRules,
    runners: S.runners.map(r => ({ nimi: r.nimi, sarja: r.sarja, gender: r.gender, num: r.num, toive: r.toive, nopeus: r.nopeus, luotettavuus: r.luotettavuus, kipea: r.kipea, locked: r.locked })),
    teams: S.teams.map(t => t.map(r => r ? S.runners.indexOf(r) : null)),
  };
}

function restoreState(data) {
  if (!data || data.v !== 1) return false;
  S.klubi = data.klubi || 'Espoon Suunta';
  S.firstNum = data.firstNum || 1;
  S.wSpeed = data.wSpeed != null ? data.wSpeed : 0.7;
  S.toiveFirst = data.toiveFirst !== false;
  S.poolText = data.poolText || '';
  S.showPool = data.showPool !== false;
  S.poolSort = data.poolSort || 'order';
  S.poolDir = data.poolDir || 1;
  S.showRules = data.showRules !== false;
  S.runners = (data.runners || []).map(d => {
    const p = parseSarja(d.sarja || '');
    return {
      nimi: d.nimi, sarja: d.sarja,
      gender: d.gender || p.gender, num: d.num != null ? d.num : p.num,
      toive: d.toive, nopeus: d.nopeus || 0, luotettavuus: d.luotettavuus || 0,
      kipea: !!d.kipea, locked: !!d.locked
    };
  });
  S.teams = (data.teams || []).map(t => t.map(i => (Number.isInteger(i) && S.runners[i]) ? S.runners[i] : null));
  getEl('klubi').value = S.klubi;
  getEl('wSpeed').value = S.wSpeed;
  getEl('toiveFirst').checked = S.toiveFirst;
  getEl('poolText').value = S.poolText;
  return true;
}

function saveState() {
  download('25manna_suunnitelma.json', JSON.stringify(serializeState(), null, 2));
}

function autosave() {
  if (typeof localStorage === 'undefined') return;
  try { localStorage.setItem('25manna_state_v1', JSON.stringify(serializeState())); } catch (e) {}
}

function resetAll() {
  S.runners = []; S.teams = []; S.poolText = '';
  S.showPool = true; S.poolSort = 'order'; S.poolDir = 1; S.showRules = true;
  getEl('poolText').value = '';
  if (typeof localStorage !== 'undefined') { try { localStorage.removeItem('25manna_state_v1'); } catch (e) {} }
  renderAll();
}

function esc(v) { return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function genderLabel(r) {
  if (!r.gender) return '?';
  return r.gender === 'M' ? 'Mies' : 'Nainen';
}

function renderStatus() {
  const el = getEl('statusBar');
  const lines = [];
  if (!S.runners.length) {
    el.innerHTML = '<span class="warn">Liitä juoksijapooli (Sarja:Nimi) tai lataa tiedosto — juoksijat päivittyvät automaattisesti.</span>';
    return;
  }
  lines.push(`<b>${S.runners.length}</b> juoksijaa`);
  if (S.teams.length) {
    lines.push(`<b>${S.teams.length}</b> joukkuetta`);
    const un = unassignedRunners();
    lines.push(`<b>${un.length}</b> vapaana`);
    const men = S.runners.filter(r => r.gender === 'M').length;
    const women = S.runners.filter(r => r.gender === 'N').length;
    lines.push(`${men} miestä / ${women} naista`);
  }
  let html = lines.join(' · ');
  if (S.teams.length) {
    let allOk = true;
    for (let t = 0; t < S.teams.length; t++) {
      const probs = validateTeam(S.teams[t], SLOTS);
      if (probs.length) { allOk = false; html += `<div class="line err">Joukkue ${t + 1}: ${esc(probs.join('; '))}</div>`; }
    }
    if (allOk) html += `<div class="line ok">Kaikki joukkuelistat kelvollisia.</div>`;
  }
  el.innerHTML = html;
}

function renderPanel() {
  const el = getEl('statusPanel');
  if (!S.teams.length) { el.innerHTML = ''; return; }
  const sums = S.teams.map(t => t.reduce((s, r) => s + strengthOf(r), 0));
  let html = '<h3>Joukkuiden vahvuudet</h3>';
  for (let t = 0; t < S.teams.length; t++) {
    const probs = validateTeam(S.teams[t], SLOTS);
    html += `<div class="row" style="justify-content:space-between;"><span style="color:${TEAM_COLORS[t % TEAM_COLORS.length]};">● Joukkue ${t + 1}</span><span>${sums[t].toFixed(1)} <span class="${probs.length ? 'err-msg' : 'ok'}">${probs.length ? '✖' : '✔'}</span></span></div>`;
  }
  el.innerHTML = html;
}

const POOL_COLS = [
  { key: 'nimi', label: 'Nimi', cmp: r => r.nimi, dir: 1 },
  { key: 'sarja', label: 'Sarja', cmp: r => r.sarja, dir: 1 },
  { key: 'toive', label: 'Toive', cmp: r => r.toive, dir: 1 },
  { key: 'nopeus', label: 'Nopeus', cmp: r => r.nopeus, dir: -1 },
  { key: 'luotettavuus', label: 'Luotettavuus', cmp: r => r.luotettavuus, dir: -1 },
  { key: 'vahvuus', label: 'Vahvuus', cmp: r => strengthOf(r), dir: -1 },
  { key: 'kipea', label: 'Kipeä', cmp: r => r.kipea ? 1 : 0, dir: -1 },
  { key: 'tilanne', label: 'Tilanne', cmp: (r, loc) => loc.kind === 'team' ? 0 : (r.kipea ? 2 : 1), dir: 1 },
];

function poolRows() {
  const rows = S.runners.map((r, idx) => ({ r, idx, loc: findLocation(r) }));
  const col = POOL_COLS.find(c => c.key === S.poolSort);
  if (!col) return rows;
  const dir = S.poolDir || col.dir;
  const v = col.cmp;
  return rows.sort((a, b) => {
    const va = v(a.r, a.loc), vb = v(b.r, b.loc);
    const an = va == null, bn = vb == null;
    if (an && bn) return a.idx - b.idx;
    if (an) return 1;
    if (bn) return -1;
    let c = va < vb ? -1 : va > vb ? 1 : 0;
    return (c || (a.idx - b.idx)) * dir;
  });
}

function sortPool(key) {
  if (S.poolSort === key) S.poolDir = -S.poolDir;
  else { S.poolSort = key; S.poolDir = (POOL_COLS.find(c => c.key === key) || {}).dir || 1; }
  autosave();
  renderPoolTable();
}

function poolHeader(col) {
  const active = S.poolSort === col.key;
  const arrow = active ? (S.poolDir > 0 ? ' ▲' : ' ▼') : '';
  return `<th style="cursor:pointer;user-select:none;" onclick="sortPool('${col.key}')" title="Lajittele">${col.label}${arrow}</th>`;
}

function renderPoolTable() {
  const wrap = getEl('poolWrap');
  if (!S.runners.length) { wrap.innerHTML = ''; return; }
  let html = '<h3>Juoksijat ja pisteet</h3>' +
    '<div class="row" style="justify-content:flex-start;align-items:center;margin-bottom:4px;">' +
    `<label class="chk"><input type="checkbox" id="showPool" style="width:auto;" ${S.showPool ? 'checked' : ''} onchange="togglePool()"> Näytä lista</label>` +
    '</div>' +
    '<div id="poolTableWrap"' + (S.showPool ? '' : ' style="display:none;"') + '>' +
    '<table class="scores"><thead><tr>' +
    POOL_COLS.map(poolHeader).join('') +
    '</tr></thead><tbody>';
  poolRows().forEach(({ r, idx, loc }) => {
    const inTeam = loc.kind === 'team';
    const til = inTeam
      ? `<span style="color:${TEAM_COLORS[loc.t % TEAM_COLORS.length]};">● Joukkue ${loc.t + 1} · osuus ${SLOTS[loc.s].osuus}${SLOTS[loc.s].alaosuus ? '.' + SLOTS[loc.s].alaosuus : ''}</span>`
      : (r.kipea ? 'kipeä' : 'varamies');
    const cls = r.kipea ? 'sick' : (inTeam ? '' : 'varamies');
    html += `<tr class="${cls}">` +
      `<td>${esc(r.nimi)}</td>` +
      `<td>${esc(r.sarja)} (${genderLabel(r)})</td>` +
      `<td><select onchange="setToive(${idx}, this.value)">${[null,1,2,3,4,5].map(n => `<option value="${n || ''}" ${r.toive === n ? 'selected' : ''}>${n ? 'Joukkue ' + n : '—'}</option>`).join('')}</select></td>` +
      `<td><span class="stepper"><button class="stp" onclick="bumpScore(${idx}, 'nopeus', -1)" ${r.nopeus <= 0 ? 'disabled' : ''}>−</button><span class="stp-val">${r.nopeus * 10}%</span><button class="stp" onclick="bumpScore(${idx}, 'nopeus', 1)" ${r.nopeus >= 10 ? 'disabled' : ''}>+</button></span></td>` +
      `<td><span class="stepper"><button class="stp" onclick="bumpScore(${idx}, 'luotettavuus', -1)" ${r.luotettavuus <= 0 ? 'disabled' : ''}>−</button><span class="stp-val">${r.luotettavuus * 10}%</span><button class="stp" onclick="bumpScore(${idx}, 'luotettavuus', 1)" ${r.luotettavuus >= 10 ? 'disabled' : ''}>+</button></span></td>` +
      `<td>${strengthOf(r).toFixed(1)}</td>` +
      `<td><input type="checkbox" style="width:auto;" ${r.kipea ? 'checked' : ''} onchange="setSick(${idx}, this.checked)"></td>` +
      `<td class="til">${til}</td></tr>`;
  });
  html += '</tbody></table></div>';
  wrap.innerHTML = html;
}

function togglePool() {
  S.showPool = getEl('showPool').checked;
  autosave();
  const tbl = getEl('poolTableWrap');
  if (tbl) tbl.style.display = S.showPool ? '' : 'none';
}

function toggleRules() {
  S.showRules = getEl('showRules').checked;
  getEl('teamsCard').classList.toggle('no-rules', !S.showRules);
  autosave();
}

function renderChips() {
  const wrap = getEl('chipsWrap');
  const un = S.runners.length ? unassignedRunners() : [];
  if (!S.teams.length || !un.length) { wrap.innerHTML = ''; return; }
  let html = '<h3>Varamiehet (vedä joukkuelistaan)</h3><div class="chips">';
  un.forEach(r => {
    html += `<span class="chip ${r.kipea ? 'sick' : ''}" draggable="true"
      data-drag="${S.runners.indexOf(r)}"
      ondragstart="dragStart(event)">${esc(r.nimi)} (${esc(r.sarja)})${r.kipea ? ' ✖' : ''}</span>`;
  });
  html += '</div>';
  wrap.innerHTML = html;
}

function renderTeams() {
  const wrap = getEl('teamsWrap');
  if (!S.teams.length) { wrap.innerHTML = '<div style="color:#667;">Generoi joukkuelistat poolista (vähintään 25 juoksijaa).</div>'; return; }
  let html = '';
  S.teams.forEach((team, t) => {
    const probs = validateTeam(team, SLOTS);
    const sum = team.reduce((s, r) => s + strengthOf(r), 0);
    const col = TEAM_COLORS[t % TEAM_COLORS.length];
    html += `<div class="team-col">` +
      `<div class="team-hdr" style="background:${col}"><div class="tname">Joukkue ${t + 1} <span class="status ${probs.length ? 'err' : 'ok'}">${probs.length ? 'RIIKKI' : 'OK'}</span></div>` +
      `<div class="tmeta">vahvuus ${sum.toFixed(1)} · ${team.filter(Boolean).length}/25</div>` +
      (probs.length ? `<div class="problems">${probs.map(esc).join('<br>')}</div>` : '') +
      `</div>`;
    for (let s = 0; s < 25; s++) {
      const r = team[s];
      const valid = !r || legEligible(r, SLOTS[s].osuus);
      const tint = grpTint(s);
      html += `<div class="slot-row ${tint} ${r && !valid ? 'invalid' : ''}" data-team="${t}" data-slot="${s}" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropSlot(event, ${t}, ${s})">` +
        `<span class="slot-idx">${s + 1}</span>` +
        `<span class="slot-lab">${dispLeg(s)}</span>` +
        `<span class="slot-eh">${SLOTS[s].info}</span>` +
        (r
          ? `<span class="runner ${r.kipea ? 'sick' : ''}" draggable="${r.kipea ? 'false' : 'true'}" data-drag="${S.runners.indexOf(r)}" ondragstart="dragStart(event)" ondragover="allowDrop(event)" ondrop="dropSlot(event, ${t}, ${s})">${esc(r.nimi)} (${esc(r.sarja)})<span class="str">${strengthOf(r).toFixed(0)}${r.toive === t + 1 ? ' ★' : ''}</span></span>` +
            `<button class="sick-btn" title="Merkitse kipeäksi — poistetaan joukkuesta, ei käytetä aukkojen täytössä" onclick="setSick(${S.runners.indexOf(r)}, true)">🤒</button>` +
            `<button class="rm-btn" title="Poista joukkuesta" onclick="removeFromTeam(${t}, ${s})">✕</button>`
          : `<span class="slot-empty" ondragover="event.preventDefault()" ondrop="dropSlot(event, ${t}, ${s})">— tyhjä —</span>`) +
        `</div>`;
    }
    html += '</div>';
  });
  wrap.innerHTML = html;
}

function dragStart(e) {
  const el = e.target.closest('[data-drag]');
  if (!el) return;
  e.dataTransfer.setData('text/plain', String(el.getAttribute('data-drag')));
}

let dropEl = null;
function allowDrop(e) {
  e.preventDefault();
  clearDropHighlight();
  const el = e.currentTarget;
  if (el && el.classList) { el.classList.add('drop-over'); dropEl = el; }
}
function dragLeave(e) {
  const el = e.currentTarget;
  if (dropEl === el) clearDropHighlight();
}
function clearDropHighlight() {
  if (dropEl && dropEl.classList) dropEl.classList.remove('drop-over');
  dropEl = null;
}

function dropSlot(e, teamIdx, slotIdx) {
  e.preventDefault();
  clearDropHighlight();
  const id = parseInt(e.dataTransfer.getData('text/plain'), 10);
  if (Number.isInteger(id)) performMove(id, teamIdx, slotIdx);
}

const STEP_KEYS = ['pool', 'gen', 'save'];
const stepCollapsed = { pool: false, gen: true, save: true };
let stepManual = {};
let prevHasPool = null, prevHasTeams = null;

function toggleStep(k) {
  stepCollapsed[k] = !stepCollapsed[k];
  stepManual[k] = true;
  applySteps();
}

function updateSteps() {
  const hasPool = S.runners.length > 0;
  const hasTeams = S.teams.length > 0;
  if (hasPool !== prevHasPool || hasTeams !== prevHasTeams) stepManual = {};
  prevHasPool = hasPool; prevHasTeams = hasTeams;
  stepCollapsed.pool = stepManual.pool ? stepCollapsed.pool : hasTeams;
  stepCollapsed.gen = stepManual.gen ? stepCollapsed.gen : !hasPool;
  stepCollapsed.save = stepManual.save ? stepCollapsed.save : !hasPool;
  applySteps();
}

function applySteps() {
  for (const k of STEP_KEYS) {
    const cap = k[0].toUpperCase() + k.slice(1);
    const body = getEl('psBody' + cap), tog = getEl('stepToggle' + cap);
    if (body) body.style.display = stepCollapsed[k] ? 'none' : '';
    if (tog) tog.textContent = stepCollapsed[k] ? '▸' : '▾';
  }
}

function renderAll() {
  if (!S.teams.length) S.showPool = true;
  renderStatus();
  renderPanel();
  renderPoolTable();
  renderChips();
  renderTeams();
  updateSteps();
}

function showError(msg) {
  getEl('statusBar').innerHTML = `<span class="err">✖ ${esc(msg)}</span>`;
}

function showWarn(msg) {
  getEl('statusBar').innerHTML = `<span class="warn">⚠ ${esc(msg)}</span>`;
}

function showInfo(msg) {
  getEl('statusBar').innerHTML = `<span class="ok">✔ ${esc(msg)}</span>`;
}

function getEl(id) { return document.getElementById(id); }

function decodeText(buf) {
  const u8 = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
  try { const t = decodeURIComponent(escape(s)); if (!t.includes('\uFFFD')) return t; } catch (e) {}
  return s;
}

let poolTimer = null;
getEl('poolText').addEventListener('input', function() {
  clearTimeout(poolTimer);
  poolTimer = setTimeout(syncPool, 800);
});

getEl('poolFile').addEventListener('change', function() {
  const f = this.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    getEl('poolText').value = decodeText(rd.result);
    syncPool();
  };
  rd.readAsArrayBuffer(f);
  this.value = '';
});

getEl('loadFile').addEventListener('change', function() {
  const f = this.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      if (restoreState(JSON.parse(rd.result))) { renderAll(); applyViewState(); }
      else showError('Tiedosto ei ole kelvollinen 25-manna-suunnitelma.');
    } catch (e) { showError('JSON:n lukeminen epäonnistui: ' + e.message); }
  };
  rd.readAsText(f);
  this.value = '';
});

function loadExamplePool(count) {
  const n = count && count > 0 ? count : 55;
  const classes = [];
  const add = (k, c) => { for (let i = 0; i < k; i++) classes.push(c); };
  const teams = Math.max(1, Math.floor(n / 25));
  add(2 * teams, 'H21'); add(2 * teams, 'D21');
  add(1 * teams, 'H16'); add(1 * teams, 'H14'); add(1 * teams, 'D16'); add(1 * teams, 'D18');
  add(1 * teams, 'H50'); add(1 * teams, 'H60'); add(1 * teams, 'D40'); add(1 * teams, 'H18');
  add(1 * teams, 'D20'); add(1 * teams, 'H55'); add(1 * teams, 'H35'); add(1 * teams, 'D35');
  add(1 * teams, 'H45'); add(1 * teams, 'D45'); add(1 * teams, 'H20');
  while (classes.length < n) classes.push(Math.random() < 0.5 ? 'H21' : 'D21');
  const boys = ['Aapo','Aleksi','Antti','Eino','Esa','Jari','Jouni','Jukka','Juha','Kaapo','Kalle','Lauri','Mikko','Niilo','Olli','Paavo','Pasi','Pekka','Petri','Sami','Seppo','Teemu','Vesa','Ville'];
  const girls = ['Aino','Anni','Elina','Emma','Hanna','Heidi','Iida','Kaisa','Karoliina','Katariina','Katja','Lotta','Maija','Marja','Minna','Outi','Pauliina','Päivi','Riikka','Sanna','Satu','Suvi','Tuuli','Venla'];
  const surnames = ['Aaltonen','Aho','Hakala','Helenius','Heikkinen','Heinonen','Järvinen','Kivelä','Korhonen','Koskela','Laine','Lehtonen','Miettinen','Mäkelä','Nieminen','Nurmi','Pesonen','Ranta','Räsänen','Salmi','Salminen','Sipilä','Toivonen','Virtanen'];
  const names = new Set();
  const pool = [];
  classes.forEach((c, i) => {
    const g = c[0] === 'H' ? boys : girls;
    let nm;
    do { nm = surnames[Math.floor(Math.random() * surnames.length)] + ' ' + g[Math.floor(Math.random() * g.length)]; } while (names.has(nm));
    names.add(nm);
    const toive = Math.random() < 0.25 ? 1 + Math.floor(Math.random() * 3) : null;
    pool.push(`${c}:${nm}${toive ? ':' + toive : ''}`);
  });
  getEl('poolText').value = pool.join('\n');
  syncPool();
}

(function init() {
  if (typeof document !== 'undefined' && document.addEventListener) {
    document.addEventListener('dragend', clearDropHighlight);
  }
  if (typeof localStorage !== 'undefined') {
    try {
      const raw = localStorage.getItem('25manna_state_v1');
      if (raw) { if (restoreState(JSON.parse(raw))) { renderAll(); applyViewState(); return; } }
    } catch (e) {}
  }
  renderAll();
  applyViewState();
})();

function applyViewState() {
  const rules = getEl('showRules');
  if (rules) rules.checked = S.showRules;
  getEl('teamsCard').classList.toggle('no-rules', !S.showRules);
}
</script>
