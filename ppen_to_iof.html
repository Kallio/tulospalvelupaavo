<head>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #e8e8e8; color: #222; }

#top {
  position: fixed; top: 0; left: 0; bottom: 0; width: 370px;
  background: #1a1a2e; color: #eee; padding: 12px;

}
.ps { background: #16213e; border-radius: 8px; padding: 10px 12px; flex: none; min-width: 0; }
.ps:last-child { margin-top: auto; }
.ps h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #7ec8e3; margin-bottom: 8px; }
.ps label { display: block; font-size: 11px; color: #9aa; margin-bottom: 3px; margin-top: 6px; }
.ps label:first-of-type { margin-top: 0; }
textarea, input[type="text"], input[type="number"], select {
  width: 100%; padding: 5px 7px; background: #0f3460; border: 1px solid #334;
  border-radius: 4px; color: #eee; font-size: 12px;
}
textarea { font-family: ui-monospace, Menlo, Consolas, monospace; resize: vertical; }
button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
button:disabled { opacity: .45; cursor: not-allowed; }
.bp { background: #e94560; color: #fff; }
.bs { background: #27ae60; color: #fff; }
.bg { background: #0f3460; color: #7ec8e3; border: 1px solid #334; }
.btn-sm { padding: 3px 8px; font-size: 11px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
.chk { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9aa; }
.chk input { width: auto; }

.file-row {
  background: #0a2a50; border-radius: 6px; padding: 6px 8px; margin-bottom: 6px;
  border: 1px solid #224;
}
.file-row .chk { font-weight: bold; color: #ddd; }
.file-meta { font-size: 10.5px; color: #8a9aaa; margin-top: 3px; display: block; }

#main { padding: 16px; margin-left: 386px; }

  #top { position: static; width: 100%; height: auto; box-shadow: 0 2px 12px rgba(0,0,0,0.5); }

}
#summary { background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; font-size: 13px; }
#summary .ok  { color: #27ae60; font-weight: bold; }

#warnings h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #e67e22; margin-bottom: 6px; }
#warnings ul { margin-left: 18px; color: #a45; }
#previewWrap { background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 14px; }
#previewWrap svg { width: 100%; height: auto; }
.muted { color: #889; font-size: 12px; }
.legend { font-size: 12px; color: #445; margin-top: 8px; line-height: 1.7; }
.legend span { white-space: nowrap; margin-right: 10px; }
#saveWrap { margin-top: 14px; display: flex; gap: 10px; align-items: center; }
#saveStatus { font-size: 12px; color: #667; }
#xmlOut { width: 100%; height: 220px; font-size: 11px; }
.img-bounds { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
</style>

<script>
let lang = 'fi';
let files = [];
let lastResult = null;
let mapImage = null;
let fileSeq = 0;
let hiddenAreas = new Set();

const I18N = {
  fi: {
    title: 'Purple Pen → IOF (radat)',
    step1: '1. Tiedostot',
    step1hint: 'Valitse yksi tai useampi Purple Pen -tiedosto (.ppen). Useat tiedostot yhdistetään yhdeksi CourseData-XML:ksi; yhdistettävät valitaan print-alueiden mukaan.',

    boundsLabel: 'Kartan rajat mm: left top right bottom (tyhjä = print-alue)',
    creatorLabel: 'Luoja (XML creator, tyhjä = ppen_to_iof.html)',
    step3: '3. Esikatselu',
    imgLabel: 'Karttakuva (PNG/JPG, valinnainen)',
    imgLeft: 'Left mm', imgTop: 'Top mm', imgRight: 'Right mm', imgBottom: 'Bottom mm',
    step4: '4. Lataa XML',
    downloadBtn: 'Lataa XML',
    warnHdr: 'Huomautukset',
    xmlHdr: 'IOF 3.0 CourseData -XML',
    noFiles: 'Ei ladattuja tiedostoja.',
    parseErr: 'Tiedoston jäsennys epäonnistui: ',
    sumAccepted: 'tiedostoa mukana',
    sumSkipped: 'ohitettu',
    sumCourses: 'radat: ',
    sumControls: 'rastia',
    sumStart: 'lähtö',
    sumFinish: 'maali',
    sumLen: ' m',
    previewHint: 'Lataa .ppen-tiedostoja tai esimerkki. Kursseja voi tarkastella esikatselussa; rasteja ja print-alueita voi säätää valitsemalla tiedostoja mukaan.',
    legend: 'Selite',
    areaTip: 'Klikkaa piilottaaksesi/näyttääksesi alue',
  },
  en: {
    title: 'Purple Pen → IOF (courses)',
    step1: '1. Files',
    step1hint: 'Choose one or more Purple Pen files (.ppen). Multiple files are merged into a single CourseData XML; the ones to merge are chosen by print-area overlap.',
    loadBtn: 'Load files',
    demoBtn: 'Load demo',
    clearBtn: 'Clear',
    step2: '2. Options',
    titleLabel: 'Event title (empty = from file)',
    boundsLabel: 'Map bounds mm: left top right bottom (empty = print area)',
    creatorLabel: 'Creator (XML creator, empty = ppen_to_iof.html)',
    step3: '3. Preview',
    imgLabel: 'Map image (PNG/JPG, optional)',
    imgLeft: 'Left mm', imgTop: 'Top mm', imgRight: 'Right mm', imgBottom: 'Bottom mm',
    step4: '4. Download XML',
    downloadBtn: 'Download XML',
    warnHdr: 'Warnings',
    xmlHdr: 'IOF 3.0 CourseData XML',
    noFiles: 'No files loaded.',
    parseErr: 'Failed to parse file: ',
    sumAccepted: 'files included',
    sumSkipped: 'skipped',
    sumCourses: 'courses: ',
    sumControls: 'controls',
    sumStart: 'starts',
    sumFinish: 'finishes',
    sumLen: ' m',
    previewHint: 'Load .ppen files or the demo. Preview shows the courses; controls and print areas can be toggled per file.',
    legend: 'Legend',
    areaTip: 'Click to hide/show area',
  },
};

function setLang(l) {
  lang = l;
  const t = I18N[lang];
  document.title = t.title;
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    el.textContent = t[el.getAttribute('data-i18n')];
  });
  convert();
}

function toggleLang() {
  setLang(lang === 'fi' ? 'en' : 'fi');
}

function getEl(id) { return document.getElementById(id); }

function escHtml(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function escTextXml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function escAttrXml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function unescapeXml(s) {
  return String(s)
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"').replace(/&apos;/g, "'")
    .replace(/&amp;/g, '&');
}

function miniParse(xml) {
  let pos = 0;
  const len = xml.length;
  function skipWs() {
    while (pos < len && (/\s/.test(xml[pos]) || xml.charCodeAt(pos) === 0xFEFF)) pos++;
  }
  function skipPi() {
    if (pos < len && xml[pos] === '<' && (xml[pos + 1] === '?' || (xml[pos + 1] === '!' && xml.slice(pos, pos + 4) !== '<!--'))) {
      const end = xml.indexOf('?>', pos);
      pos = end === -1 ? len : end + 2;
    } else if (xml.slice(pos, pos + 4) === '<!--') {
      const end = xml.indexOf('-->', pos);
      pos = end === -1 ? len : end + 3;
    }
  }
  function parseAttrs() {
    const attrs = {};
    while (pos < len) {
      skipWs();
      if (xml[pos] === '>' || xml[pos] === '/') return attrs;
      const m = /[^\s=/>]+/.exec(xml.slice(pos));
      if (!m) return attrs;
      const name = m[0];
      pos += m[0].length;
      skipWs();
      let value = '';
      if (xml[pos] === '=') {
        pos++;
        skipWs();
        if (xml[pos] === '"' || xml[pos] === "'") {
          const q = xml[pos];
          pos++;
          const end = xml.indexOf(q, pos);
          if (end === -1) { pos = len; } else { value = xml.slice(pos, end); pos = end + 1; }
        }
      }
      attrs[name] = unescapeXml(value);
    }
    return attrs;
  }
  function parseEl() {
    const m = /^<([^\s/>]+)/.exec(xml.slice(pos));
    const name = m[1];
    pos += m[0].length;
    const attrs = parseAttrs();
    skipWs();
    let children = [];
    let text = '';
    if (xml[pos] === '/') { pos += 2; return { name, attrs, children, text: '' }; }
    pos++;
    while (pos < len) {
      if (xml[pos] === '<') {
        if (xml.slice(pos, pos + 2) === '</') {
          const end = xml.indexOf('>', pos);
          pos = end === -1 ? len : end + 1;
          return { name, attrs, children, text };
        }
        if (xml[pos + 1] === '?' || xml.slice(pos, pos + 4) === '<!--') { skipPi(); continue; }
        children.push(parseEl());
      } else {
        const lt = xml.indexOf('<', pos);
        const chunkEnd = lt === -1 ? len : lt;
        text += xml.slice(pos, chunkEnd);
        pos = chunkEnd;
      }
    }
    return { name, attrs, children, text };
  }
  skipWs();
  skipPi();
  skipWs();
  return parseEl();
}

function childrenNamed(parent, name) {
  return (parent.children || []).filter(function (c) { return c.name === name; });
}

function childEl(parent, name) {
  const cs = childrenNamed(parent, name);
  return cs.length ? cs[0] : null;
}

function parsePpen(xmlText, name) {
  xmlText = String(xmlText).replace(/^\uFEFF/, '');
  const root = miniParse(xmlText);
  const eventEl = childEl(root, 'event');
  let mapEl = eventEl ? childEl(eventEl, 'event') : null;
  if (!mapEl && eventEl) mapEl = childEl(eventEl, 'map');
  const scale = mapEl ? parseInt(mapEl.attrs.scale || '15000', 10) : 15000;

  const pa = eventEl ? childEl(eventEl, 'print-area') : null;
  let bounds;
  if (pa) {
    bounds = {
      left: parseFloat(pa.attrs.left || '0'),
      top: parseFloat(pa.attrs.top || '0'),
      right: parseFloat(pa.attrs.right || '0'),
      bottom: parseFloat(pa.attrs.bottom || '0'),
      present: true,
    };
  } else {
    bounds = { left: 0, top: 600, right: 200, bottom: 0, present: false };
  }

  const titleEl = eventEl ? childEl(eventEl, 'title') : null;
  const title = titleEl ? titleEl.text : null;

  const controls = {};
  childrenNamed(root, 'control').forEach(function (ctrl) {
    const codeEl = childEl(ctrl, 'code');
    const loc = childEl(ctrl, 'location');
    controls[ctrl.attrs.id] = {
      kind: ctrl.attrs.kind,
      code: codeEl ? codeEl.text : null,
      x: loc ? parseFloat(loc.attrs.x || '0') : 0,
      y: loc ? parseFloat(loc.attrs.y || '0') : 0,
    };
  });

  const courses = [];
  childrenNamed(root, 'course').forEach(function (course) {
    const nameEl = childEl(course, 'name');
    const firstEl = childEl(course, 'first');
    const labelsEl = childEl(course, 'labels');
    const cpa = childEl(course, 'print-area');
    courses.push({
      name: nameEl ? nameEl.text : null,
      first_cc: firstEl ? firstEl.attrs['course-control'] : null,
      label_kind: labelsEl ? labelsEl.attrs['label-kind'] : null,
      bounds: cpa ? {
        left: parseFloat(cpa.attrs.left || '0'),
        top: parseFloat(cpa.attrs.top || '0'),
        right: parseFloat(cpa.attrs.right || '0'),
        bottom: parseFloat(cpa.attrs.bottom || '0'),
        present: true,
      } : null,
    });
  });

  const course_controls = {};
  childrenNamed(root, 'course-control').forEach(function (cc) {
    const nextEl = childEl(cc, 'next');
    course_controls[cc.attrs.id] = {
      control: cc.attrs.control,
      next: nextEl ? nextEl.attrs['course-control'] : null,
    };
  });

  return { path: name, title, scale, bounds, controls, courses, course_controls };
}

function rectArea(b) { return (b.right - b.left) * (b.top - b.bottom); }

function rectOverlaps(a, b) {
  return (Math.max(a.left, b.left) < Math.min(a.right, b.right) &&
          Math.max(a.bottom, b.bottom) < Math.min(a.top, b.top));
}

function mergePpen(files) {
  const warnings = [];
  const active = files.filter(function (f) { return f.include; });
  if (!active.length) {
    return { controls: new Map(), courses: [], courseControls: new Map(), scale: 15000, bounds: null, title: null, accepted: [], skipped: [], warnings };
  }
  const withPa = active.filter(function (f) { return f.bounds.present; });
  let biggest = null;
  let maxArea = -Infinity;
  withPa.forEach(function (f) {
    const a = rectArea(f.bounds);
    if (a > maxArea) { maxArea = a; biggest = f; }
  });

  let accepted;
  if (biggest === null) {
    accepted = active.slice();
  } else {
    accepted = [biggest];
    let pending = active.filter(function (f) { return f !== biggest; });
    let guard = 0;
    while (guard++ < 100) {
      const joining = pending.filter(function (f) {
        return accepted.some(function (a) { return rectOverlaps(f.bounds, a.bounds); });
      });
      if (!joining.length) break;
      accepted = accepted.concat(joining);
      pending = pending.filter(function (f) { return joining.indexOf(f) === -1; });
    }
    pending.forEach(function (f) {
      const reason = !f.bounds.present ? 'has no print-area' : 'print-area does not overlap the others';
      warnings.push({ text: f.name + ': ' + reason + '; skipping' });
    });
  }
  const skipped = active.filter(function (f) { return accepted.indexOf(f) === -1; });

  const mapBounds = biggest ? { left: biggest.bounds.left, top: biggest.bounds.top, right: biggest.bounds.right, bottom: biggest.bounds.bottom, present: biggest.bounds.present } : { left: active[0].bounds.left, top: active[0].bounds.top, right: active[0].bounds.right, bottom: active[0].bounds.bottom, present: active[0].bounds.present };
  const scale = accepted[0].scale;

  let title = null;
  accepted.forEach(function (f) {
    if (title === null) title = f.title;
    if (f.scale !== scale) warnings.push({ text: f.name + ': scale ' + f.scale + ', using ' + scale });
  });

  const controls = new Map();
  const courseControls = new Map();
  const courses = [];
  const seenNames = {};
  accepted.forEach(function (f) {
    const fk = '#' + f.id;
    const remap = {};
    Object.keys(f.controls).forEach(function (cid) {
      const ctrl = f.controls[cid];
      const key = ctrl.kind === 'normal' ? 'normal\x1f' + ctrl.code : ctrl.kind;
      if (!controls.has(key)) controls.set(key, { kind: ctrl.kind, code: ctrl.code, x: ctrl.x, y: ctrl.y });
      remap[cid] = key;
    });
    Object.keys(f.course_controls).forEach(function (ccid) {
      const cc = f.course_controls[ccid];
      courseControls.set(fk + '/' + ccid, {
        control: remap[cc.control],
        next: cc.next ? fk + '/' + cc.next : null,
      });
    });
    f.courses.forEach(function (course) {
      if (seenNames[course.name]) {
        warnings.push({ text: "duplicate course name '" + course.name + "' in " + f.name + '; skipping' });
        return;
      }
      seenNames[course.name] = true;
      courses.push({
        name: course.name,
        first_cc: fk + '/' + course.first_cc,
        label_kind: course.label_kind,
        bounds: course.bounds,
        file: f.id,
      });
    });
  });

  return { controls, courses, courseControls, scale, bounds: mapBounds, title, accepted, skipped, warnings };
}

function fmtCoord(v) {
  const s = String(Math.round(v * 100) / 100);
  return s.indexOf('.') === -1 ? s + '.0' : s;
}

function legLengthM(c1, c2, scale) {
  const dx = (c2.x - c1.x) * scale / 1000;
  const dy = (c2.y - c1.y) * scale / 1000;
  return Math.round(Math.hypot(dx, dy));
}

function traverseCourse(firstCc, courseControls, controls, scale) {
  const ordered = [];
  let ccid = firstCc;
  let guard = 0;
  while (ccid != null && guard++ < 500) {
    const cc = courseControls.get(ccid);
    if (!cc) break;
    const ctrl = controls.get(cc.control);
    ordered.push({ key: cc.control, ctrl: ctrl || { kind: 'normal', code: null, x: 0, y: 0 } });
    ccid = cc.next;
  }
  const legs = [];
  let total = 0;
  for (let i = 0; i < ordered.length - 1; i++) {
    const d = legLengthM(ordered[i].ctrl, ordered[i + 1].ctrl, scale);
    legs.push(d);
    total += d;
  }
  return { ordered, legs, total };
}

function el(name, attrs, children, text) {
  return { name, attrs: attrs || [], children: children || null, text: text != null ? String(text) : null };
}

function serializeXml(node, indent) {
  const pad = '  '.repeat(indent);
  const attrsStr = node.attrs.map(function (a) { return ' ' + a[0] + '="' + escAttrXml(a[1]) + '"'; }).join('');
  if (!node.children || node.children.length === 0) {
    if (node.text != null) return pad + '<' + node.name + attrsStr + '>' + escTextXml(node.text) + '</' + node.name + '>';
    return pad + '<' + node.name + attrsStr + ' />';
  }
  const inner = node.children.map(function (c) { return serializeXml(c, indent + 1); }).join('\n');
  return pad + '<' + node.name + attrsStr + '>\n' + inner + '\n' + pad + '</' + node.name + '>';
}

function nowIso() {
  return new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
}

function buildIofXml(controls, courses, courseControls, scale, mapBounds, eventTitle, createTime, creator) {
  const ns = 'http://www.orienteering.org/datastandard/3.0';
  createTime = createTime || nowIso();
  creator = creator || 'ppen_to_iof.html';

  const iofIds = new Map();
  let startN = 1;
  let finishN = 1;
  controls.forEach(function (ctrl, key) {
    if (ctrl.kind === 'start') iofIds.set(key, 'STA' + startN++);
    else if (ctrl.kind === 'finish') iofIds.set(key, 'FIN' + finishN++);
    else iofIds.set(key, ctrl.code);
  });

  const rcd = [
    el('Map', null, [
      el('Scale', null, null, scale),
      el('MapPositionTopLeft', [['x', fmtCoord(mapBounds.left)], ['y', fmtCoord(mapBounds.top)]]),
      el('MapPositionBottomRight', [['x', fmtCoord(mapBounds.right)], ['y', fmtCoord(mapBounds.bottom)]]),
    ]),
  ];

  const addControl = function (key, ctrl, type) {
    rcd.push(el('Control', [['type', type]], [
      el('Id', null, null, iofIds.get(key)),
      el('MapPosition', [['x', fmtCoord(ctrl.x)], ['y', fmtCoord(ctrl.y)]]),
    ]));
  };

  controls.forEach(function (ctrl, key) { if (ctrl.kind === 'start') addControl(key, ctrl, 'Start'); });
  const seen = {};
  controls.forEach(function (ctrl, key) {
    if (ctrl.kind !== 'normal') return;
    if (ctrl.code == null || seen[ctrl.code]) return;
    seen[ctrl.code] = true;
    addControl(key, ctrl, 'Control');
  });
  controls.forEach(function (ctrl, key) { if (ctrl.kind === 'finish') addControl(key, ctrl, 'Finish'); });

  courses.forEach(function (course) {
    const t = traverseCourse(course.first_cc, courseControls, controls, scale);
    const ccs = [];
    let controlNo = 0;
    const useSequence = course.label_kind === 'sequence';
    t.ordered.forEach(function (item, i) {
      const kind = item.ctrl.kind;
      const type = kind === 'start' ? 'Start' : kind === 'finish' ? 'Finish' : 'Control';
      const children = [el('Control', null, null, iofIds.get(item.key))];
      if (kind === 'normal') {
        controlNo++;
        if (useSequence) children.push(el('MapText', null, null, controlNo));
      }
      if (i > 0) children.push(el('LegLength', null, null, t.legs[i - 1]));
      ccs.push(el('CourseControl', [['type', type]], children));
    });
    rcd.push(el('Course', null, [
      el('Name', null, null, course.name),
      el('Length', null, null, t.total),
      el('Climb', null, null, 0),
    ].concat(ccs)));
  });

  courses.forEach(function (course) {
    rcd.push(el('ClassCourseAssignment', null, [
      el('ClassName', null, null, course.name),
      el('CourseName', null, null, course.name),
    ]));
  });

  const root = el('CourseData', [['xmlns', ns], ['iofVersion', '3.0'], ['createTime', createTime], ['creator', creator]], [
    el('Event', null, [el('Name', null, null, eventTitle)]),
    el('RaceCourseData', null, rcd),
  ]);

  return "<?xml version='1.0' encoding='UTF-8'?>\n" + serializeXml(root, 0) + '\n';
}

/* ============================================================
   IOF 3.0 CourseData VALIDATION
   Well-formedness + structural conformance to the official
   IOF CourseData schema (datastandard-v3, IOF.xsd).
   Returns an array of human-readable error strings (empty = valid).
   ============================================================ */

function checkWellFormedXml(xml) {
  const errors = [];
  const stack = [];
  let pos = 0;
  const len = xml.length;
  function findTagEnd(from) {
    let i = from + 1;
    let q = null;
    while (i < len) {
      const c = xml[i];
      if (q) { if (c === q) q = null; }
      else if (c === '"' || c === "'") q = c;
      else if (c === '>') return i;
      i++;
    }
    return -1;
  }
  while (pos < len) {
    const lt = xml.indexOf('<', pos);
    if (lt === -1) break;
    if (xml.slice(lt, lt + 4) === '<!--') {
      const end = xml.indexOf('-->', lt);
      if (end === -1) { errors.push('unclosed comment'); break; }
      pos = end + 3; continue;
    }
    if (xml.slice(lt, lt + 2) === '<?') {
      const end = xml.indexOf('?>', lt);
      if (end === -1) { errors.push('unclosed processing instruction'); break; }
      pos = end + 2; continue;
    }
    if (xml.slice(lt, lt + 2) === '<!') {
      const end = xml.indexOf('>', lt);
      if (end === -1) { errors.push('unclosed declaration'); break; }
      pos = end + 1; continue;
    }
    const gt = findTagEnd(lt);
    if (gt === -1) { errors.push('unclosed tag'); break; }
    const raw = xml.slice(lt, gt + 1);
    const m = /^<\s*(\/?)\s*([^\s/>]+)([\s\S]*?)\s*(\/?)>$/.exec(raw);
    if (!m) { errors.push('malformed tag: ' + raw.slice(0, 40)); pos = gt + 1; continue; }
    const closing = m[1] === '/';
    const name = m[2];
    const selfClose = m[4] === '/';
    if (closing) {
      const top = stack.pop();
      if (top !== name) errors.push('mismatched </' + name + '> (expected </' + (top || '') + '>)');
    } else if (!selfClose) {
      stack.push(name);
    }
    pos = gt + 1;
  }
  if (stack.length) errors.push('unclosed tag <' + stack[stack.length - 1] + '>');
  return errors;
}

function assertChildOrder(children, allowed, errors, ctx) {
  let a = 0;
  for (const c of children) {
    while (a < allowed.length && allowed[a].name !== c.name) a++;
    if (a >= allowed.length) {
      errors.push(ctx + ': unexpected <' + c.name + '>');
      return;
    }
    if (!allowed[a].repeat) a++;
  }
}

function isNum(v) { return v !== '' && isFinite(Number(v)); }

function validateIofXml(xml) {
  const errors = [];
  errors.push.apply(errors, checkWellFormedXml(xml));
  if (errors.length) return errors;

  const root = miniParse(xml);
  if (root.name !== 'CourseData') {
    errors.push('root element must be <CourseData>, got <' + root.name + '>');
    return errors;
  }
  const NS = 'http://www.orienteering.org/datastandard/3.0';
  if (root.attrs.xmlns !== NS) errors.push('root xmlns must be "' + NS + '"');
  if (root.attrs.iofVersion !== '3.0') errors.push('iofVersion must be "3.0"');
  if (!root.attrs.createTime) errors.push('missing createTime attribute');
  if (root.attrs.creator == null) errors.push('missing creator attribute');

  assertChildOrder(root.children, [{ name: 'Event' }, { name: 'RaceCourseData', repeat: true }], errors, 'CourseData');

  const eventEl = childEl(root, 'Event');
  if (!eventEl) {
    errors.push('CourseData requires an <Event> element');
  } else if (!childEl(eventEl, 'Name')) {
    errors.push('Event requires a <Name> element');
  }

  const rcds = childrenNamed(root, 'RaceCourseData');
  if (!rcds.length) errors.push('CourseData requires at least one <RaceCourseData> element');

  const courseNames = [];
  const ctrlIds = new Set();
  const assignments = [];

  rcds.forEach(function (rcd, r) {
    const ctx = 'RaceCourseData' + (rcds.length > 1 ? ' #' + (r + 1) : '');
    assertChildOrder(rcd.children, [
      { name: 'Map', repeat: true },
      { name: 'Control', repeat: true },
      { name: 'Course', repeat: true },
      { name: 'ClassCourseAssignment', repeat: true },
    ], errors, ctx);

    childrenNamed(rcd, 'Map').forEach(function (map) {
      assertChildOrder(map.children, [
        { name: 'Scale' }, { name: 'MapPositionTopLeft' }, { name: 'MapPositionBottomRight' },
      ], errors, ctx + '/Map');
      const scale = childEl(map, 'Scale');
      if (scale && !isNum(scale.text)) errors.push(ctx + '/Map: <Scale> must be a number');
      ['MapPositionTopLeft', 'MapPositionBottomRight'].forEach(function (pn) {
        const p = childEl(map, pn);
        if (p) {
          if (!isNum(p.attrs.x) || !isNum(p.attrs.y)) errors.push(ctx + '/Map: <' + pn + '> requires numeric x/y attributes');
        } else {
          errors.push(ctx + '/Map: missing <' + pn + '>');
        }
      });
    });

    childrenNamed(rcd, 'Control').forEach(function (c) {
      const type = c.attrs.type || 'Control';
      if (['Start', 'Control', 'Finish', 'CrossingPoint', 'EndOfMarkedRoute'].indexOf(type) === -1) {
        errors.push(ctx + ': invalid Control type "' + type + '"');
      }
      const id = childEl(c, 'Id');
      if (!id) errors.push(ctx + ': Control missing <Id>');
      else if (ctrlIds.has(id.text)) errors.push(ctx + ': duplicate Control <Id>' + id.text);
      else ctrlIds.add(id.text);
      const mp = childEl(c, 'MapPosition');
      if (mp && (!isNum(mp.attrs.x) || !isNum(mp.attrs.y))) errors.push(ctx + ': <MapPosition> requires numeric x/y attributes');
    });

    childrenNamed(rcd, 'Course').forEach(function (course) {
      const cctx = ctx + '/Course "' + (childEl(course, 'Name') || {}).text + '"';
      assertChildOrder(course.children, [
        { name: 'Name' }, { name: 'Length' }, { name: 'Climb' }, { name: 'CourseControl', repeat: true },
      ], errors, cctx);
      const nm = childEl(course, 'Name');
      if (nm) {
        if (!nm.text) errors.push(cctx + ': <Name> must not be empty');
        else if (courseNames.indexOf(nm.text) !== -1) errors.push('duplicate Course <Name>: ' + nm.text);
        else courseNames.push(nm.text);
      } else {
        errors.push(cctx + ': missing <Name>');
      }
      const lenEl = childEl(course, 'Length');
      if (lenEl && (!isNum(lenEl.text) || Number(lenEl.text) < 0)) errors.push(cctx + ': <Length> must be a non-negative number');
      const climb = childEl(course, 'Climb');
      if (climb && (!isNum(climb.text) || Number(climb.text) < 0)) errors.push(cctx + ': <Climb> must be a non-negative number');

      const ccs = childrenNamed(course, 'CourseControl');
      if (ccs.length < 2) errors.push(cctx + ': needs at least 2 <CourseControl> elements');
      ccs.forEach(function (cc, i) {
        const ctrl = childEl(cc, 'Control');
        if (!ctrl) errors.push(cctx + ': CourseControl missing <Control>');
        else if (!ctrlIds.has(ctrl.text)) errors.push(cctx + ': CourseControl references unknown control "' + ctrl.text + '"');
        const type = cc.attrs.type || 'Control';
        if (i === 0 && type !== 'Start') errors.push(cctx + ': first CourseControl must be type Start');
        if (i === ccs.length - 1 && type !== 'Finish') errors.push(cctx + ': last CourseControl must be type Finish');
        if (i > 0 && i < ccs.length - 1 && type !== 'Control') errors.push(cctx + ': middle CourseControl ' + (i + 1) + ' must be type Control');
        if (i > 0) {
          const ll = childEl(cc, 'LegLength');
          if (ll && (!isNum(ll.text) || Number(ll.text) < 0)) errors.push(cctx + ': <LegLength> must be a non-negative number');
        }
      });
    });

    childrenNamed(rcd, 'ClassCourseAssignment').forEach(function (a) {
      const cls = childEl(a, 'ClassName');
      const crs = childEl(a, 'CourseName');
      if (!cls) errors.push(ctx + ': ClassCourseAssignment missing <ClassName>');
      if (!crs) errors.push(ctx + ': ClassCourseAssignment missing <CourseName>');
      if (crs && crs.text) assignments.push(crs.text);
    });
  });

  assignments.forEach(function (n) {
    if (courseNames.indexOf(n) === -1) errors.push('ClassCourseAssignment references unknown course "' + n + '"');
  });

  return errors;
}

const PALETTE = ['#e94560', '#27ae60', '#7ec8e3', '#f39c12', '#9b59b6', '#16a085', '#e67e22', '#2ecc71', '#8e44ad', '#d35400'];

function toSvgRect(r) {
  return { x: r.left, y: -r.top, w: r.right - r.left, h: r.top - r.bottom };
}

const MARK = { control: 1.75, start: 2.6, finishOuter: 2.1, finishInner: 1.3, stroke: 0.4 };

function markerSvg(kind, k) {
  const s = function (v) { return fmtCoord(v * k); };
  if (kind === 'start') {
    const r = MARK.start;
    const pts = [];
    for (let a = 0; a < 3; a++) {
      const ang = Math.PI / 2 + a * 2 * Math.PI / 3;
      pts.push(s(r * Math.cos(ang)) + ',' + s(r * Math.sin(ang)));
    }
    return '<polygon points="' + pts.join(' ') + '" fill="none" stroke="#333" stroke-width="' + s(MARK.stroke) + '" stroke-linejoin="round" />';
  }
  if (kind === 'finish') {
    return '<circle r="' + s(MARK.finishOuter) + '" fill="none" stroke="#333" stroke-width="' + s(MARK.stroke) + '" /><circle r="' + s(MARK.finishInner) + '" fill="none" stroke="#333" stroke-width="' + s(MARK.stroke) + '" />';
  }
  return '<circle r="' + s(MARK.control) + '" fill="none" stroke="#333" stroke-width="' + s(MARK.stroke) + '" />';
}

function startRotation(ordered, i) {
  if (i + 1 >= ordered.length) return '';
  const a = ordered[i].ctrl;
  const b = ordered[i + 1].ctrl;
  const dx = b.x - a.x;
  const dySvg = -(b.y - a.y);
  const deg = Math.atan2(dySvg, dx) * 180 / Math.PI + 90;
  return ' rotate(' + fmtCoord(deg) + ')';
}

function renderSvg(merge, bounds) {
  const wrap = getEl('previewWrap');
  if (!merge.courses.length) {
    wrap.innerHTML = '<p class="muted">' + escHtml(I18N[lang].noFiles) + '</p>';
    return;
  }
  const xs = [];
  const ys = [];
  const union = function (r) { xs.push(r.left, r.right); ys.push(r.top, r.bottom); };
  union(bounds);
  merge.accepted.forEach(function (f) {
    union(f.bounds);
    f.courses.forEach(function (c) { if (c.bounds) union(c.bounds); });
  });

  const img = mapImage && mapImage.dataUrl ? {
    dataUrl: mapImage.dataUrl,
    left: parseFloat(getEl('imgL').value || '0'),
    top: parseFloat(getEl('imgT').value || '0'),
    right: parseFloat(getEl('imgR').value || '0'),
    bottom: parseFloat(getEl('imgB').value || '0'),
  } : null;
  if (img) union({ left: img.left, top: img.top, right: img.right, bottom: img.bottom });

  const minX = Math.min.apply(null, xs);
  const maxX = Math.max.apply(null, xs);
  const minY = Math.min.apply(null, ys);
  const maxY = Math.max.apply(null, ys);
  const pad = (maxX - minX) * 0.05;
  const vb = [minX - pad, -(maxY + pad), (maxX - minX) + pad * 2, (maxY - minY) + pad * 2]
    .map(function (v) { return fmtCoord(v); }).join(' ');
  const k = Math.min(4, Math.max(0.5, Math.min(maxX - minX, maxY - minY) / 140));
  const s = function (v) { return fmtCoord(v * k); };

  const pieces = ['<svg viewBox="' + vb + '" xmlns="http://www.w3.org/2000/svg">'];
  pieces.push('<rect x="' + (minX - pad) + '" y="' + (-(maxY + pad)) + '" width="' + ((maxX - minX) + pad * 2) + '" height="' + ((maxY - minY) + pad * 2) + '" fill="#fff" />');

  if (img) {
    const r = toSvgRect({ left: img.left, top: img.top, right: img.right, bottom: img.bottom });
    pieces.push('<image href="' + img.dataUrl + '" x="' + r.x + '" y="' + r.y + '" width="' + r.w + '" height="' + r.h + '" preserveAspectRatio="none" opacity="0.85" />');
  }

  const crsKey = function (name) { return 'crs:' + String(name).replace(/[^A-Za-z0-9._-]+/g, '_'); };
  const hidden = function (key) { return hiddenAreas.has(key); };
  const areaTip = ' title="' + escAttrXml(I18N[lang].areaTip) + '"';

  merge.accepted.forEach(function (f, fi) {
    if (hidden('evt:' + f.id)) return;
    const er = toSvgRect(f.bounds);
    const col = PALETTE[fi % PALETTE.length];
    pieces.push('<rect data-area="evt:' + f.id + '" x="' + er.x + '" y="' + er.y + '" width="' + er.w + '" height="' + er.h + '" fill="rgba(150,150,150,0.08)" stroke="' + col + '" stroke-width="' + s(0.5) + '" stroke-dasharray="' + s(3) + ',' + s(2) + '" pointer-events="all" class="area" style="cursor:pointer"' + areaTip + ' onclick="toggleArea(\'evt:' + f.id + '\')" />');
    pieces.push('<text x="' + s(er.x / k + 1.5) + '" y="' + s(er.y / k + (2 + fi * 3)) + '" font-size="' + s(2.5) + '" font-weight="bold" fill="#444" paint-order="stroke" stroke="#fff" stroke-width="' + s(0.4) + '">' + escTextXml(f.name) + '</text>');
  });

  let ci = 0;
  merge.courses.forEach(function (course) {
    const col = PALETTE[ci % PALETTE.length];
    if (course.bounds && !hidden(crsKey(course.name))) {
      const cr = toSvgRect(course.bounds);
      pieces.push('<rect data-area="' + crsKey(course.name) + '" x="' + cr.x + '" y="' + cr.y + '" width="' + cr.w + '" height="' + cr.h + '" fill="' + col + '" opacity="0.12" pointer-events="all" class="area" style="cursor:pointer"' + areaTip + ' onclick="toggleArea(\'' + crsKey(course.name) + '\')" />');
    }
    ci++;
  });

  const mb = toSvgRect(bounds);
  pieces.push('<rect x="' + mb.x + '" y="' + mb.y + '" width="' + mb.w + '" height="' + mb.h + '" fill="none" stroke="#2d6cdf" stroke-width="' + s(1) + '" />');

  merge.accepted.forEach(function (f) {
    if (!hidden('evt:' + f.id)) return;
    const er = toSvgRect(f.bounds);
    pieces.push('<rect data-area="evt:' + f.id + '" data-ghost="1" x="' + er.x + '" y="' + er.y + '" width="' + er.w + '" height="' + er.h + '" fill="none" stroke="#999" stroke-width="' + s(0.5) + '" stroke-dasharray="' + s(3) + ',' + s(2) + '" opacity="0.4" pointer-events="all" class="area" style="cursor:pointer"' + areaTip + ' onclick="toggleArea(\'evt:' + f.id + '\')" />');
  });
  merge.courses.forEach(function (course) {
    if (!course.bounds || !hidden(crsKey(course.name))) return;
    const cr = toSvgRect(course.bounds);
    pieces.push('<rect data-area="' + crsKey(course.name) + '" data-ghost="1" x="' + cr.x + '" y="' + cr.y + '" width="' + cr.w + '" height="' + cr.h + '" fill="none" stroke="#999" stroke-width="' + s(0.5) + '" stroke-dasharray="' + s(3) + ',' + s(2) + '" opacity="0.4" pointer-events="all" class="area" style="cursor:pointer"' + areaTip + ' onclick="toggleArea(\'' + crsKey(course.name) + '\')" />');
  });

  const legend = [];
  const drawn = {};
  ci = 0;
  merge.courses.forEach(function (course) {
    const col = PALETTE[ci % PALETTE.length];
    const courseHidden = hidden(crsKey(course.name)) || hidden('evt:' + course.file);
    const t = traverseCourse(course.first_cc, merge.courseControls, merge.controls, merge.scale);
    legend.push('<span style="color:' + col + (courseHidden ? ';opacity:.35' : '') + '">&#9632; ' + escHtml(course.name) + ' (' + t.total + ' m)</span>');
    if (courseHidden) { ci++; return; }
    const pts = t.ordered.map(function (o) { return fmtCoord(o.ctrl.x) + ',' + fmtCoord(-o.ctrl.y); });
    pieces.push('<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + col + '" stroke-width="' + s(0.5) + '" stroke-linejoin="round" stroke-linecap="round" opacity="0.6" />');
    t.ordered.forEach(function (o, i) {
      const key = o.key;
      if (drawn[key]) return;
      drawn[key] = true;
      const c = o.ctrl;
      const sx = fmtCoord(c.x);
      const sy = fmtCoord(-c.y);
      const rot = c.kind === 'start' ? startRotation(t.ordered, i) : '';
      pieces.push('<g transform="translate(' + sx + ' ' + sy + ')' + rot + '">' + markerSvg(c.kind, k));
      if (c.kind === 'normal' && c.code != null) {
        pieces.push('<text y="' + s(-3.5) + '" text-anchor="middle" font-size="' + s(3) + '" font-weight="bold" fill="#222" paint-order="stroke" stroke="#fff" stroke-width="' + s(0.4) + '">' + escTextXml(c.code) + '</text>');
      }
      pieces.push('</g>');
    });
    ci++;
  });
  pieces.push('</svg>');
  pieces.push('<div class="legend"><strong>' + escHtml(I18N[lang].legend) + ': </strong>' + legend.join('') + '</div>');
  wrap.innerHTML = pieces.join('');
}

function renderSummary(merge, eventTitle, bounds) {
  const t = I18N[lang];
  const totalActive = files.filter(function (f) { return f.include; }).length;
  const parts = [];
  parts.push('<span class="ok">' + merge.accepted.length + ' ' + t.sumAccepted + '</span>');
  if (merge.skipped.length) parts.push('<span class="warn">' + merge.skipped.length + ' ' + t.sumSkipped + '</span>');
  let starts = 0, finishes = 0, normals = 0;
  merge.controls.forEach(function (ctrl) {
    if (ctrl.kind === 'start') starts++;
    else if (ctrl.kind === 'finish') finishes++;
    else if (ctrl.code != null) normals++;
  });
  parts.push(eventTitle ? '<b>' + escHtml(eventTitle) + '</b>' : '');
  parts.push(merge.courses.length + ' ' + t.sumCourses);
  parts.push(normals + ' ' + t.sumControls + ' · ' + starts + ' ' + t.sumStart + ' · ' + finishes + ' ' + t.sumFinish);
  parts.push(t.sumLen);
  parts.push(t.sumLen);
  const boundsStr = fmtCoord(bounds.left) + ' ' + fmtCoord(bounds.top) + ' ' + fmtCoord(bounds.right) + ' ' + fmtCoord(bounds.bottom);
  parts.push('mm: ' + boundsStr);
  getEl('summary').innerHTML = parts.join(' · ');
  getEl('saveStatus').textContent = totalActive ? '' : t.noFiles;
}

function syncSteps() {
  const show = files.length > 0;
  ['psStep2', 'psStep3', 'psStep4'].forEach(function (id) {
    getEl(id).style.display = show ? '' : 'none';
  });
}

function convert() {
  syncSteps();
  const totalActive = files.filter(function (f) { return f.include; }).length;
  if (!totalActive) {
    lastResult = null;
    getEl('summary').innerHTML = '<span class="err">' + escHtml(I18N[lang].noFiles) + '</span>';
    getEl('previewWrap').innerHTML = '<p class="muted">' + escHtml(I18N[lang].previewHint) + '</p>';
    getEl('xmlOut').value = '';
    getEl('saveBtn').disabled = true;
    getEl('warnings').style.display = 'none';
    return;
  }
  if (mapImage && mapImage.dataUrl) {
    mapImage.left = parseFloat(getEl('imgL').value || '0');
    mapImage.top = parseFloat(getEl('imgT').value || '0');
    mapImage.right = parseFloat(getEl('imgR').value || '0');
    mapImage.bottom = parseFloat(getEl('imgB').value || '0');
  }
  const merge = mergePpen(files);
  let bounds = merge.bounds;
  const override = parseBoundsOverride(getEl('boundsIn').value);
  if (override === 'invalid') {
    merge.warnings.push({ text: 'invalid map bounds override; using print area' });
  } else if (override) {
    bounds = { left: override.left, top: override.top, right: override.right, bottom: override.bottom };
  }
  const eventTitle = getEl('titleIn').value.trim() || merge.title || 'Event';
  const creator = getEl('creatorIn').value.trim() || 'ppen_to_iof.html';
  const xml = buildIofXml(merge.controls, merge.courses, merge.courseControls, merge.scale, bounds, eventTitle, undefined, creator);
  const verr = validateIofXml(xml);
  if (verr.length) merge.warnings.push({ text: 'IOF validation: ' + verr.join('; ') });
  lastResult = { xml, title: eventTitle, merge };
  renderSummary(merge, eventTitle, bounds);
  renderSvg(merge, bounds);
  getEl('xmlOut').value = xml;
  getEl('saveBtn').disabled = false;
  const w = merge.warnings;
  getEl('warnList').innerHTML = w.length
    ? w.map(function (x) { return '<li>' + escHtml(x.text) + '</li>'; }).join('')
    : '<li>&mdash;</li>';
  getEl('warnings').style.display = w.length ? 'block' : 'none';
}

function parseBoundsOverride(s) {
  s = (s || '').trim();
  if (!s) return null;
  const parts = s.split(/[\s,]+/).map(Number);
  if (parts.length !== 4 || parts.some(isNaN)) return 'invalid';
  return { left: parts[0], top: parts[1], right: parts[2], bottom: parts[3] };
}

function renderFiles() {
  const wrap = getEl('fileList');
  wrap.innerHTML = '';
  files.forEach(function (f, i) {
    const row = document.createElement('div');
    row.className = 'file-row';
    const title = f.title || '';
    const meta = f.courses.length + ' rataa · ' + Object.keys(f.controls).length + ' rastia · 1:' + f.scale +
      (title ? ' · ' + title : '');
    row.innerHTML = '<label class="chk"><input type="checkbox" ' + (f.include ? 'checked' : '') +
      ' onchange="setInclude(' + i + ', this.checked)"> ' + escHtml(f.name) + '</label>' +
      '<span class="file-meta">' + escHtml(meta) + '</span>';
    wrap.appendChild(row);
  });
}

function toggleArea(key) {
  if (hiddenAreas.has(key)) hiddenAreas.delete(key);
  else hiddenAreas.add(key);
  convert();
}

function addPpenFile(name, xmlText) {
  hiddenAreas.clear();
  let parsed;
  try {
    parsed = parsePpen(xmlText, name);
  } catch (e) {
    getEl('summary').innerHTML = '<span class="err">' + escHtml(I18N[lang].parseErr + (e && e.message || e)) + '</span>';
    return;
  }
  files.push({ id: ++fileSeq, name, include: true, ...parsed });
  renderFiles();
  convert();
}

function setInclude(i, checked) {
  if (files[i]) files[i].include = checked;
  convert();
}

function loadDemo() {
  Object.keys(POKAALIJAHTI_DEMO).forEach(function (n) { addPpenFile(n, POKAALIJAHTI_DEMO[n]); });
}

function clearAll() {
  files.splice(0);
  fileSeq = 0;
  hiddenAreas.clear();
  mapImage = null;
  lastResult = null;
  getEl('filesInput').value = '';
  getEl('mapImgInput').value = '';
  getEl('titleIn').value = '';
  getEl('boundsIn').value = '';
  getEl('creatorIn').value = '';
  ['imgL', 'imgT', 'imgR', 'imgB'].forEach(function (id) { getEl(id).value = ''; });
  renderFiles();
  convert();
}

function setMapImage(dataUrl) {
  mapImage = { dataUrl };
  const b = lastResult && lastResult.merge ? lastResult.merge.bounds : null;
  getEl('imgL').value = b ? String(b.left) : '';
  getEl('imgT').value = b ? String(b.top) : '';
  getEl('imgR').value = b ? String(b.right) : '';
  getEl('imgB').value = b ? String(b.bottom) : '';
  convert();
}

function download() {
  if (!lastResult) return;
  const blob = new Blob([lastResult.xml], { type: 'application/xml;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (lastResult.title || 'course-data').replace(/[^\w-]+/g, '_') + '.xml';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function init() {
  setLang('fi');
  getEl('filesInput').addEventListener('change', function () {
    Array.from(this.files || []).forEach(function (f) {
      if (!/\.ppen$/i.test(f.name)) return;
      const reader = new FileReader();
      reader.onload = function () { addPpenFile(f.name, String(reader.result)); };
      reader.readAsText(f);
    });
  });
  getEl('mapImgInput').addEventListener('change', function () {
    const f = (this.files || [])[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = function () { setMapImage(String(reader.result)); };
    reader.readAsDataURL(f);
  });
  getEl('titleIn').addEventListener('input', convert);
  getEl('boundsIn').addEventListener('input', convert);
  ['imgL', 'imgT', 'imgR', 'imgB'].forEach(function (id) {
    getEl(id).addEventListener('input', convert);
  });
}
init();
